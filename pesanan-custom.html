<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060606">
<title>Positif · Kaos Custom</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tema mengikuti Positif POS: gelap futuristik, aksen lime, huruf Barlow */
:root{--bg:#060606;--card:#0f0f0f;--card2:#151515;--text:#f4f4f2;--muted:#8f8f8a;--line:rgba(255,255,255,.1);--acc:#d4ff3f;--acc-t:#0a0a0a;--ok:#4ddf9a;--bad:#ff6b6b;--warn:#ffc247;--blue:#6fb8ff;--hh:62px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(900px 520px at 88% -8%,rgba(212,255,63,.07),transparent 60%),radial-gradient(760px 520px at -8% 112%,rgba(111,184,255,.05),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh;color:var(--text);font:15px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3,.cond,.num-b{font-family:"Barlow Condensed",Impact,sans-serif;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(212,255,63,.15)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--acc)}
select option,select optgroup{background:#111;color:var(--text)}
textarea{resize:vertical;min-height:64px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.f>span{padding-left:2px}
*{scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.35) transparent}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:8px 13px;cursor:pointer;white-space:nowrap;font-weight:600}
.btn:hover{border-color:var(--text)}
.btn.pri{background:var(--acc);color:var(--acc-t);border-color:var(--acc)}
.btn.pri:hover{box-shadow:0 0 22px -6px rgba(212,255,63,.6)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.sm svg.i{width:16px;height:16px}
.btn.icon{padding:7px;width:36px;height:36px}
.btn.danger{color:var(--bad)}.btn.danger:hover{border-color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn:active,.ibc:active{transform:translateY(1px)}
/* tombol ikon + keterangan kecil */
.ibc{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:54px;height:54px;padding:6px 8px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:14px;cursor:pointer;font:600 10.5px/1 Barlow,sans-serif;white-space:nowrap}
.ibc svg.i{width:20px;height:20px}
.ibc:hover{border-color:var(--acc);color:var(--acc)}
.ibc.pri{background:var(--acc);color:var(--acc-t);border-color:var(--acc);box-shadow:0 0 24px -8px rgba(212,255,63,.7)}
.ibc.pri:hover{color:var(--acc-t)}
.ibc.danger{color:var(--bad);border-color:rgba(255,107,107,.4)}.ibc.danger:hover{background:rgba(255,107,107,.1);border-color:var(--bad)}
.ibc.sm{min-width:46px;height:46px;border-radius:12px;font-size:10px}.ibc.sm svg.i{width:18px;height:18px}
.ibrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* header menu utama (sama dengan Positif POS) */
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:8px 16px;background:rgba(10,10,10,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);min-height:var(--hh)}
header.top .logo{height:34px;display:block;filter:invert(1);cursor:pointer}
header.top .logo-t{font:900 italic 26px/1 "Barlow Condensed",Impact,sans-serif;cursor:pointer}
header.top .logo-t b{color:var(--acc)}
nav.mn{display:flex;align-items:center;gap:6px;padding:6px 4px;margin-left:clamp(12px,3vw,48px);overflow-x:auto;flex:1;scrollbar-width:none}
nav.mn::-webkit-scrollbar{display:none}
nav.mn .nv,.hub button{position:relative;display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border:0;border-radius:12px;background:none;color:var(--muted);cursor:pointer;font:600 15px Barlow,sans-serif;white-space:nowrap}
nav.mn .nv .nl{display:none}nav.mn .nv.on .nl{display:inline}nav.mn .nv .cv{font-size:11px;opacity:.7}
nav.mn .nv:not(.on):hover,.hub button:hover{color:var(--text);background:rgba(128,128,128,.14)}
nav.mn .nv.on{background:var(--acc);color:var(--acc-t);box-shadow:0 0 24px -6px rgba(212,255,63,.7)}
nav.mn svg.i{width:22px;height:22px}
.bgn{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px Barlow,sans-serif;padding:0 5px;text-align:center}
.hub{display:inline-flex;align-items:stretch;flex:none;margin-left:4px;border:1px solid var(--line);border-radius:12px}
.hub .caret{padding:9px 10px 9px 2px;font-size:12px}
.dmenu{position:fixed;z-index:60;min-width:210px;background:#111;border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.45);display:none}
.dmenu.on{display:block}
.dmenu a,.dmenu .mi{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;color:var(--text);text-decoration:none;font:600 15px Barlow,sans-serif;white-space:nowrap;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.dmenu a:hover,.dmenu .mi:hover{background:var(--acc);color:var(--acc-t)}
.dmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.dmenu .accrow{display:flex;gap:6px;padding:8px 10px 10px}
#sync{font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
#sync.bad{color:var(--bad)}
.accb{border:1px solid var(--line);background:var(--bg);color:var(--text);font:600 14px Barlow,sans-serif;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.accb:hover{border-color:var(--text)}
/* kerangka: rail ikon kiri + isi */
.shell{display:flex;gap:16px;align-items:flex-start;padding:16px clamp(12px,2vw,32px) 100px}
.rail{position:sticky;top:calc(var(--hh) + 14px);flex:none;display:flex;flex-direction:column;gap:8px;padding:8px 6px;border:1px solid rgba(212,255,63,.22);border-radius:20px;background:rgba(15,15,15,.7)}
.rail button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:58px;height:58px;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--text);cursor:pointer;font:600 10px/1 Barlow,sans-serif}
.rail button svg.i{width:20px;height:20px}
.rail button:hover{border-color:var(--acc);color:var(--acc)}
.rail button.on{background:var(--acc);color:var(--acc-t);border-color:var(--acc);box-shadow:0 0 24px -6px rgba(212,255,63,.7)}
.rail hr{border:0;border-top:1px solid var(--line);margin:2px 4px;width:auto}
.content{flex:1;min-width:0}
body.embed header.top{display:none}
body.embed{--hh:0px}
/* judul halaman */
.pfh{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:0 0 16px}
.pfh h1{margin:0;font:700 34px/1.05 "Barlow Condensed",Impact,sans-serif;letter-spacing:-.01em}
.pfh p{margin:3px 0 0;color:var(--muted)}
.pfh>div:first-child{min-width:0}
.pfh .ibrow{margin-left:auto;max-width:100%;min-width:0;justify-content:flex-end}
/* kartu & panel */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.card h3{margin:0 0 10px;font:700 21px/1.1 "Barlow Condensed",Impact,sans-serif;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.card h3 .spacer{flex:1}
.card h3 .chip,.card h3 .muted{font-family:Barlow,sans-serif;letter-spacing:0}
.glow{border:1px solid rgba(212,255,63,.38);background:linear-gradient(165deg,rgba(212,255,63,.05),rgba(255,255,255,.01) 42%),var(--card);box-shadow:0 0 0 1px rgba(212,255,63,.05),0 0 26px -10px rgba(212,255,63,.5);border-radius:22px}
.olive{background:rgba(212,255,63,.13);border:1px solid rgba(212,255,63,.42);border-radius:10px;padding:8px 12px;font-weight:600}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}.small{font-size:12.5px}.right{text-align:right}.num{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.chip.lime{color:var(--acc);border-color:rgba(212,255,63,.45);background:rgba(212,255,63,.08)}
.chip.red{color:#fff;background:#b3302f;border-color:#b3302f}
.chip.amber{color:#e8a734;border:1.5px solid #c98a2e}
.chip.blue{color:var(--blue);border-color:rgba(111,184,255,.45)}
.chip.ok{color:#2fc24f;border-color:rgba(47,194,79,.4)}
/* ringkasan */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.tile span{color:var(--muted);font-size:13px}
.tile b{display:block;font:700 34px/1.1 "Barlow Condensed",Impact,sans-serif}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .search{flex:1;min-width:200px;position:relative}
.toolbar .search input{padding-left:36px;height:42px}
.toolbar .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.toolbar select{width:auto;height:42px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn{padding:7px 14px;font-size:14px;border-radius:999px}
.seg .btn.on{background:var(--acc);color:var(--acc-t);border-color:var(--acc)}
/* daftar pesanan */
.list{display:flex;flex-direction:column;gap:10px}
.oc{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px;cursor:pointer}
.oc:hover{border-color:rgba(212,255,63,.5);box-shadow:0 0 26px -12px rgba(212,255,63,.5)}
.oc .thumb{width:56px;height:56px;border-radius:14px;background:var(--bg) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line)}
.oc .t1{font-weight:600;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.oc .t2{color:var(--muted);font-size:13px;margin-top:2px}
.oc .money{text-align:right;font-size:13px}
.oc .money b{font:700 22px/1 "Barlow Condensed",sans-serif}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* editor */
.item{border:1px solid rgba(212,255,63,.25);border-radius:18px;padding:12px;background:rgba(255,255,255,.02);margin-bottom:12px}
.item.tamb{border-color:rgba(255,194,71,.55)}
.item .ih{display:grid;grid-template-columns:2fr 1.4fr 1.4fr 1.4fr;gap:8px;align-items:end}
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:12.5px;color:var(--muted);font-weight:500;text-align:left;padding:6px;border-bottom:1px solid var(--line)}
table.t td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td input,table.t td select{padding:6px 8px}
table.t tr:last-child td{border-bottom:0}
.ifoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:13px}
.ifoot b{font-family:"Barlow Condensed",sans-serif;font-size:19px}
.addons{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.addons label{display:flex;gap:6px;align-items:center;cursor:pointer}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.imgs .im{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.imgs .im img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#050505;cursor:zoom-in}
.imgs .im input{border:0;border-top:1px solid var(--line);border-radius:0;font-size:12px;padding:6px 8px}
.imgs .im .x{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.6)}
.drop{border:1.5px dashed rgba(212,255,63,.35);border-radius:14px;display:grid;place-items:center;aspect-ratio:1;color:var(--muted);cursor:pointer;text-align:center;font-size:12.5px;padding:8px}
.drop:hover{border-color:var(--acc);color:var(--acc)}
.totals{display:grid;grid-template-columns:auto auto;gap:4px 18px;justify-content:end;font-size:14px}
.totals .big{font:700 26px/1.1 "Barlow Condensed",sans-serif}
.sticky-save{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(10,10,10,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:flex-end}
.sticky-save .sum{margin-right:auto;font-size:14px}
.sticky-save .sum b{font-family:"Barlow Condensed",sans-serif;font-size:19px}
/* master */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs .btn{border-radius:14px;padding:9px 16px}
.tabs .btn.on{background:var(--acc);color:var(--acc-t);border-color:var(--acc);box-shadow:0 0 24px -8px rgba(212,255,63,.7)}
.side{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px}
.plist .btn{width:100%;justify-content:flex-start;margin-bottom:6px;border-radius:12px}
.plist .btn.on{background:rgba(212,255,63,.13);border-color:rgba(212,255,63,.6);color:var(--text)}
.pgrid input[type=number]{width:96px;text-align:right}
.scroll{overflow-x:auto}
.bcard{border:1px solid var(--line);border-radius:18px;padding:12px 14px;background:rgba(255,255,255,.02);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.bcard:hover{border-color:rgba(212,255,63,.5)}
.bcard.on{border-color:rgba(212,255,63,.8);box-shadow:0 0 30px -12px rgba(212,255,63,.6)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sup{display:grid;grid-template-columns:28px minmax(120px,1.4fr) 110px 90px 90px 110px 120px 36px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.sup.on{background:rgba(212,255,63,.06);border-radius:10px}
.uses{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.use{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.use.on{border-color:rgba(212,255,63,.55);background:rgba(212,255,63,.06)}
.use label{display:flex;gap:8px;align-items:center;flex:1;cursor:pointer;font-weight:600}
.use select{width:auto;max-width:160px;padding:5px 8px}
/* modal, toast, loading */
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.modal .box{background:#151515;border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:18px;width:min(520px,100%);box-shadow:0 24px 70px rgba(0,0,0,.65);animation:mpop .15s ease-out}
.modal .box.wide{width:min(940px,100%)}
.modal h3{margin:0 0 12px;font:700 22px "Barlow Condensed",sans-serif}
@keyframes mpop{from{opacity:0;transform:translateY(8px) scale(.98)}}
#toasts{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:rgba(24,24,24,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;padding:10px 16px;border-radius:12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.35);animation:tin .2s}
.toast span{color:#6fcf97;font-weight:700}.toast.bad span{color:#ff8a80}.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.loading{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:rgba(0,0,0,.35)}
.spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.login{max-width:400px;margin:9vh auto;padding:0 16px}
.login .card{padding:24px}
.login img{display:block;height:44px;margin:0 auto 6px;filter:invert(1)}
.warn{background:rgba(255,194,71,.08);border:1px solid rgba(255,194,71,.35);color:var(--warn);border-radius:12px;padding:8px 12px;font-size:13px}
.info{background:rgba(111,184,255,.07);border:1px solid rgba(111,184,255,.3);color:#b9dcff;border-radius:12px;padding:8px 12px;font-size:13px}
.docwrap{background:#2a2d33;border-radius:14px;padding:16px;overflow:auto}
.docwrap .page{margin:0 auto 16px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.zoom img{max-width:100%;max-height:85vh;display:block;margin:auto}
@media (max-width:1100px){.item .ih{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  header.top{gap:6px 10px;padding:6px 10px;flex-wrap:wrap}
  header.top .logo{height:28px}
  nav.mn{order:4;flex:1 0 100%;margin-left:0}
  #sync{order:2;margin-left:auto;font-size:12px}
  .accb{order:3}
  .pfh .ibrow{justify-content:flex-start;margin-left:0}
  .shell{flex-direction:column;gap:10px;padding:10px 10px 100px}
  .rail{position:static;flex-direction:row;overflow-x:auto;width:100%;border-radius:16px;scrollbar-width:none}
  body.embed .rail{top:0}
  .rail button{width:56px;height:52px;flex:none}
  .rail hr{display:none}
  .g2,.g3,.g4,.side{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .oc{grid-template-columns:44px minmax(0,1fr)}
  .oc .thumb{width:44px;height:44px}
  .oc .money{grid-column:2;text-align:left}
  .pfh h1{font-size:28px}
  .sup{grid-template-columns:28px 1fr 1fr;row-gap:6px}
}
@media (max-width:480px){#sync{display:none}.accb{margin-left:auto}}
@media (max-width:600px){input,select,textarea{font-size:16px}.item .ih{grid-template-columns:minmax(0,1fr)}}
/* ===== Dokumen A4 (putih) ===== */
.page{width:210mm;min-height:297mm;background:#fff;color:#111;padding:12mm 13mm;font:11pt/1.35 Arial,Helvetica,sans-serif;position:relative}
.page *{color:inherit}
.dh{display:flex;align-items:center;gap:14px;border-bottom:2.5px solid #555;padding-bottom:8px;margin-bottom:10px}
.dh .lg{font:900 italic 40pt/1 "Arial Black",Arial,sans-serif;letter-spacing:-1px;color:#111;white-space:nowrap}
.dh .lg img{max-height:60px;max-width:90mm;display:block}
.dh .rt{flex:1}
.dh .pill{background:#ef7b2d;color:#111;border-radius:8px;font:800 italic 15pt/1.6 Arial,sans-serif;text-align:center;letter-spacing:.5px}
.dh .ct{display:flex;gap:16px;font-size:8.5pt;font-weight:700;margin-top:4px}
.dh .ct div{white-space:pre-line}
.dt{font:900 italic 22pt/1.1 Arial,sans-serif;margin:8px 0 10px}
.kv{border-collapse:collapse;font-size:10.5pt}
.kv td{padding:3px 6px 3px 0;vertical-align:top}
.kv td.v{border-bottom:1px solid #666;min-width:58mm;text-align:center;font-weight:600}
.dred{color:#e22 !important}
.dtbl{width:100%;border-collapse:collapse;font-size:10.5pt;margin-top:6px}
.dtbl th{background:#ef7b2d;font-style:italic;font-weight:800;border:1px solid #333;padding:5px 6px}
.dtbl td{border:1px solid #333;padding:4px 6px}
.dtbl td.c{text-align:center}.dtbl td.r{text-align:right}

.hview .plist{position:sticky;top:calc(var(--hh) + 12px);align-self:start;max-height:calc(100vh - var(--hh) - 24px);overflow:auto}
.hview .plist .btn{border:1px solid rgba(212,255,63,.35)}
.hview .plist .btn.on{background:rgba(212,255,63,.12);border-color:var(--acc);color:var(--acc)}
.hview .plist select{border:1px dashed rgba(212,255,63,.35)}
.hview .card{border-color:rgba(212,255,63,.3)}
.pcard{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.hjk{display:inline-flex;align-items:center;gap:8px;font:500 14px Inter,system-ui,sans-serif;letter-spacing:0}.hjk select{width:auto;min-width:240px;height:38px}
.hppg{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.hbox{border:1px solid rgba(212,255,63,.3);border-radius:14px;padding:10px 12px;min-width:0}
.hpt input.des{width:90px;text-align:right}
@media (max-width:1000px){.hppg{grid-template-columns:minmax(0,1fr)}.hjk select{min-width:0;width:100%}.hjk{flex-wrap:wrap}}
input.uang{text-align:right;font-variant-numeric:tabular-nums}

const fmtU = v => { const d = String(v == null ? '' : v).replace(/\D/g, ''); return d ? Number(d).toLocaleString('id-ID') : ''; };
const isNumEl = el => el.type === 'number' || (el.classList && (el.classList.contains('uang') || el.classList.contains('des')));
const numEl = el => { const v = String(el.value || ''); if (el.classList.contains('uang')) return Number(v.replace(/\D/g, '')) || 0; if (el.classList.contains('des')) return parseFloat(v.replace(/\s/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')) || 0; return num(v); };
function fmtUangEl(el) { if (el.dataset.uf === el.value) return; const f = fmtU(el.value); el.value = f; el.dataset.uf = f; }
function fmtDesEl(el) { const v = String(el.value || ''); if (v && /\./.test(v) && !/,/.test(v)) el.value = v.replace('.', ','); }
document.addEventListener('input', e => {

  const f = fmtU(before); el.value = f; el.dataset.uf = f;
  let k = 0, np = 0; while (np < f.length && k < digitsBefore) { if (/\d/.test(f[np])) k++; np++; }
  try { el.setSelectionRange(np, np); } catch (x) { }
}, true);
new MutationObserver(() => { document.querySelectorAll('input.uang').forEach(fmtUangEl); document.querySelectorAll('input.des').forEach(fmtDesEl); }).observe(document.documentElement, { childList: true, subtree: true });
const num = v => { const n = Number(String(v == null ? '' : v).replace(/[^\d.-]/g, '')); return isFinite(n) ? n : 0; };

const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const parseISO = s => { if (!s) return null; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const fmtTgl = (s, opt) => { const d = parseISO(s); return d ? d.toLocaleDateString('id-ID', opt || { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' }) : '-'; };
const fmtPendek = s => fmtTgl(s, { day: '2-digit', month: 'short', year: 'numeric' });
const daysTo = s => { const d = parseISO(s); if (!d) return null; const t = parseISO(todayISO()); return Math.round((d - t) / 864e5); };

const round100 = n => Math.round(n / 100) * 100;

function toast(msg, err) {
  const box = document.getElementById('toasts'); if (!box) return;

  t.innerHTML = `<span>${err ? '!' : '&#10003;'}</span><div></div>`; t.lastChild.textContent = msg;

function loading(on) {

function modal(html, cls) {
  closeModal();
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box ${cls || ''}">${html}</div>`;

// kirim ke server: lewat google.script.run kalau aplikasi dibuka dari link Apps Script, atau fetch ke URL /exec
async function post(body, url) {
  if (GAS && !url) return new Promise((res, rej) => GAS.withSuccessHandler(t => { try { res(JSON.parse(t)); } catch (e) { rej(e); } }).withFailureHandler(e => rej(new Error(e && e.message || String(e)))).apiCall(JSON.stringify(body)));

  return res.json();
}

    const c = custOf(o, C); const nm = it.produkId.slice(3);

    const v = h ? num((h.harga || {})[r.ukuran]) : 0;
    return v ? { harga: v, info: 'harga langganan' } : { harga: null, info: 'ukuran ' + (r.ukuran || '?') + ' belum ada di harga langganan' };

  const tamb = (p.tambahan || []).filter(a => (it.addons || []).indexOf(a.nama) > -1).reduce((s, a) => s + num(a.harga), 0) + titikTotal(p, it);

  if (p.tipe === 'bebas') return { harga: null, info: '' };
  if (p.tipe === 'luas') {
    const P = num(r.p), L = num(r.l); if (!P || !L) return { harga: null, info: 'isi panjang x lebar' };
    const luas = P * L / 100; let rule = null; (p.aturan || []).forEach(a => { if (luas >= num(a.luasMin)) rule = a; });
    const tarif = rule && num((rule.tarif || {})[priceKey(p.id, it.bahan, M, () => it.bahan)]);
    if (!tarif) return { harga: null, info: 'pilih bahan' };
    let h = luas * tarif + num(rule.jahit) + num(rule.profit);
    if (agen && p.agenPct) h = round100(h * (1 - p.agenPct / 100));
    return { harga: Math.round(h) + tamb, info: 'luas ' + luas + ' x ' + tarif };
  }

  const top = isSetelan ? prodById(p.atasan, M) : p;

  const baris = findBaris(top, r.ukuran, M);
  if (!baris) return { harga: null, info: 'ukuran ' + (r.ukuran || '?') + ' tidak dikenal' };
  const key = top.bahanSumber === 'jersey' ? priceKey(top.id, it.bahan, M, () => kelasBahanJersey(it.bahan, M)) : priceKey(top.id, it.bahan, M, () => it.bahan);

  const ti = tierIndex(top.tingkat, itemQty(it));
  let h = num(arr[ti]); if (!h) { for (let k = ti; k >= 0; k--) if (num(arr[k])) { h = num(arr[k]); break; } }
  if (!h) return { harga: null, info: 'harga kosong' };
  h = agenAdj(h, num(arr[0]) || h);
  let info = baris.nama + ' · ' + tierLabel(top.tingkat, ti);
  if (isSetelan) {
    const kcId = priceKey(p.id + ':celana', it.bahanCelana, M, () => (celanaKelasOf(p, it.bahanCelana) || {}).id);
    const kc = (p.celana || []).find(k => k.id === kcId);
    if (!kc) return { harga: null, info: 'pilih bahan celana' };
    const hc = num(((p.hargaCelana || {})[kc.id] || {})[baris.nama]);
    if (!hc) return { harga: null, info: 'harga celana ' + baris.nama + ' kosong' };

}
function recalcItem(o, it, M, C) {

/* =========================================================
   KAOS CUSTOM: tahap produksi per order

const TAHAP = { desain: 'Desain', cetak: 'Cetak vendor', siapkan: 'Siapkan kaos', dtf: 'Cetak DTF', press: 'Press', cutting: 'Cutting', jahit: 'Jahit', sablon: 'Sablon', bordir: 'Bordir', qc: 'QC', packing: 'Packing', kirim: 'Kirim' };
const ALUR = {
  jersey: { nama: 'Jersey', st: ['desain', 'cetak', 'cutting', 'jahit', 'qc', 'packing', 'kirim'] },
  dtf: { nama: 'Kaos DTF', st: ['desain', 'siapkan', 'dtf', 'press', 'qc', 'packing', 'kirim'] },
  kaos: { nama: 'Kaos jahit custom', st: ['desain', 'cutting', 'jahit', 'qc', 'packing', 'kirim'] }

const OPSI_T = ['sablon', 'bordir'];

function alurOf(o) {

function stepsOf(o) {

function canTahap() {

  const m = posMe();
  if (!m) return S.user.role === 'pemilik';
  return m.role === 'owner' || m.role === 'admin' || ['prod_buat', 'prod_cutting', 'prod_jahit', 'prod_finishing'].some(k => (m.perm || []).indexOf(k) > -1);

function sizeTotals(o) {

  (o.items || []).forEach(it => (it.rows || []).forEach(r => { const q = num(r.qty); if (!q) return; const u = String(r.ukuran || '-').trim().toUpperCase() || '-'; if (!(u in t)) { t[u] = 0; ord.push(u); } t[u] += q; }));

const SZ_RE = /^(xxs|xs|s|m|l|xl|xxl|xxxl|[2-5]xl|all ?size|\d{1,2}(?:th| ?thn| ?tahun)?)$/i;
function parseChat(txt) {
  const names = [], sizes = [];
  String(txt || '').split(/\r?\n/).forEach(raw => {
    const li = /^\s*(?:\d+\s*[.)]|[-*•])\s*/.test(raw);
    let l = raw.replace(/^\s*(?:\d+\s*[.)]|[-*•])\s*/, '').replace(/[*_~]/g, '').trim();
    if (!l) return;
    // "L = 5", "XL : 3 pcs", "M 4pcs"
    let m = l.match(/^(xxs|xs|s|m|l|xl|xxl|xxxl|[2-5]xl)\s*[:=x-]?\s*(\d+)\s*(?:pcs|pc|biji|buah|potong|lembar)?$/i);
    if (m) { sizes.push({ ukuran: m[1].toUpperCase(), qty: +m[2] }); return; }
    const tk = l.split(/[\s,;|\/\t]+/).map(s => s.replace(/^[-:=]+|[-:=]+$/g, '').trim()).filter(Boolean);
    let uk = '', no = '', rest = [], ket = [];
    tk.forEach(t => {
      const u = t.replace(/[()]/g, '');
      if (!uk && /^(xxs|xs|s|m|l|xl|xxl|xxxl|[2-5]xl)$/i.test(u)) uk = u.toUpperCase();
      else if (!no && /^#?\d{1,3}$/.test(u)) no = u.replace('#', '');
      else if (/^(pjg|panjang|lp|ls|pendek)$/i.test(u)) ket.push(u);

    const nama = rest.join(' ').replace(/^(nama|name)\s*[:=]\s*/i, '').replace(/[:=-]+$/, '').trim();

  });
  return { names, sizes };
}

function waNumber(t) { let d = String(t || '').replace(/\D/g, ''); if (d.indexOf('0') === 0) d = '62' + d.slice(1); else if (d.indexOf('8') === 0) d = '62' + d; return d; }
function waOrderText(o) {
  const T = orderTotals(o), L = [];
  L.push('*' + (S.master.toko.nama || 'POSITIF') + ' ' + (S.master.toko.sub || '') + '*');
  L.push('Nota: ' + (o.no || '-'));
  L.push('Nama: ' + ((o.pelanggan || {}).nama || '-'));
  if (o.deadline) L.push('Deadline: ' + fmtTgl(o.deadline));
  L.push('', '*Rincian:*');
  o.items.forEach(it => {
    const rows = it.rows.filter(r => num(r.qty) > 0); if (!rows.length) return;
    L.push('- ' + itemFullLabel(it) + (it.tambahan ? ' (TAMBAHAN)' : ''));
    const byPrice = {};
    rows.forEach(r => { (byPrice[r.harga] = byPrice[r.harga] || []).push(r); });
    Object.keys(byPrice).forEach(h => { const rs = byPrice[h]; const q = rs.reduce((s, r) => s + num(r.qty), 0); L.push('  ' + rs.map(r => rowUkuranLabel(it, r) + ' ' + num(r.qty)).join(', ') + ' = ' + q + ' x ' + rp(h) + ' = ' + rp(q * h)); });
  });
  L.push('', 'Jumlah: ' + T.qty + ' pcs');
  if (num(o.diskon)) L.push('Diskon: -' + rp(o.diskon));
  L.push('*Total: ' + rp(T.total) + '*');
  (o.pembayaran || []).forEach((p, k) => L.push((p.ket || 'DP ' + (k + 1)) + ' (' + fmtPendek(p.tgl) + '): ' + rp(p.nominal)));
  L.push('*Sisa bayar: ' + rp(T.sisa) + '*');
  if (rekLines().length) L.push('', 'Pembayaran ke:', ...rekLines());
  L.push('', 'Terima kasih sudah order di ' + (S.master.toko.nama || 'Positif') + '.');
  return L.join('\n');
}

function getPath(o, path) { return path.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, path, v) {
  const ks = path.split('.'); let a = o;
  for (let i = 0; i < ks.length - 1; i++) { if (a[ks[i]] == null) a[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {}; a = a[ks[i]]; }
  a[ks[ks.length - 1]] = v;
}
function markDirty() { S.editDirty = true; if (S.edit && S.edit.id) document.querySelectorAll('[data-sv]').forEach(b => b.classList.add('dirty')); }
function rerenderMain() { const y = window.scrollY; document.getElementById('main').innerHTML = mainView(); afterRender(); window.scrollTo(0, y); }

document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  if (f.dataset.form === 'login') doLogin(f.u.value.trim(), f.p.value.trim());
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.ui) { S.ui[el.dataset.ui] = el.value; const pos = el.selectionStart; rerenderMain(); const n = document.querySelector(`[data-ui="${el.dataset.ui}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} } return; }
  if (el.dataset.b && S.edit && el.tagName !== 'SELECT') { onOrderInput(el); return; }
  if (el.dataset.cb && S.editCustomer) { setCustPath(el.dataset.cb, isNumEl(el) ? (el.value === '' ? 0 : numEl(el)) : el.value); return; }
  if (el.dataset.dp && S.edit) { dpSet(el.dataset.dp, el.dataset.dp === 'nominal' ? numEl(el) : el.value); markDirty(); if (el.dataset.dp !== 'nominal') rerenderMain(); else patchOrder(); return; }
  if (el.dataset.dl && S.edit) { S.edit.deadline = el.value; S.edit.deadlineManual = true; markDirty(); rerenderMain(); return; }
  if (el.dataset.pl) { plCfg()[el.dataset.pl] = el.value; const b = document.getElementById('plPrev'); if (b) b.innerHTML = plPage(); return; }
  if (el.dataset.hp && el.tagName !== 'SELECT') { setPath(S.hpp, el.dataset.hp, isNumEl(el) ? (el.value === '' ? '' : numEl(el)) : el.value); S.hppDirty = true; return; }
  if (S.mEdit && (el.dataset.mb || el.dataset.mbList || el.dataset.mprice || el.dataset.mcel || el.dataset.mopsi) && el.tagName !== 'SELECT') { if (!el.dataset.rename) onMasterInput(el, false); return; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.ui) { S.ui[el.dataset.ui] = el.value; rerenderMain(); return; }
  if (el.dataset.actChange) { ACT_CHANGE[el.dataset.actChange] && ACT_CHANGE[el.dataset.actChange](el, e); return; }
  if (el.dataset.b && S.edit) { onOrderInput(el, true); return; }
  if (el.dataset.cb && S.editCustomer) { const re = setCustPath(el.dataset.cb, isNumEl(el) ? (el.value === '' ? 0 : numEl(el)) : el.value); if (re || el.dataset.re) rerenderMain(); return; }
  if (el.dataset.dp && S.edit) { dpSet(el.dataset.dp, el.dataset.dp === 'nominal' ? numEl(el) : el.value); markDirty(); rerenderMain(); return; }
  if (el.dataset.dl && S.edit) { S.edit.deadline = el.value; S.edit.deadlineManual = true; markDirty(); rerenderMain(); return; }
  if (el.dataset.hp) { setPath(S.hpp, el.dataset.hp, isNumEl(el) ? (el.value === '' ? '' : numEl(el)) : el.value); S.hppDirty = true; if (el.dataset.re) rerenderMain(); return; }
  if (S.mEdit && (el.dataset.mb || el.dataset.mbList || el.dataset.mprice || el.dataset.mcel || el.dataset.mopsi)) { onMasterInput(el, true); if (el.dataset.mprice && S.view === 'harga' && isOwnerHpp()) rerenderMain(); return; }
});

function onOrderInput(el, committed) {
  const o = S.edit, path = el.dataset.b;
  let v = el.value;
  if (isNumEl(el)) v = el.value === '' ? 0 : numEl(el);
  setPath(o, path, v);
  if (path === 'status') o.tahap = '';
  markDirty();
  const m = path.match(/^items\.(\d+)\.rows\.(\d+)\.harga$/);
  if (m) {
    const r = o.items[+m[1]].rows[+m[2]]; r.manual = el.value !== '';
    const hasBtn = !!document.querySelector(`[data-act="autoPrice"][data-i="${m[1]}"][data-j="${m[2]}"]`);
    const isBebas = (prodById(o.items[+m[1]].produkId) || {}).tipe === 'bebas';
    if (committed && !isBebas && hasBtn !== r.manual) rerenderMain(); else patchOrder();
    return;
  }
  if (path === 'pelanggan.nama' && committed) {
    const c = S.customers.find(x => x.nama.toLowerCase() === String(v).trim().toLowerCase());
    if (c) { o.pelanggan = { custId: c.id, nama: c.nama, telp: o.pelanggan.telp || c.telp || '', jenis: c.jenis || 'umum' }; }
    else { o.pelanggan.custId = ''; }
    o.items.forEach(it => recalcItem(o, it));
    rerenderMain(); return;
  }
  if (/\.produkId$/.test(path)) {
    const it = o.items[+path.split('.')[1]];
    it.bahan = ''; it.bahanCelana = ''; it.addons = []; it.rows.forEach(r => { r.manual = false; });
    const p = prodById(it.produkId);
    if (p && p.tipe !== 'tabel' && p.tipe !== 'setelan' && !(p.bahan || []).length) it.bahan = '';
    if (p && p.tipe !== 'setelan' && p.tipe !== 'bebas') { const l = bahanFor(p.id); if (l.length === 1) it.bahan = l[0].nama; else if (!l.length && (p.bahan || []).length === 1 && p.bahanSumber !== 'jersey') it.bahan = p.bahan[0]; }
  }
  if (el.dataset.re || el.tagName === 'SELECT' && /^items\./.test(path)) { rerenderMain(); return; }
  if (/^(namaPunggung|gambar)\./.test(path) && committed && el.tagName === 'SELECT') { rerenderMain(); return; }
  patchOrder();
}

const ACT_CHANGE = {
  fdIn: async el => {
    const fs = Array.from(el.files || []); el.value = ''; if (!fs.length) return;
    for (const f of fs) {
      if (f.size > 20 * 1024 * 1024) { toast('"' + f.name + '" lebih dari 20 MB. Simpan di Google Drive lalu pakai Tempel link.', true); continue; }
      loading(true, 'Mengunggah ' + f.name + '…');
      try {
        const b64 = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result)); r.onerror = () => no(new Error('Gagal membaca file')); r.readAsDataURL(f); });
        let id;
        if (S.demo) id = 'demo-' + Date.now();
        else id = (await api('uploadFile', { name: f.name, mime: f.type || 'application/octet-stream', base64: b64 })).id;
        await fileAdd({ id, name: f.name, size: f.size, mime: f.type || '' }, true);
      } catch (e) { toast('Gagal unggah ' + f.name + ': ' + e.message, true); }
      finally { loading(false); }
    }
  },
  plOn: el => { plCfg().pilih[el.dataset.pid].on = el.checked; rerenderMain(); },
  plKey: el => { const s = plCfg().pilih[el.dataset.pid], k = el.dataset.k; s.keys = s.keys.filter(x => x !== k); if (el.checked) s.keys.push(k); rerenderMain(); },
  nImg: async (el) => {
    const f = el.files[0], k = el.dataset.k; el.value = ''; if (!f) return;
    loading(true);
    try {
      const data = await compressImage(f, k === 'logo' ? 900 : 700, 0.86);
      if (S.demo) S.mEdit.toko[k] = { data };
      else { const j = await api('uploadImage', { name: 'nota-' + k + '.jpg', mime: 'image/jpeg', base64: data }); S.mEdit.toko[k] = { id: j.id }; }
      S.mDirty = true; rerenderMain(); toast('Gambar dipasang. Tekan Simpan.');
    } catch (e) { toast('Gagal unggah gambar: ' + e.message, true); }
    finally { loading(false); }
  },
  addImg: async (el) => {
    const files = [...el.files]; el.value = '';
    if (!files.length) return;
    loading(true);
    try {
      for (const f of files) {
        const data = await compressImage(f, S.demo ? 1000 : 1600, S.demo ? 0.7 : 0.82);
        if (S.demo) S.edit.gambar.push({ data, ket: '' });
        else { const j = await api('uploadImage', { name: (S.edit.no || 'baru') + '-' + f.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', base64: data }); S.edit.gambar.push({ id: j.id, ket: '' }); }
      }
      markDirty(); rerenderMain(); toast(files.length + ' gambar ditambahkan');
    } catch (e) { toast('Gagal unggah gambar: ' + e.message, true); }
    finally { loading(false); }
  },
  addon: (el) => { const it = S.edit.items[+el.dataset.i]; const n = el.dataset.n; it.addons = it.addons || []; if (el.checked) { if (it.addons.indexOf(n) < 0) it.addons.push(n); } else it.addons = it.addons.filter(x => x !== n); markDirty(); patchOrder(); },
  tamb: (el) => { S.edit.items[+el.dataset.i].tambahan = el.checked; markDirty(); rerenderMain(); },
  preset: (el) => {
    const it = S.edit.items[+el.dataset.i]; const v = el.value; el.value = '';
    if (v === '') return;
    const list = v === 'semua' ? sizesForItem(S.edit, it) : S.master.presetUkuran[+v].ukuran;
    const have = it.rows.filter(r => r.ukuran || num(r.qty));
    list.forEach(u => { if (!have.some(r => String(r.ukuran).toLowerCase() === u.toLowerCase())) have.push({ ukuran: u, qty: 0, harga: 0 }); });
    it.rows = have; markDirty(); rerenderMain();
  },
  mAddProd: (el) => {
    const t = el.value; el.value = ''; if (!t) return;
    const M = S.mEdit, id = uid('p');
    const base = { id, nama: 'Produk baru', tipe: t, satuan: 'pcs', agenPct: 0, catatan: '', tambahan: [] };
    if (t === 'tabel') Object.assign(base, { barisDariGrup: true, tingkat: [1, 12, 24], bahan: ['Bahan 1'], harga: {} });
    if (t === 'setelan') Object.assign(base, { satuan: 'stel', atasan: 'jersey', celana: [{ id: uid('k'), nama: 'Kelas 1', bahan: ['Bahan celana'] }], hargaCelana: {} });
    if (t === 'luas') Object.assign(base, { satuan: 'lembar', bahan: ['TC'], aturan: [{ luasMin: 0, tarif: { TC: 500 }, jahit: 7000, profit: 10000 }] });
    M.produk.push(base); S.ui.prod = id; S.mDirty = true; rerenderMain();
  },
  bSup: (el) => { S.mEdit.bahan[+el.dataset.i].sup = +el.dataset.k; S.mDirty = true; rerenderMain(); },
  bUse: (el) => {
    const b = S.mEdit.bahan[+el.dataset.i], k = el.dataset.k; b.pakai = b.pakai || {};
    if (el.checked) { const u = useList(S.mEdit).find(x => x.key === k); b.pakai[k] = u && u.jersey ? (saranKelasBahan(b, S.mEdit) || (u.opts[0] || [''])[0]) : ((u && u.opts.find(o => o[0].toLowerCase() === b.nama.toLowerCase())) || (u && u.opts[0]) || [''])[0]; }
    else delete b.pakai[k];
    S.mDirty = true; rerenderMain();
  },
  mGrup: (el) => {
    const p = S.mEdit.produk[+el.dataset.pi]; p.barisDariGrup = el.checked;
    if (!el.checked && !(p.baris || []).length) p.baris = clone(S.mEdit.grupUkuran);

  }
};

function onMasterInput(el, committed) {
  const M = S.mEdit;
  if (el.dataset.mprice != null) {
    const p = M.produk[+el.dataset.mprice]; p.harga = p.harga || {};
    const k = el.dataset.key, b = el.dataset.baris, i = +el.dataset.ti;
    p.harga[k] = p.harga[k] || {}; p.harga[k][b] = p.harga[k][b] || [];
    p.harga[k][b][i] = el.value === '' ? 0 : numEl(el);
  } else if (el.dataset.mcel != null) {
    const p = M.produk[+el.dataset.mcel]; p.hargaCelana = p.hargaCelana || {};
    (p.hargaCelana[el.dataset.kid] = p.hargaCelana[el.dataset.kid] || {})[el.dataset.baris] = el.value === '' ? 0 : numEl(el);
  } else if (el.dataset.mopsi) {
    M.opsi[el.dataset.mopsi] = el.value.split('\n').map(s => s.trim()).filter(Boolean);
  } else if (el.dataset.mbList) {
    let arr = el.value.split(',').map(s => s.trim()).filter(Boolean);
    if (el.dataset.numlist) arr = arr.map(num).filter(n => n > 0).sort((a, b) => a - b);
    const old = getPath(M, el.dataset.mbList) || [];
    setPath(M, el.dataset.mbList, arr);
    // ganti nama bahan pada tabel harga ikut pindah
    const mm = el.dataset.mbList.match(/^produk\.(\d+)\.bahan$/);
    if (mm && committed && old.length === arr.length) { const p = M.produk[+mm[1]]; if (p.harga) old.forEach((o, i) => { if (o !== arr[i] && p.harga[o]) { p.harga[arr[i]] = p.harga[o]; delete p.harga[o]; } }); }
    const mc = el.dataset.mbList.match(/^produk\.(\d+)\.celana\.(\d+)\.bahan$/);
    if (mc) {}
    if (committed) { S.mDirty = true; rerenderMain(); return; }
  } else if (el.dataset.mb) {
    const old = getPath(M, el.dataset.mb);
    const v = el.type === 'checkbox' ? el.checked : isNumEl(el) ? (el.value === '' ? 0 : numEl(el)) : el.value;
    setPath(M, el.dataset.mb, v);
    if (committed && el.dataset.rename && old !== v) renameBaris(el, old, v);
    if (committed && el.dataset.re) { S.mDirty = true; rerenderMain(); return; }
  }
  S.mDirty = true;
  if (S.view === 'nota') { notaRefresh(); const h = document.querySelector('.pfh p'); if (h && h.innerHTML.indexOf('belum disimpan') < 0) h.innerHTML += ' <span class="chip amber">belum disimpan</span>'; }
}
function renameBaris(el, oldN, newN) {
  const M = S.mEdit;
  const fix = p => {
    Object.values(p.harga || {}).forEach(tb => { if (tb[oldN] != null) { tb[newN] = tb[oldN]; delete tb[oldN]; } });
    Object.values(p.hargaCelana || {}).forEach(tb => { if (tb[oldN] != null) { tb[newN] = tb[oldN]; delete tb[oldN]; } });
  };
  if (el.dataset.rename === 'grup') M.produk.forEach(p => { if (p.barisDariGrup || p.tipe === 'setelan') fix(p); });
  else fix(M.produk[+el.dataset.pi]);
  rerenderMain();
}

async function leaveEdit() {
  if (S.view === 'order' && S.edit && S.editDirty && S.user.role === 'pemilik') return await ask('Perubahan pesanan belum disimpan. Tinggalkan halaman ini?');
  if (MASTER_VIEWS.indexOf(S.view) > -1 && S.mDirty) { if (!(await ask('Perubahan master belum disimpan. Tinggalkan?'))) return false; S.mEdit = clone(S.master); S.mDirty = false; }
  return true;
}
function upsertLocal(arr, x) { const i = arr.findIndex(a => a.id === x.id); if (i > -1) arr[i] = x; else arr.push(x); }
function normalizeOrder(o) {
  o.pelanggan = o.pelanggan || { nama: '', telp: '', jenis: 'umum' }; o.model = o.model || {};
  o.items = o.items || []; o.namaPunggung = o.namaPunggung || []; o.pembayaran = o.pembayaran || []; o.gambar = o.gambar || [];
  o.items.forEach(it => { it.rows = it.rows || []; it.addons = it.addons || []; if (!it.id) it.id = uid('i'); });
  return o;
}
async function saveOrder() {
  const o = S.edit;
  if (!o.pelanggan.nama.trim()) { toast('Nama customer wajib diisi.', true); return; }
  o.items.forEach(it => { it.rows = it.rows.filter(r => num(r.qty) > 0 || num(r.harga) > 0 || r.ukuran || r.ket); });
  o.items = o.items.filter(it => it.rows.length);
  if (!o.items.length) { toast('Isi minimal satu item dengan qty.', true); o.items.push(newItem()); rerenderMain(); return; }
  const kosong = [];
  o.items.forEach(it => it.rows.forEach(r => { if (num(r.qty) > 0 && !num(r.harga)) kosong.push(itemLabel(it) + ' ' + rowUkuranLabel(it, r)); }));
  if (kosong.length && !(await ask('Ada baris tanpa harga:\n- ' + kosong.slice(0, 6).join('\n- ') + '\n\nTetap simpan?'))) return;
  o.pelanggan.nama = o.pelanggan.nama.trim();
  loading(true);
  try {
    // pelanggan baru otomatis masuk daftar
    if (!custOf(o)) {
      const j = await api('saveCustomer', { customer: { id: '', nama: o.pelanggan.nama, telp: o.pelanggan.telp || '', jenis: o.pelanggan.jenis || 'umum', ukuranKhusus: ['XS', 'S', 'M', 'L', 'XL', 'XXL', '3XL'], hargaKhusus: [] } });
      upsertLocal(S.customers, j.customer); o.pelanggan.custId = j.customer.id;
    } else o.pelanggan.custId = custOf(o).id;
    const j = await api('saveOrder', { order: o });
    upsertLocal(S.orders, j.order);
    S.edit = normalizeOrder(clone(j.order)); S.editDirty = false;
    rerenderMain(); toast('Pesanan ' + j.order.no + ' disimpan');
  } catch (e) { toast(e.message, true); }
  finally { loading(false); }
}
function compressImage(file, maxSide, q) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, maxSide / Math.max(img.width, img.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', q));
      };
      img.onerror = () => rej(new Error('File bukan gambar'));
      img.src = fr.result;
    };
    fr.onerror = () => rej(new Error('Gagal membaca file'));
    fr.readAsDataURL(file);
  });
}

/* ---------- mulai ---------- */
(async function start() {
  S.embed = new URLSearchParams(location.search).get('embed') === '1';
  if (GAS && typeof google !== 'undefined' && google.script.url) {
    try { await new Promise(res => { google.script.url.getLocation(l => { if (l && l.parameter && l.parameter.embed === '1') S.embed = true; res(); }); setTimeout(res, 1500); }); } catch (e) {}
  }
  const c = posCred(), ss = LS.get('ppc_session', null);
  if (!c) { LS.del('ppc_session'); render(); return; }               // belum masuk Positif POS
  if (ss && ss.user && !ss.demo && ss.token && ss.pos === c.u) {     // sesi milik akun POS yang sama
    S.user = ss.user; S.token = ss.token; if (ss.api) S.api = S.api || ss.api;
    boot(); return;
  }
  if (await posConnect()) boot();
})();
