<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kinerja — Positif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="posbar.js?v=20261125a"></script>
<style>
:root{--bg:#070707;--card:#0f0f0f;--line:#232323;--tx:#ececec;--mu:#8f8f8a;--ac:#d4ff3f;--ok:#4ddf9a;--bl:#4da3ff;--or:#ffb020;--rd:#ff6b6b;--pp:#a78bfa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Barlow,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;margin:0;letter-spacing:.01em}
.mu{color:var(--mu)}.ok{color:var(--ok)}.bad{color:var(--rd)}.warn{color:var(--or)}
/* menu samping (sama gaya dengan aplikasi Produksi) */
.lay{display:flex;gap:18px;align-items:flex-start;width:100%;min-height:calc(100vh - var(--pbh,60px));padding:16px 20px 0}
#tabs{position:sticky;top:calc(var(--pbh,60px) + 12px);z-index:20;flex:none;display:flex;flex-direction:column;gap:6px;padding:10px 8px;background:#0c0c0c;border:1px solid #5d6b1c;border-radius:24px;box-shadow:0 0 0 1px rgba(212,255,63,.06)}
#tabs .ti{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:78px;padding:12px 4px;border-radius:16px;border:0;background:transparent;color:#c9c9c4;font:700 12px/1.15 Barlow,sans-serif;text-align:center;text-decoration:none}
#tabs .ti:hover{background:#171717;color:#fff}
#tabs .ti.on{background:var(--ac);color:#0a0a0a;box-shadow:0 0 18px rgba(212,255,63,.35)}
#tabs .ti svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs .bd{position:absolute;top:4px;right:6px;background:var(--or);color:#0a0a0a;font-size:10px;line-height:1;padding:3px 5px;border-radius:999px}
#tabs hr{width:60%;border:0;border-top:1px solid #222;margin:2px auto}
.doc{font-size:16px;line-height:1.65;padding:20px 22px}
.doc h2{font-size:26px;margin:26px 0 8px;padding-top:12px;border-top:2px solid #2a2a2a}.doc h2:first-child{margin-top:0;border-top:0;padding-top:0}
.doc h3{font-size:19px;margin:18px 0 6px}.doc p{margin:0 0 12px}.doc ul,.doc ol{margin:0 0 14px;padding-left:22px}.doc li{margin:0 0 6px}
.doc .tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:10px 0 16px}.doc table{min-width:560px}.doc td,.doc th{padding:9px 12px}
.doc a{color:var(--ac)}.isi{background:#3a2f0a;color:#ffd166;padding:1px 6px;border-radius:5px;font-weight:700;font-size:.85em;white-space:nowrap}
.bck{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid currentColor}
.bB{color:var(--ok)}.bC{color:var(--or)}.bK{color:var(--rd)}
select.bsel{width:auto;min-height:32px;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#101010}
select.bsel.bB{color:var(--ok);border-color:#1f5a3c}select.bsel.bC{color:var(--or);border-color:#5a4210}select.bsel.bK{color:var(--rd);border-color:#5a1f1f}
tr.rk{cursor:pointer}tr.rk:hover td{background:#121212}tr.rk.on td{background:#151a0c}
.rkw{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.rkd{flex:1 1 320px;min-width:0;border-color:#2f3a12;position:sticky;top:calc(var(--pbh,60px) + 12px)}
main{flex:1;min-width:0;padding:0 0 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid #2c2c2c;background:#141414;font-weight:600}
.btn:hover{border-color:#555}
a.btn{color:var(--tx);text-decoration:none}a.btn.pri{color:#0a0a0a}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#0a0a0a;font-weight:700}
.btn.dg{color:var(--rd)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.big{width:100%;min-height:54px;font-size:18px;border-radius:16px}
input,select,textarea{background:#141414;border:1px solid #2c2c2c;border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:90px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(212,255,63,.5);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.gr{display:grid;gap:10px;grid-template-columns:1fr 1fr}.gr.n{grid-template-columns:minmax(0,1fr) 120px}.gr>.f{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;min-height:44px;border-radius:12px;border:1px solid #2c2c2c;background:#121212;font-weight:600}
.chip.on{border:2px solid var(--ac);background:rgba(212,255,63,.08)}
.grade{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:9px;border:1.5px solid currentColor;font:700 16px "Barlow Condensed",sans-serif}
.gA{color:var(--ok)}.gB{color:var(--bl)}.gC{color:var(--or)}.gD{color:var(--rd)}
.flag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;border:1px solid var(--or);color:var(--or);font-size:11px;font-weight:700;white-space:nowrap}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;border:1px solid currentColor;font-size:12px;font-weight:700}
.tl{display:flex;flex-direction:column;gap:2px;font-size:14px}
.tl div{display:flex;gap:10px;padding:4px 0;border-top:1px solid #1a1a1a}
.tl b.t{min-width:44px;font-variant-numeric:tabular-nums;color:var(--mu);font-weight:600}
table{border-collapse:collapse;width:100%}
th{font-size:11px;letter-spacing:.05em;color:var(--mu);font-weight:700;text-align:left;padding:8px 6px;white-space:nowrap}
td{padding:8px 6px;border-top:1px solid #1c1c1c;vertical-align:middle}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:#0b0b0b}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .flag{margin:1px 0}td:last-child{min-width:220px}
td input.sm{width:58px;min-height:34px;padding:4px 6px;text-align:center}
/* layar HP area */
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.who button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:18px;border:1px solid #262626;background:var(--card);font-weight:700}
.who button i{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#1a1a1a;color:var(--ac);font:700 24px "Barlow Condensed",sans-serif;font-style:normal}
.who button small{font-weight:500;color:var(--mu);font-size:12px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:60px;border-radius:14px;border:1px solid #262626;background:#121212;font:700 26px "Barlow Condensed",sans-serif}
.dots{display:flex;gap:14px;justify-content:center;margin:10px 0 14px}.dots i{width:14px;height:14px;border-radius:50%;background:#2a2a2a}.dots i.on{background:var(--ac)}
.it{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;border:1px solid #262626;background:var(--card)}
.it.on{border-color:var(--ac)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:52px;height:52px;border-radius:14px;border:1px solid #2c2c2c;background:#151515;font-size:26px;font-weight:700}
.step button.p{background:var(--ac);border-color:var(--ac);color:#0a0a0a}
.step input{flex:1;text-align:center;font:700 26px "Barlow Condensed",sans-serif;min-height:52px}
.task{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid #262626;background:var(--card);width:100%;text-align:left}
.task i{width:26px;height:26px;border-radius:8px;border:2px solid #555;display:grid;place-items:center;flex:none;font-style:normal;color:#0a0a0a;font-weight:900}
.task.done{opacity:.6}.task.done i{background:var(--ac);border-color:var(--ac)}
.task small{display:block;font-size:12px;font-weight:600;margin-top:2px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}.seg button{padding:9px 14px;min-height:42px;border-radius:12px;border:1px solid #2c2c2c;background:#121212;font-weight:700;color:var(--tx)}.seg button.on{background:var(--ac);border-color:var(--ac);color:#0a0a0a}
.seg .n{display:inline-block;margin-left:6px;background:var(--or);color:#0a0a0a;font-size:11px;padding:1px 7px;border-radius:999px}
.guide{border-color:#3a3a1a;background:#11120a}.guide ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.pl{display:flex;flex-direction:column;margin-top:8px;border-top:1px solid var(--line)}.pr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.pr>span{flex:1;min-width:0}.pr .t{color:var(--mu);font-size:12px;min-width:38px}
.bs{min-height:36px;padding:4px 12px;font-size:13px}
.tp{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid #262626;border-radius:12px;background:#101010;margin-bottom:6px;cursor:pointer}.tp>span.tx{flex:1;font-size:14px}.tp .pill{flex:none}.tp input{width:20px;min-height:20px;flex:none}.tp:not(.on)>span.tx{color:var(--mu);text-decoration:line-through}
.wsb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;margin-bottom:6px;border-bottom:1px solid var(--line);text-align:center}.wsb small{font-size:10px;letter-spacing:.08em;color:var(--mu)}.wsb b{font:700 15px 'Barlow Condensed',sans-serif;color:var(--ac);line-height:1.1}.wsb a{font-size:11px;color:var(--mu);text-decoration:none}
.x{border:0;background:transparent;color:inherit;font-size:15px;line-height:1;padding:0 0 0 4px;cursor:pointer;opacity:.7}
.sopl{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.task>b{margin-left:auto;font-size:22px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#0a0a0a}
button.pill{background:transparent;color:var(--ac);font-family:inherit;cursor:pointer}
table.lbr td{vertical-align:top;font-size:13px;line-height:1.5}table.lbr td small{font-size:12px}
.tp button{flex:none;width:30px;height:30px;border-radius:8px;border:1px solid #333;background:#151515;color:var(--rd);font-size:18px;line-height:1}
.stat{padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.stat small{display:block;font-size:11px;letter-spacing:.05em;color:var(--mu)}
.stat b{font:700 26px "Barlow Condensed",sans-serif}
.sec{margin-top:18px}.sec>h2{font-size:22px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:none;padding:12px 18px;border-radius:14px;background:var(--ac);color:#0a0a0a;font-weight:700;box-shadow:0 10px 30px #000;max-width:92vw}
#toast.err{background:var(--rd);color:#fff}
dialog{background:#101010;color:var(--tx);border:1px solid rgba(212,255,63,.45);border-radius:22px;padding:18px;width:min(620px,94vw);max-height:calc(100dvh - 24px);overflow:auto;overscroll-behavior:contain}
dialog .dx{position:sticky;top:-18px;float:right;margin:-8px -8px 0 8px;width:44px;height:44px;border-radius:12px;border:1px solid #2c2c2c;background:#151515;color:var(--tx);font-size:24px;line-height:1;z-index:2}
dialog .dx:hover{border-color:var(--ac);color:var(--ac)}
dialog .dfoot{position:sticky;bottom:-18px;margin:14px -18px -18px;padding:12px 18px;background:#101010;border-top:1px solid var(--line)}
.clist{display:flex;flex-direction:column;gap:6px}.clist .ci{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border:1px solid #262626;border-radius:12px;background:#121212}
.clist .ci b{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:#1c1c1c;color:var(--ac);font-size:12px;flex:none}
.clist .ci span{flex:1}.clist .ci button{width:34px;height:34px;border-radius:9px;border:1px solid #2c2c2c;background:#151515;color:var(--rd);font-size:18px}
.sug{display:flex;flex-wrap:wrap;gap:6px}.sug button{padding:6px 10px;border-radius:999px;border:1px dashed #3a3a3a;background:transparent;color:var(--mu);font-size:13px;font-weight:600}.sug button:hover{color:var(--ac);border-color:var(--ac)}
@media(max-width:600px){dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0;border:0}}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h3{font-size:24px;margin-bottom:10px}
.load{padding:60px 0;text-align:center;color:var(--mu)}
.slip{display:none}
@media(max-width:760px){.lay{flex-direction:column;gap:10px;padding:10px 10px 0}#tabs{position:sticky;top:var(--pbh,60px);flex-direction:row;overflow-x:auto;width:100%;border-radius:18px;padding:6px;scrollbar-width:none}#tabs::-webkit-scrollbar{display:none}#tabs .ti{flex:none;width:76px;padding:8px 2px}#tabs hr{display:none}.rkd{position:static}.hide-sm{display:none}}
@media print{
 body{background:#fff;color:#000}
 .pbar,#tabs,main,#toast{display:none!important}
 body.plbr main{display:block!important}body.plbr .noprint,body.plbr .seg,body.plbr #hd{display:none!important}
 body.plbr .card{background:#fff;border:0;color:#000}body.plbr table.lbr td,body.plbr table.lbr th{border-top:1px solid #999;color:#000}body.plbr .mu{color:#444}
 .slip{display:block;break-after:page;font:12pt/1.4 Barlow,Arial,sans-serif;color:#000;padding:10mm}
 .slip h2{font-size:20pt}.slip table td,.slip table th{border-top:1px solid #999;color:#000;padding:4px 6px}
}
</style>
</head>
<body>
<div id="hd"></div>
<div class="lay"><nav id="tabs" aria-label="Menu Kinerja"></nav>
<main id="v"><div class="load">Memuat data…</div></main></div>
<div id="slips"></div>
<div id="toast" role="status"></div>
<div id="sync" role="status" style="display:none;position:fixed;right:14px;bottom:14px;z-index:80;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#141414;border:1px solid #2c2c2c;color:var(--mu);font-size:13px;font-weight:600"><span style="width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)"></span><span id="syncT">Memperbarui…</span></div>
<dialog id="dlg" aria-modal="true"></dialog>
<script>
/* =====================================================================
   GAJI & KINERJA — Workshop Rejosari & Kedawung (Positif)
   Data di server Positif HRD (spreadsheet Positif HRD, Hrd.gs). Login ikut akun Positif POS.
   Produksi tetap di server POS: dipindahkan lewat jembatan Kinerja.gs v3.
   Izin: kinerja_input (HP area) · kinerja_cek (supervisor workshop) · kinerja_gaji (Owner)
   v2: setor jahit menunggu persetujuan supervisor; karyawan, barang dan setoran dibatasi per workshop akun;
       karyawan punya Workshop dan Unit (mis. Tim Jahit Rejosari). v3: server HRD terpisah.
   v6: Owner mengubah Peraturan Kerja & Jobdesk dari menu Peraturan; tanda "Menyimpan…" + notifikasi berhasil; simpan karyawan lebih cepat.
   v5: buka cepat (data terakhir disimpan di perangkat, barang produksi diambil terpisah), layar penuh, nama menu "Kinerja".
   v4: menu samping; Gaji & Tunjangan memakai nilai Baik/Cukup/Kurang → A–D (Peraturan Kerja Bab 3–4),
       poin unit dibagi sesuai jam ceklok, masa uji, rincian hitungan per orang; tombol Peraturan (peraturan-kerja.html).
   ===================================================================== */
/* server Positif HRD (spreadsheet Positif HRD). Server POS lama: AKfycbwUEqf4lS9mn3Gdyo3vpDmTl3u9gxQzIEIf83dJMeopMDDQpHu_-pcG9puoPFHfMOOBkA */
var API='https://script.google.com/macros/s/AKfycbxmcTx5di5toLD-244l40UoLyQQ7mzXXCPD5T2wjXVxnpKZWmFdd8adx1_VekVF4oK5/exec';
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var rp=function(n){return 'Rp '+Math.round(+n||0).toLocaleString('id-ID')};
var nf=function(n){return (Math.round((+n||0)*100)/100).toLocaleString('id-ID')};
var D=null,TAB='',SES=null,SEST=null,ST={};
/* v9: menu Kinerja per workshop — kinerja.html?ws=<id workshop> */
var WS=(new URLSearchParams(location.search).get('ws')||'').slice(0,40);
var HKD=function(){var h=(D&&D.cfg&&D.cfg.hariKerja)||[1,2,3,4,5,6];return h.length?h:[1,2,3,4,5,6]};
var isHK=function(day){return HKD().indexOf(new Date(day+'T00:00').getDay())>=0};
var wsN=function(n){n=String(n||'');return /pusat|wonodadi|rejosari/i.test(n)?'Workshop Rejosari':n.replace(/^gudang\s+/i,'Workshop ')};
var gN=function(id){var g=(D.gudang||[]).filter(function(x){return String(x.id)===String(id)})[0];return g?wsN(g.name):(id?id:'Tanpa workshop')};
var kG=function(k){return k.gud||D.cfg.loc||''};
var sTg=function(){return D.akt.filter(function(a){return a.jenis==='setor'&&(a.st==='tunggu'||a.st==='proses')})};
/* v7: semua isian (setor, hasil, tugas, kegiatan) menunggu diperiksa; laporan supervisor diperiksa Owner */
var PERIKSA=['setor','hasil','tugas','kegiatan','kerja'];
function isSpv(k){return /supervisor/i.test(String((k||{}).posisi||''))}
function bisaPeriksa(a){return !!D.me.gaji||!isSpv(D.K[a.kid])}
function nPeriksa(){return D.akt.filter(function(a){return a.st==='tunggu'&&PERIKSA.indexOf(a.jenis)>=0&&D.K[a.kid]&&bisaPeriksa(a)}).length}
function stPill(a){var d=a.d||{};if(a._tmp)return ' <span class="pill mu">menyimpan…</span>';
  if(a.st==='tunggu'||a.st==='proses')return ' <span class="pill warn">⏳ menunggu diperiksa</span>';
  if(a.st==='tolak')return ' <span class="pill bad">✗ ditolak'+(d.tolak?': '+esc(d.tolak):'')+'</span>';
  if(a.st==='ok'&&a.cekBy)return ' <span class="pill ok">✓ dikonfirmasi</span>';return ''}
var KERJA={jahit:'Jahit (setor ke Finishing)',potong:'Potong (setor ke Jahit)',hasil:'Hasil lain (dicek supervisor)',qc:'QC / packing (catat reject)'};

function toast(m,err){var t=$('toast'),dl=$('dlg');if(dl&&dl.open){if(t.parentNode!==dl)dl.appendChild(t)}else if(t.parentNode!==document.body)document.body.appendChild(t);t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none'},err?5000:2600)}
async function kj(act,p){
  var c=POSBAR.cred();if(!c){POSBAR.block();throw new Error('Belum masuk')}
  p=Object.assign({},p||{});if(WS)p.ws=WS;
  var r=await fetch(API,{method:'POST',body:JSON.stringify({fn:'kinerja',tok:c.t,a:[act,p]})});
  var j=await r.json();
  if(!j.ok){var m=j.error||'Gagal';if(/sesi|tiket|masuk lagi|login/i.test(m))POSBAR.block('Sesi Positif POS berakhir. Masuk lagi dulu.');throw new Error(m)}
  return j.data}
/* simpan dengan tanda proses: tombol jadi "Menyimpan…", tanda di pojok, lalu notifikasi berhasil/gagal */
async function run(act,p,okMsg,btn){if(btn==null){var ae=document.activeElement;if(ae&&ae.tagName==='BUTTON')btn=ae}
  var lbl=btn?btn.innerHTML:'';if(btn){btn.disabled=true;btn.innerHTML='Menyimpan…'}
  sync(1,act==='load'||act==='jobs'||act==='docGet'||act==='gajiGet'?'Memperbarui…':'Menyimpan…');
  try{var r=await kj(act,p);if(okMsg)toast('✓ '+okMsg);return r}catch(e){toast(e.message,1);return null}
  finally{sync(0);if(btn&&btn.isConnected){btn.disabled=false;btn.innerHTML=lbl}}}

/* ---------- tanggal (WIB) ---------- */
var pad2=function(n){return String(n).padStart(2,'0')};

var dayOf=function(iso){return ymd(new Date(iso))};
var hm=function(iso){var d=new Date(iso);return pad2(d.getHours())+':'+pad2(d.getMinutes())};
function satOf(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+1)%7));return d}
function addD(s,n){var d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d)}
var fdl=function(s){return new Date(s+'T00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'})};
function inWeek(iso,w){var d=dayOf(iso);return d>=w&&d<=addD(w,6)}

/* ---------- hitungan minggu per karyawan ---------- */
function aktOf(kid,w){return D.akt.filter(function(a){return a.kid===kid&&a.st!=='batal'&&a.st!=='tolak'&&inWeek(a.tgl,w)})}
function sumK(kid,w){
  var A=aktOf(kid,w),o={poin:0,pcs:0,hasil:0,rj:0,tunggu:0,stg:0,tugas:{},minus:[],keg:0};
  A.forEach(function(a){
    if(a.jenis==='setor'){if(a.st!=='ok'){o.tunggu++;o.stg+=+a.d.q||0;return}o.pcs+=+a.d.q||0;o.poin+=(+a.d.q||0)*(+a.d.poin||1)}
    else if(a.jenis==='hasil'){if(a.st!=='ok'){o.tunggu++;return}o.hasil+=+a.d.q||0;o.rj+=+a.d.rj||0}
    else if(a.jenis==='tugas'){if(a.st!=='ok'){o.tunggu++;return}o.tugas[dayOf(a.tgl)]=(o.tugas[dayOf(a.tgl)]||0)+1}
    else if(a.jenis==='minus')o.minus.push(a.d.note);
    else if(a.jenis==='kegiatan'){if(a.st==='ok')o.keg++;else o.tunggu++}
    else if(a.jenis==='kerja'){if(a.st==='ok')o.kerja=(o.kerja||0)+1;else o.tunggu++}});
  D.akt.forEach(function(a){if(a.jenis==='reject'&&a.st!=='batal'&&a.d.target===kid&&inWeek(a.tgl,w))o.rj+=+a.d.q||0});
  var k=D.K[kid]||{};o.out=(k.kerja||[]).some(function(x){return x==='jahit'||x==='potong'})?o.poin:o.hasil;
  o.outPcs=o.pcs+o.hasil;return o}
/* ---------- nilai mingguan: Hasil, Mutu, Jobdesk = Baik (B) / Cukup (C) / Kurang (K) → A–D (Peraturan Bab 4) ---------- */
var LBK={B:'Baik',C:'Cukup',K:'Kurang'};
function aturan(){var c=D.cfg;return{hB:+c.hasilB||100,hC:+c.hasilC||75,mB:c.mutuB!=null?+c.mutuB:1,mC:c.mutuC!=null?+c.mutuC:3,jB:+c.jobB||90,jC:+c.jobC||70,uM:c.ujiMulai||'',uN:+c.ujiMinggu||0,tu:c.targetUnit||{}}}
function isPoin(k){return (k.kerja||[]).some(function(x){return x==='jahit'||x==='potong'})}
function anggota(k){return k.unit?D.kar.filter(function(x){return x.unit===k.unit}):[k]}
function masaUji(w){var a=aturan();if(!a.uM||!a.uN)return 0;var d=Math.round((new Date(w+'T00:00')-new Date(ymd(satOf(new Date(a.uM+'T00:00')))+'T00:00'))/6048e5);return d>=0&&d<a.uN?d+1:0}
/* ckAll = ceklok semua karyawan minggu itu (untuk membagi poin unit sesuai jam); boleh kosong */
function nilai(kid,w,ck,ovr,ckAll){
  var k=D.K[kid],a=aturan(),s=sumK(kid,w),fl=[],M=anggota(k),poin=isPoin(k);
  var U=0,rj=0,jamU=0,adaJam=true,T=0;
  M.forEach(function(m){var sm=m.id===kid?s:sumK(m.id,w);U+=poin?sm.poin:sm.hasil;rj+=sm.rj;var x=ckAll?ckAll[m.id]:(m.id===kid?ck:null);if(x)jamU+=+x.jam||0;else adaJam=false;T+=+m.target||0});
  if(k.unit&&a.tu[k.unit]!=null&&+a.tu[k.unit]>0)T=+a.tu[k.unit];
  if(!k.unit)T=+k.target||0;
  var jamK=ck?+ck.jam||0:0,bag=k.unit?(adaJam&&jamU?U*jamK/jamU:U/M.length):U;
  var H,Mt,J,r=null;
  if(!T){H='B';fl.push('target belum diatur')}else{r=U/T*100;H=r>=a.hB?'B':r>=a.hC?'C':'K'}
  if(!U&&!rj){fl.push('tidak ada hasil tercatat')}
  Mt=rj<=a.mB?'B':rj<=a.mC?'C':'K';
  var nm=s.minus.length,pct=null;
  var hari=ck?ck.hadir:HKD().length,tn=tjNilai(kid,w,hari),eT=0,dT=0;
  if((k.cek||[]).length){eT=hari*k.cek.length;dT=Object.keys(s.tugas).reduce(function(t,d){return t+Math.min(s.tugas[d],k.cek.length)},0)}
  if(eT+tn.exp)pct=hari||tn.exp?Math.min(dT+tn.done,eT+tn.exp)/(eT+tn.exp)*100:100;
  J=(pct==null||pct>=a.jB)&&!nm?'B':((pct==null||pct>=a.jC)&&nm<=1)?'C':'K';
  if(pct!=null&&pct<a.jB)fl.push('jobdesk '+Math.round(pct)+'%');
  if(nm)fl.push(nm+' catatan disiplin');
  if(!ck)fl.push('ceklok belum diunggah');
  if(s.tunggu)fl.push(s.tunggu+' laporan belum diperiksa');
  ovr=ovr||{};var man=[];
  ['H','M','J'].forEach(function(f){var v=ovr[f];if(v==='B'||v==='C'||v==='K'){if(f==='H')H=v;if(f==='M')Mt=v;if(f==='J')J=v;man.push(f)}});
  var L=[H,Mt,J],nC=L.filter(function(x){return x==='C'}).length,nK=L.filter(function(x){return x==='K'}).length;
  var g=!nC&&!nK?'A':!nK&&nC===1?'B':(!nK&&nC===2)||(nK===1&&!nC)?'C':'D';
  return{H:H,M:Mt,J:J,g:g,s:s,fl:fl,U:U,T:T,r:r,bag:bag,rj:rj,pct:pct,nm:nm,uji:masaUji(w),man:man,why:ovr.why||'',unit:k.unit||'',poin:poin}}
/* rincian uang satu karyawan */
function bayar(k,x,n,o){var c=D.cfg,u=+k.upah||0,tepat=x?Math.max(0,(+x.hadir||0)-(+x.telat||0)):0;
  var jamU=x?x.jam*u:0,mk=x?x.makan:0,th=x&&(+x.telat||0)<=(+c.telatMaks||0)?(+c.hadir[Math.min(6,tepat)]||0):0;
  var tkAsli=x?(+c.kerja[n.g]||0):0,tk=x?(n.uji?(+c.kerja.A||0):tkAsli):0,bn=+((o||{}).bonus)||0;
  return{u:u,tepat:tepat,jamU:jamU,mk:mk,th:th,tk:tk,tkAsli:tkAsli,bn:bn,t:jamU+mk+th+tk+bn}}

function panduanH(k){var L=[],sp=isSpv(k)?'Owner':'supervisor';
  if(k.kerja.indexOf('jahit')>=0)L.push('<b>Setor hasil jahit</b>: isi jumlah yang sudah selesai di barang yang dikerjakan, lalu tekan <b>Setor</b>.');

  if(k.kerja.indexOf('qc')>=0)L.push('Ada barang rusak? Tekan <b>Catat reject</b>.');
  if((k.cek||[]).length||tugasLainH(k))L.push('Tekan <b>Tugas hari ini</b> satu per satu setelah benar-benar dikerjakan.');

/* SOP mulai berlaku sejak pertama kali disimpan Owner; hari Minggu dan hari tanpa catatan (tidak masuk) tidak dihitung terlewat */
function sopMulai(){var a=SOPD().at;return a?dayOf(a):'9999-12-31'}
function terlewat(kid,day){var out=[];if(day>=ymd(new Date())||day<sopMulai()||!isHK(day))return out;
  if(!D.akt.some(function(a){return a.kid===kid&&dayOf(a.tgl)===day&&a.st!=='batal'}))return out;
  (SOPD().tj||[]).forEach(function(t){if((t.orang||[])[0]!==kid)return;(t.kerja||[]).forEach(function(w){
    if(w.kapan==='harian'&&!kerjaAda(w,day))out.push(w.nama);
    if(w.kapan==='mingguan'&&new Date(day+'T00:00').getDay()===5&&!kerjaAda(w,day))out.push(w.nama+' (mingguan)')})});
  return out}
/* nilai Jobdesk: tugas posisi + pekerjaan tanggung jawab (utama) + tugas tambahan, yang sudah dikonfirmasi */
function tjNilai(kid,w,hari){var exp=0,done=0,ok=function(a){return a.st==='ok'},m=sopMulai();
  if(m>addD(w,6))hari=0;else if(m>w){var n=0;for(var i=0;i<7;i++){var d=addD(w,i);if(d>=m&&isHK(d))n++}hari=Math.min(hari,n)}
  (SOPD().tj||[]).forEach(function(t){var utama=(t.orang||[])[0]===kid,ikut=(t.orang||[]).indexOf(kid)>=0;if(!ikut)return;
    (t.kerja||[]).forEach(function(x){if(x.kapan==='terjadi')return;
      var A=D.akt.filter(function(a){return a.jenis==='kerja'&&a.d.ref===x.id&&inWeek(a.tgl,w)&&ok(a)});
      if(utama){var e=x.kapan==='harian'?hari:(m>addD(w,6)?0:1);exp+=e;done+=Math.min(e,x.kapan==='harian'?[...new Set(A.map(function(a){return dayOf(a.tgl)}))].length:(A.length?1:0))}
      else done+=0})});
  var B=D.akt.filter(function(a){return a.jenis==='beri'&&a.kid===kid&&a.st!=='batal'&&a.d.tgl>=w&&a.d.tgl<=addD(w,6)});
  exp+=B.length;B.forEach(function(b){if(D.akt.some(function(a){return a.jenis==='kerja'&&a.d.ref===b.id&&ok(a)}))done++});
  return{exp:exp,done:done}}

var SETOR_L={jahit:'Setor jahit',potong:'Setor potong',hasil:'Catat hasil',qc:'Catat reject (QC)','':'Tanpa setoran'};
function setorPos(p){var m=(DOC&&DOC.meta&&DOC.meta.setor)||{};if(p&&m[p]!=null)return m[p];return (kerjaPos(p).k||[])[0]||''}
/* daftar tugas posisi untuk form: dari Peraturan + tugas tambahan orang ini */
function tpInit(p,jd,cek){var base=p?tugasPos(p).concat(tugasPos('Semua posisi')):[],ada=!!String(jd||'').trim(),seen={};
  TP=base.map(function(r){seen[r[1]]=1;return{t:r[1],kapan:r[2]||'Harian',on:!ada||String(jd||'').indexOf(r[1])>=0||(cek||[]).indexOf(r[1])>=0,c:0}});
  (cek||[]).forEach(function(t){if(!seen[t]){seen[t]=1;TP.push({t:t,kapan:'Harian',on:true,c:1})}});
  String(jd||'').split('\n').forEach(function(l){var m=l.replace(/^\s*[•\-*]\s*/,'').match(/^(.*?)\s*\(([^)]*)\)\s*$/),t=(m?m[1]:l.replace(/^\s*[•\-*]\s*/,'')).trim();
    if(t&&!seen[t]){seen[t]=1;var kp=m?m[2]:'Mingguan';TP.push({t:t,kapan:kp.charAt(0).toUpperCase()+kp.slice(1),on:true,c:1})}})}
function tpDraw(){var e=$('e_tp');if(!e)return;var p=$('e_pos').value,sp=setorPos(p),nH=TP.filter(function(x){return x.on&&/harian/i.test(x.kapan)&&!otoSetor(x.t)}).length;
  $('e_set').textContent='Setoran di HP: '+SETOR_L[sp];
  e.innerHTML=(!p?'<div class="mu" style="font-size:13px;margin-bottom:6px">Pilih posisi untuk menampilkan tugasnya.</div>':!DOCF&&!tugasPos(p).length?'<div class="mu" style="font-size:13px;margin-bottom:6px">Memuat jobdesk…</div>':'')
   +TP.map(function(x,i){return '<label class="tp'+(x.on?' on':'')+'"><input type="checkbox" '+(x.on?'checked':'')+' onchange="TP['+i+'].on=this.checked;TPD=1;tpDraw()"><span class="tx">'+esc(x.t)+'</span><span class="pill'+(/harian/i.test(x.kapan)?' ok':'')+'">'+esc(otoSetor(x.t)?'Otomatis':x.kapan)+'</span>'+(x.c?'<button type="button" aria-label="Hapus '+esc(x.t)+'" onclick="event.preventDefault();TP.splice('+i+',1);TPD=1;tpDraw()">×</button>':'')+'</label>'}).join('')
   +'<div class="row" style="gap:6px;flex-wrap:nowrap;margin-top:4px"><input id="e_tpn" placeholder="Tugas tambahan khusus orang ini…" onkeydown="if(event.key===\'Enter\'){event.preventDefault();tpTambah()}"><select id="e_tpk" style="width:auto;flex:none"><option>Harian</option><option>Mingguan</option></select><button class="btn" type="button" style="flex:none;white-space:nowrap" onclick="tpTambah()">+ Tambah</button></div>'
   +'<div class="mu" style="font-size:12px;margin-top:6px">'+nH+' tugas harian tampil sebagai checklist di HP'+(nH>10?' — <span class="warn">maksimal 10, sisanya hanya tampil di jobdesk</span>':'')+'.</div>'}
function tpTambah(){var t=$('e_tpn').value.trim().slice(0,160);if(!t)return;if(TP.some(function(x){return x.t===t}))return toast('Tugas sudah ada',1);TP.push({t:t,kapan:$('e_tpk').value,on:true,c:1});TPD=1;tpDraw();var n=$('e_tpn');if(n)n.focus()}
function tpJd(){return TP.filter(function(x){return x.on}).map(function(x){return '• '+x.t+' ('+x.kapan.toLowerCase()+')'}).join('\n')}
/* tugas setor sudah tercatat lewat setoran, jadi tidak perlu dicentang lagi */
var otoSetor=function(t){return /^setor hasil/i.test(t)};
function tpCek(){return TP.filter(function(x){return x.on&&/harian/i.test(x.kapan)&&!otoSetor(x.t)}).map(function(x){return x.t}).slice(0,10)}
function karEdit(id){KE_ID=id||'';if(!DOCF)docPrefetch();
  var k=id?D.K[id]:{kerja:[],cek:[]},d=$('dlg'),ps=posisiList(),ar=[...new Set(AREAS.concat(D.kar.map(function(x){return x.area}).filter(Boolean)))];
  if(k.posisi&&ps.indexOf(k.posisi)<0)ps.push(k.posisi);if(k.area&&ar.indexOf(k.area)<0)ar.push(k.area);
  d.innerHTML='<h3>'+(id?'Ubah '+esc(k.nama):'Karyawan baru')+'</h3><div class="gr n"><label class="f">Nama<input id="e_nama" value="'+esc(k.nama||'')+'"></label><label class="f">ID ceklok<input id="e_cid" value="'+esc(k.cid||'')+'"></label></div>'
   +'<div class="gr" style="margin-top:8px"><label class="f">Posisi (dari Jobdesk)<select id="e_pos" onchange="posGanti()">'+posOpt(ps,k.posisi)+'</select></label><label class="f">Bagian (tampil di slip)<input id="e_bag" value="'+esc(k.bagian||'')+'" placeholder="mis. Penjahit"></label></div>'
   +'<div class="row" style="margin:14px 0 2px"><b style="font-size:15px">Tugas posisi ini</b><span class="sp"></span><span class="pill" id="e_set"></span></div><div class="mu" style="font-size:12px;margin-bottom:8px">Hilangkan centang untuk tugas yang tidak dikerjakan orang ini. Tugas harian yang dicentang menjadi checklist di HP.</div><div id="e_tp"></div>'
   +(id&&tjSaya(id).length?'<div style="margin-top:10px"><b style="font-size:15px">Tanggung jawab tambahan</b> <span class="mu" style="font-size:12px">— diatur di Peraturan → SOP &amp; Tanggung jawab</span><div class="chips" style="margin-top:6px">'+tjSaya(id).map(function(t){return '<span class="pill'+((t.orang||[])[0]===id?' ok':'')+'">'+((t.orang||[])[0]===id?'★ ':'')+esc(t.nama)+'</span>'}).join('')+'</div></div>':'')
   +'<div class="g2" style="margin-top:12px"><label class="f">Workshop<select id="e_gud"><option value="">'+(D.cfg.loc?'Bawaan ('+esc(gN(D.cfg.loc))+')':'Belum diatur')+'</option>'+(D.gudang||[]).map(function(g){return '<option value="'+esc(g.id)+'"'+(String(g.id)===String(k.gud||WS||'')?' selected':'')+'>'+esc(wsN(g.name))+'</option>'}).join('')+'</select></label>'
   +'<label class="f">Unit setoran (mis. Tim Jahit Rejosari)<input id="e_unit" value="'+esc(k.unit||'')+'" list="units" placeholder="kosong = atas nama sendiri"></label>'
   +(D.me.gaji?'<label class="f">Upah per jam (Rp)<input id="e_upah" type="number" min="0" value="'+(id?(k.upah||''):(D.cfg.upahDef||''))+'"></label>':'')
   +'<label class="f">Target per minggu (poin / jumlah)<input id="e_tgt" type="number" min="0" value="'+(k.target||'')+'" placeholder="kosong = uji coba"></label>'
   +'<label class="f">PIN baru (4 angka)<input id="e_pin" inputmode="numeric" maxlength="4" placeholder="'+(id&&k.pin?'kosong = tidak diubah':'wajib dibuat')+'"></label></div>'
   +'<datalist id="units">'+[...new Set(D.kar.map(function(x){return x.unit}).filter(Boolean))].map(function(a){return '<option value="'+esc(a)+'">'}).join('')+'</datalist>'
   +'<div class="dfoot row">'+(id?'<button class="btn dg" onclick="karNon(\''+id+'\')">Nonaktifkan</button>':'')+'<span class="sp"></span><button class="btn" onclick="$(\'dlg\').close()">Batal</button><button class="btn pri" onclick="karSave(\''+(id||'')+'\',this)">Simpan</button></div>';
  TPD=0;tpInit(k.posisi||'',k.jobdesk,k.cek);d.showModal();tpDraw()}
function posOpt(ps,v){return '<option value="">— pilih posisi —</option>'+ps.map(function(p){return '<option'+(p===v?' selected':'')+'>'+esc(p)+'</option>'}).join('')}
/* jobdesk selesai dimuat saat form sudah terbuka: lengkapi pilihan posisi & tugasnya tanpa menghapus isian */
function karDocSiap(){if(!$('dlg').open||!$('e_tp'))return;var v=$('e_pos').value,ps=posisiList();if(v&&ps.indexOf(v)<0)ps.push(v);$('e_pos').innerHTML=posOpt(ps,v);
  var k=KE_ID?D.K[KE_ID]||{}:{};if(!TPD&&v===(k.posisi||'')){tpInit(v,k.jobdesk,k.cek);tpDraw();return}
  var cus=TP.filter(function(x){return x.c}),off=TP.filter(function(x){return !x.on}).map(function(x){return x.t});
  tpInit(v,'',[]);TP.forEach(function(x){if(off.indexOf(x.t)>=0)x.on=false});cus.forEach(function(x){if(!TP.some(function(y){return y.t===x.t}))TP.push(x)});tpDraw()}
function posGanti(){var p=$('e_pos').value,b=$('e_bag');if(p&&(!b.value.trim()||b.value===window.__bagAuto)){b.value=p;window.__bagAuto=p}
  TPD=1;var cus=TP.filter(function(x){return x.c});tpInit(p,'',[]);cus.forEach(function(x){if(!TP.some(function(y){return y.t===x.t}))TP.push(x)});tpDraw()}
function areaBaru(sel){if(sel.value!=='__baru')return;var n=document.createElement('input');n.id='e_area_new';n.placeholder='Nama area baru, mis. Sablon';n.maxLength=30;n.style.marginTop='6px';sel.parentNode.appendChild(n);sel.style.display='none';n.focus()}
var KE_ID='';
function karForm(id){var k=id?D.K[id]:{},p=$('e_pos').value,sp=p?setorPos(p):'';
  return{id:id,nama:$('e_nama').value,cid:$('e_cid').value,posisi:p,bagian:$('e_bag').value,
    kerja:p?(sp?[sp]:[]):(k.kerja||[]),hasil:sp==='hasil'?p:(p?'':k.hasil||''),satuan:/stiker|cetak/i.test(p)?'lembar':(p?'pcs':k.satuan||'pcs'),
    area:k.area||'',gud:$('e_gud').value,unit:$('e_unit').value.trim(),upah:$('e_upah')?(+$('e_upah').value||0):(k.upah||0),target:+$('e_tgt').value||0,pin:$('e_pin').value.trim(),
    jobdesk:tpJd(),cek:tpCek(),urut:k.urut}}
async function karSave(id,btn){var p=karForm(id);if(!p.nama.trim())return toast('Nama wajib diisi',1);if(p.pin&&!/^\d{4}$/.test(p.pin))return toast('PIN harus 4 angka',1);
  var r=await run('karSave',p,'',btn);if(!r)return;$('dlg').close();toast('✓ Data '+(p.nama||'karyawan')+' tersimpan');
  if(r.kar){var i=D.kar.findIndex(function(k){return k.id===r.kar.id});if(r.kar.on===false){if(i>=0)D.kar.splice(i,1)}else if(i>=0)D.kar[i]=r.kar;else D.kar.push(r.kar);prep();simpanCache();render()}
  load()}
async function karNon(id){if(!(await yakin('Nonaktifkan '+D.K[id].nama+'?','Karyawan tidak tampil lagi. Data lama tetap tersimpan.','Ya')))return;var p=karForm(id);p.on=false;p.pin='';var r=await run('karSave',p,'Dinonaktifkan');if(!r)return;if($('dlg').open)$('dlg').close();D.kar=D.kar.filter(function(k){return k.id!==id});prep();simpanCache();render();load()}

/* ---------- mulai ---------- */
(function(){if(!POSBAR.cred()){POSBAR.mount({active:WS==='g2'?'kinerjaR':WS==='g1'?'kinerjaK':'kinerja',replace:'#hd'});POSBAR.block();return}
  POSBAR.mount({active:WS==='g2'?'kinerjaR':WS==='g1'?'kinerjaK':'kinerja',replace:'#hd'});load()})();
</script>
</body>
</html>
