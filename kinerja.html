<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gaji &amp; Kinerja — Positif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="posbar.js?v=20261124k"></script>
<style>
:root{--bg:#070707;--card:#0f0f0f;--line:#232323;--tx:#ececec;--mu:#8f8f8a;--ac:#d4ff3f;--ok:#4ddf9a;--bl:#4da3ff;--or:#ffb020;--rd:#ff6b6b;--pp:#a78bfa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Barlow,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;margin:0;letter-spacing:.01em}
.mu{color:var(--mu)}.ok{color:var(--ok)}.bad{color:var(--rd)}.warn{color:var(--or)}
#tabs{position:sticky;top:var(--pbh,60px);z-index:20;display:flex;gap:6px;padding:10px 16px;overflow-x:auto;background:rgba(7,7,7,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mu);font-weight:600}
#tabs button.on{background:var(--ac);border-color:var(--ac);color:#0a0a0a}
main{max-width:1320px;margin:0 auto;padding:16px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid #2c2c2c;background:#141414;font-weight:600}
.btn:hover{border-color:#555}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#0a0a0a;font-weight:700}
.btn.dg{color:var(--rd)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.big{width:100%;min-height:54px;font-size:18px;border-radius:16px}
input,select,textarea{background:#141414;border:1px solid #2c2c2c;border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:90px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(212,255,63,.5);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;min-height:44px;border-radius:12px;border:1px solid #2c2c2c;background:#121212;font-weight:600}
.chip.on{border:2px solid var(--ac);background:rgba(212,255,63,.08)}
.grade{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:9px;border:1.5px solid currentColor;font:700 16px "Barlow Condensed",sans-serif}
.gA{color:var(--ok)}.gB{color:var(--bl)}.gC{color:var(--or)}.gD{color:var(--rd)}
.flag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;border:1px solid var(--or);color:var(--or);font-size:11px;font-weight:700;white-space:nowrap}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;border:1px solid currentColor;font-size:12px;font-weight:700}
.tl{display:flex;flex-direction:column;gap:2px;font-size:14px}
.tl div{display:flex;gap:10px;padding:4px 0;border-top:1px solid #1a1a1a}
.tl b.t{min-width:44px;font-variant-numeric:tabular-nums;color:var(--mu);font-weight:600}
table{border-collapse:collapse;width:100%}
th{font-size:11px;letter-spacing:.05em;color:var(--mu);font-weight:700;text-align:left;padding:8px 6px;white-space:nowrap}
td{padding:8px 6px;border-top:1px solid #1c1c1c;vertical-align:middle}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:#0b0b0b}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .flag{margin:1px 0}td:last-child{min-width:220px}
td input.sm{width:58px;min-height:34px;padding:4px 6px;text-align:center}
/* layar HP area */
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.who button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:18px;border:1px solid #262626;background:var(--card);font-weight:700}
.who button i{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#1a1a1a;color:var(--ac);font:700 24px "Barlow Condensed",sans-serif;font-style:normal}
.who button small{font-weight:500;color:var(--mu);font-size:12px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:60px;border-radius:14px;border:1px solid #262626;background:#121212;font:700 26px "Barlow Condensed",sans-serif}
.dots{display:flex;gap:14px;justify-content:center;margin:10px 0 14px}.dots i{width:14px;height:14px;border-radius:50%;background:#2a2a2a}.dots i.on{background:var(--ac)}
.it{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;border:1px solid #262626;background:var(--card)}
.it.on{border-color:var(--ac)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:52px;height:52px;border-radius:14px;border:1px solid #2c2c2c;background:#151515;font-size:26px;font-weight:700}
.step button.p{background:var(--ac);border-color:var(--ac);color:#0a0a0a}
.step input{flex:1;text-align:center;font:700 26px "Barlow Condensed",sans-serif;min-height:52px}
.task{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid #262626;background:var(--card);width:100%;text-align:left}
.task i{width:26px;height:26px;border-radius:8px;border:2px solid #555;display:grid;place-items:center;flex:none;font-style:normal;color:#0a0a0a;font-weight:900}
.task.done{opacity:.6}.task.done i{background:var(--ac);border-color:var(--ac)}
.stat{padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.stat small{display:block;font-size:11px;letter-spacing:.05em;color:var(--mu)}
.stat b{font:700 26px "Barlow Condensed",sans-serif}
.sec{margin-top:18px}.sec>h2{font-size:22px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:none;padding:12px 18px;border-radius:14px;background:var(--ac);color:#0a0a0a;font-weight:700;box-shadow:0 10px 30px #000;max-width:92vw}
#toast.err{background:var(--rd);color:#fff}
dialog{background:#101010;color:var(--tx);border:1px solid rgba(212,255,63,.45);border-radius:22px;padding:18px;width:min(560px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h3{font-size:24px;margin-bottom:10px}
.load{padding:60px 0;text-align:center;color:var(--mu)}
.slip{display:none}
@media(max-width:700px){main{padding:12px 12px 120px}.hide-sm{display:none}}
@media print{
 body{background:#fff;color:#000}
 .pbar,#tabs,main,#toast{display:none!important}
 .slip{display:block;break-after:page;font:12pt/1.4 Barlow,Arial,sans-serif;color:#000;padding:10mm}
 .slip h2{font-size:20pt}.slip table td,.slip table th{border-top:1px solid #999;color:#000;padding:4px 6px}
}
</style>
</head>
<body>
<div id="hd"></div>
<nav id="tabs" aria-label="Menu Gaji & Kinerja"></nav>
<main id="v"><div class="load">Memuat data…</div></main>
<div id="slips"></div>
<div id="toast" role="status"></div>
<dialog id="dlg"></dialog>
<script>
/* =====================================================================
   GAJI & KINERJA — Gudang Wonodadi (Positif)
   Data di server Positif POS (Kinerja.gs). Login ikut akun Positif POS.
   Izin: kinerja_input (HP area) · kinerja_cek (kepala gudang) · kinerja_gaji (Owner)
   ===================================================================== */
var API='https://script.google.com/macros/s/AKfycbwUEqf4lS9mn3Gdyo3vpDmTl3u9gxQzIEIf83dJMeopMDDQpHu_-pcG9puoPFHfMOOBkA/exec';
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var rp=function(n){return 'Rp '+Math.round(+n||0).toLocaleString('id-ID')};
var nf=function(n){return (Math.round((+n||0)*100)/100).toLocaleString('id-ID')};
var D=null,TAB='',SES=null,SEST=null,ST={};
var KERJA={jahit:'Jahit (setor ke Finishing)',potong:'Potong (setor ke Jahit)',hasil:'Hasil lain (dicek kepala gudang)',qc:'QC / packing (catat reject)'};

function toast(m,err){var t=$('toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none'},err?5000:2600)}
async function kj(act,p){
  var c=POSBAR.cred();if(!c){POSBAR.block();throw new Error('Belum masuk')}
  var r=await fetch(API,{method:'POST',body:JSON.stringify({fn:'kinerja',tok:c.t,a:[act,p||{}]})});
  var j=await r.json();
  if(!j.ok){var m=j.error||'Gagal';if(/sesi|tiket|masuk lagi|login/i.test(m))POSBAR.block('Sesi Positif POS berakhir. Masuk lagi dulu.');throw new Error(m)}
  return j.data}
async function run(act,p,okMsg){try{var r=await kj(act,p);if(okMsg)toast(okMsg);return r}catch(e){toast(e.message,1);return null}}

/* ---------- tanggal (WIB) ---------- */
var pad2=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
var dayOf=function(iso){return ymd(new Date(iso))};
var hm=function(iso){var d=new Date(iso);return pad2(d.getHours())+':'+pad2(d.getMinutes())};
function satOf(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+1)%7));return d}
function addD(s,n){var d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d)}
var fdl=function(s){return new Date(s+'T00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'})};
function inWeek(iso,w){var d=dayOf(iso);return d>=w&&d<=addD(w,6)}

/* ---------- muat ---------- */
async function load(){
  var from=new Date(satOf(new Date()));from.setDate(from.getDate()-14);
  try{D=await kj('load',{from:from.toISOString()})}catch(e){$('v').innerHTML='<div class="card"><b>Gagal memuat.</b><p class="mu">'+esc(e.message)+'</p><button class="btn" onclick="load()">Coba lagi</button></div>';return}
  D.K={};D.kar.forEach(function(k){D.K[k.id]=k});
  var T=tabs();if(!TAB||!T.some(function(t){return t[0]===TAB}))TAB=D.me.gaji&&!D.kar.length?'atur':(D.me.cek||D.me.gaji)?'hari':(T[0]?T[0][0]:'');
  render()}
function tabs(){var m=D.me,t=[];
  if(m.input)t.push(['setor','Setor hasil']);
  if(m.cek||m.gaji)t.push(['hari','Hari ini'],['cek','Cek & reject']);
  if(m.gaji)t.push(['rekap','Rekap & gaji'],['atur','Atur']);
  return t}
function render(){
  $('tabs').innerHTML=tabs().map(function(t){return '<button class="'+(t[0]===TAB?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join('')+'<span class="sp"></span><button onclick="load()" title="Muat ulang">↻</button>';
  var f={setor:vSetor,hari:vHari,cek:vCek,rekap:vRekap,atur:vAtur}[TAB];
  $('v').innerHTML=f?f():'<div class="card">Akun ini belum punya izin Gaji &amp; Kinerja.</div>'}
function go(t){TAB=t;if(t!=='setor')keluar(true);render();scrollTo(0,0)}

/* ---------- hitungan minggu per karyawan ---------- */
function aktOf(kid,w){return D.akt.filter(function(a){return a.kid===kid&&a.st!=='batal'&&a.st!=='tolak'&&inWeek(a.tgl,w)})}
function sumK(kid,w){
  var A=aktOf(kid,w),o={poin:0,pcs:0,hasil:0,rj:0,tunggu:0,tugas:{},minus:[],keg:0};
  A.forEach(function(a){
    if(a.jenis==='setor'){o.pcs+=+a.d.q||0;o.poin+=(+a.d.q||0)*(+a.d.poin||1)}
    else if(a.jenis==='hasil'){o.hasil+=+a.d.q||0;o.rj+=+a.d.rj||0;if(a.st==='tunggu')o.tunggu++}
    else if(a.jenis==='tugas'){o.tugas[dayOf(a.tgl)]=(o.tugas[dayOf(a.tgl)]||0)+1}
    else if(a.jenis==='minus')o.minus.push(a.d.note);
    else if(a.jenis==='kegiatan')o.keg++});
  D.akt.forEach(function(a){if(a.jenis==='reject'&&a.st!=='batal'&&a.d.target===kid&&inWeek(a.tgl,w))o.rj+=+a.d.q||0});
  var k=D.K[kid]||{};o.out=(k.kerja||[]).some(function(x){return x==='jahit'||x==='potong'})?o.poin:o.hasil;
  o.outPcs=o.pcs+o.hasil;return o}
function nilai(kid,w,ck,ovr){
  var k=D.K[kid],c=D.cfg,s=sumK(kid,w),fl=[],H,M,Dd;
  if(!k.target){H=4;fl.push('target belum diisi')}else{var r=s.out/k.target,t=c.hasilTangga;H=r>=t[0]?4:r>=t[1]?3:r>=t[2]?2:r>=t[3]?1:0}
  if(!s.outPcs){M=s.rj?0:3;if(!s.rj)fl.push('tidak ada hasil tercatat')}else{var pc=s.rj/s.outPcs*100,m=c.mutuTangga;M=pc<=m[0]?3:pc<=m[1]?2:pc<=m[2]?1:0}
  Dd=3;
  if(ck){if(ck.telat>c.telatMaks)Dd--}else fl.push('ceklok belum diunggah');
  if((k.cek||[]).length){var hari=ck?ck.hadir:6,isi=Object.keys(s.tugas).reduce(function(a,d){return a+Math.min(s.tugas[d],k.cek.length)},0),pct=hari?isi/(hari*k.cek.length)*100:100;if(pct<c.cekMin){Dd--;fl.push('tugas tetap '+Math.round(pct)+'%')}}
  Dd-=s.minus.length;if(Dd<0)Dd=0;
  if(s.tunggu)fl.push(s.tunggu+' hasil belum dicek');
  ovr=ovr||{};if(ovr.H!=null&&ovr.H!=='')H=+ovr.H;if(ovr.M!=null&&ovr.M!=='')M=+ovr.M;if(ovr.D!=null&&ovr.D!=='')Dd=+ovr.D;
  var tot=H+M+Dd,g=tot>=c.grade.A?'A':tot>=c.grade.B?'B':tot>=c.grade.C?'C':'D';
  return{H:H,M:M,D:Dd,tot:tot,g:g,s:s,fl:fl}}
var gH=function(g){return '<span class="grade g'+g+'">'+g+'</span>'};

/* =================== SETOR (HP area) =================== */
function keluar(silent){SES=null;clearTimeout(SEST);if(!silent&&TAB==='setor')render()}
function aktif(){clearTimeout(SEST);SEST=setTimeout(function(){keluar();toast('Keluar otomatis (tidak ada aktivitas)')},120000)}
function vSetor(){
  if(SES&&D.K[SES.kid])return vOrang();
  var area='';try{area=localStorage.getItem('kj_area')||''}catch(e){}
  var areas=[...new Set(D.kar.map(function(k){return k.area}).filter(Boolean))];
  var L=D.kar.filter(function(k){return !area||k.area===area});
  return '<div class="row" style="margin-bottom:12px"><h1 style="font-size:30px">Siapa yang setor?</h1><span class="sp"></span>'
   +(areas.length>1?'<label class="f" style="flex-direction:row;align-items:center;gap:8px">HP area<select style="width:auto" onchange="try{localStorage.setItem(\'kj_area\',this.value)}catch(e){};render()"><option value="">Semua</option>'+areas.map(function(a){return '<option'+(a===area?' selected':'')+'>'+esc(a)+'</option>'}).join('')+'</select></label>':'')+'</div>'
   +(L.length?'<div class="who">'+L.map(function(k){return '<button onclick="pinOpen(\''+k.id+'\')"><i>'+esc(k.nama.charAt(0))+'</i>'+esc(k.nama)+'<small>'+esc(k.bagian||'')+'</small></button>'}).join('')+'</div>'
     :'<div class="card mu">Belum ada karyawan. Owner menambahkannya di menu Atur.</div>')}
var PIN='',PKID='';
function pinOpen(id){var k=D.K[id];if(!k.pin)return toast('PIN '+k.nama+' belum dibuat. Minta Owner membuatnya di menu Atur.',1);PIN='';PKID=id;var d=$('dlg');
  d.innerHTML='<h3>PIN '+esc(k.nama)+'</h3><div class="dots" id="pdots"></div><div class="pad">'+['1','2','3','4','5','6','7','8','9','×','0','⌫'].map(function(x){return '<button aria-label="'+(x==='×'?'Batal':x==='⌫'?'Hapus':x)+'" onclick="pinKey(\''+x+'\')">'+x+'</button>'}).join('')+'</div>';
  pinDots();d.showModal()}
function pinDots(){$('pdots').innerHTML=[0,1,2,3].map(function(i){return '<i class="'+(i<PIN.length?'on':'')+'"></i>'}).join('')}
async function pinKey(x){if(x==='×'){$('dlg').close();return}if(x==='⌫'){PIN=PIN.slice(0,-1);pinDots();return}if(PIN.length>=4)return;PIN+=x;pinDots();
  if(PIN.length===4){var r=await run('pin',{kid:PKID,pin:PIN});if(r){SES={kid:PKID,pin:PIN};$('dlg').close();aktif();ST={};render()}else{PIN='';pinDots()}}}
function vOrang(){aktif();
  var k=D.K[SES.kid],w=ymd(satOf(new Date())),n=nilai(k.id,w,null),today=ymd(new Date()),h='';
  var mine=D.akt.filter(function(a){return a.kid===k.id&&dayOf(a.tgl)===today&&a.st!=='batal'}).sort(function(a,b){return a.tgl<b.tgl?-1:1});
  h+='<div class="row" style="margin-bottom:12px"><button class="btn" onclick="keluar()">← Ganti orang</button><div><h1 style="font-size:28px">Halo, '+esc(k.nama)+'</h1><div class="mu" style="font-size:13px">'+esc(k.bagian||'')+'</div></div><span class="sp"></span>'
   +'<div class="stat"><small>HASIL MINGGU INI</small><b>'+nf(n.s.out)+'</b>'+(k.target?'<small style="display:inline;font-size:14px"> / '+nf(k.target)+'</small>':'')+' <small style="display:inline;font-size:13px">'+((k.kerja.indexOf('jahit')>=0||k.kerja.indexOf('potong')>=0)?'poin':esc(k.satuan))+(n.s.rj?' · <span class="bad">reject '+n.s.rj+'</span>':'')+'</small></div></div>';
  if(k.kerja.indexOf('jahit')>=0)h+=setorH(k,'jahit');
  if(k.kerja.indexOf('potong')>=0)h+=setorH(k,'cutting');
  if(k.kerja.indexOf('hasil')>=0)h+='<div class="sec"><h2>Catat hasil: '+esc(k.hasil||'Hasil')+'</h2><div class="card" style="display:flex;flex-direction:column;gap:10px"><label class="f">Jumlah ('+esc(k.satuan||'pcs')+')</label>'+stepH('hq',0)
    +'<label class="f">Reject / rusak (pcs)</label>'+stepH('hr',0)+'<input id="hk" placeholder="Keterangan (opsional)"><button class="btn pri big" onclick="simpanHasil()">Simpan hasil</button><div class="mu" style="font-size:12px">Hasil dicek kepala gudang sebelum masuk nilai.</div></div></div>';
  if(k.kerja.indexOf('qc')>=0)h+='<div class="sec"><button class="btn big" onclick="rejOpen()">+ Catat reject (QC)</button></div>';
  if((k.cek||[]).length){var dn={};mine.filter(function(a){return a.jenis==='tugas'}).forEach(function(a){dn[a.d.item]=1});
    h+='<div class="sec"><h2>Tugas hari ini</h2><div style="display:flex;flex-direction:column;gap:8px">'+k.cek.map(function(t,i){return '<button class="task'+(dn[t]?' done':'')+'" '+(dn[t]?'disabled':'onclick="tugas('+i+')"')+'><i>'+(dn[t]?'✓':'')+'</i><span>'+esc(t)+'</span></button>'}).join('')+'</div></div>'}
  h+='<div class="sec"><h2>Sedang apa? <span class="mu" style="font:500 14px Barlow,sans-serif">saat tidak produksi</span></h2><div class="chips">'+D.keg.map(function(g){return '<button class="chip" onclick="kegiatan(\''+esc(g)+'\')">'+esc(g)+'</button>'}).join('')+'</div></div>';
  if(k.jobdesk)h+='<div class="sec"><h2>Jobdesk</h2><div class="card mu" style="white-space:pre-line">'+esc(k.jobdesk)+'</div></div>';
  h+='<div class="sec"><h2>Catatan hari ini</h2><div class="card tl">'+(mine.length?mine.map(aktLine).join(''):'<span class="mu">Belum ada.</span>')+'</div></div>';
  return h}
function stepH(id,v){return '<div class="step"><button aria-label="Kurangi" onclick="stp(\''+id+'\',-1)">−</button><input id="'+id+'" type="number" inputmode="numeric" min="0" value="'+v+'" aria-label="Jumlah"><button class="p" aria-label="Tambah" onclick="stp(\''+id+'\',1)">+</button></div>'}

function parseCeklok(rows){var c=D.cfg,H=['Sabtu','Minggu','Senin','Selasa','Rabu','Kamis','Jumat'],out={list:{},start:'',periode:''};
  var mn=function(t){return (+t.slice(0,2))*60+(+t.slice(3,5))};

  var bR=mn(c.batas),bF=mn(c.jumBatas);

    var id='',nm='';for(j=0;j<rows[i].length;j++){var v=String(rows[i][j]).trim();if(v==='ID:')id=String(rows[i][j+2]||'').trim();if(v==='Nama:')nm=String(rows[i][j+2]||'').trim()}
    var k=i+1;while(k<rows.length&&rows[k].join('').trim()==='')k++;if(k>=rows.length||rows[k].join(' ').indexOf('ID:')>=0)continue;

  return out}

function karForm(id){var k=id?D.K[id]:{};return{id:id,nama:$('e_nama').value,cid:$('e_cid').value,bagian:$('e_bag').value,kerja:[...document.querySelectorAll('.e_k:checked')].map(function(x){return x.value}),hasil:$('e_has').value,satuan:$('e_sat').value,area:$('e_area').value,upah:+$('e_upah').value||0,target:+$('e_tgt').value||0,pin:$('e_pin').value.trim(),jobdesk:$('e_jd').value,cek:$('e_cek').value.split('\n').map(function(x){return x.trim()}).filter(Boolean),urut:k.urut}}
async function karSave(id){var p=karForm(id);if(p.cek.length>5)return toast('Checklist maksimal 5',1);if(p.pin&&!/^\d{4}$/.test(p.pin))return toast('PIN harus 4 angka',1);
  if(await run('karSave',p,'Tersimpan')){$('dlg').close();await load()}}
async function karNon(id){if(!(await yakin('Nonaktifkan '+D.K[id].nama+'?','Karyawan tidak tampil lagi. Data lama tetap tersimpan.','Ya')))return;var p=karForm(id);p.on=false;p.pin='';if(await run('karSave',p,'Dinonaktifkan'))await load()}

/* ---------- mulai ---------- */
(function(){if(!POSBAR.cred()){POSBAR.mount({active:'kinerja',replace:'#hd'});POSBAR.block();return}
  POSBAR.mount({active:'kinerja',replace:'#hd'});load()})();
</script>
