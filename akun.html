<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Akun · Positif</title>
<style>
:root{--bg:#060606;--cd:#111;--ln:#2a2a2a;--tx:#f4f4f2;--mu:#8f8f8a;--ac:#d4ff3f;--rd:#ff8a8a;--gr:#9be37a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,'Segoe UI',sans-serif;min-height:100vh}
button,input,select{font:inherit}
.c{width:min(980px,100%);margin:0 auto;padding:14px}
.lg{min-height:100vh;display:grid;place-items:center;padding:20px}
.k{background:var(--cd);border:1.5px solid rgba(212,255,63,.45);border-radius:20px;padding:22px;width:min(400px,100%)}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:0 0 10px}.mu{color:var(--mu);font-size:14px}
label{display:block;margin:12px 0 4px;font-size:14px;color:#c9c9c4}
input[type=text],input[type=password],select{width:100%;padding:11px;border-radius:10px;border:1px solid #333;background:#060606;color:#fff}
.b{padding:11px 16px;border:0;border-radius:11px;background:var(--ac);color:#0a0a0a;font-weight:700;cursor:pointer}
.b.s{background:#222;color:#fff}.b.d{background:#3a1515;color:var(--rd)}.b.f{width:100%;margin-top:16px}.b.sm{padding:7px 12px;font-size:14px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0 14px;border-bottom:1px solid var(--ln);margin-bottom:14px}
.top .sp{flex:1}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:9px 14px;border-radius:11px;border:1px solid var(--ln);background:none;color:var(--mu);cursor:pointer;font-weight:600}
.tabs button.on{background:var(--ac);color:#0a0a0a;border-color:var(--ac)}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row .sp{flex:1}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;border-bottom:1px solid var(--ln);text-align:left;font-size:15px;vertical-align:middle}th{color:var(--mu);font-weight:600;font-size:13px}
.sc{overflow-x:auto}.bd{display:inline-block;padding:2px 9px;border-radius:99px;font-size:13px;background:#1d1d1d;border:1px solid #333}
.on{color:var(--gr)}.off{color:var(--rd)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.pg label{display:flex;gap:8px;align-items:center;margin:0;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;color:var(--tx);font-size:15px;cursor:pointer}
.pg label.x{opacity:.45;cursor:not-allowed}
.md{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;place-items:center;padding:14px;z-index:50;overflow:auto}.md.on{display:grid}
.md .k{width:min(720px,100%);max-height:94vh;overflow:auto}
.ms{margin:10px 0 0;min-height:22px;font-size:14px}.ms.e{color:var(--rd)}.ms.o{color:var(--gr)}
.tt{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b1b1b;border:1px solid var(--ac);padding:10px 16px;border-radius:12px;z-index:99;display:none}
.tt.e{border-color:var(--rd);color:var(--rd)}
</style></head><body>
<div id="app"></div><div id="md" class="md"><div class="k" id="mk"></div></div><div id="tt" class="tt"></div>
<script>
const API='https://positif-api.positifmerch-blt.workers.dev';
const KT='positif2_token';
let TOK=localStorage.getItem(KT)||'',ME=null,ROLES=[],PERMS=[],USERS=[],tab='';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LBL={kasir:'Pakai kasir',riwayat:'Lihat riwayat penjualan',laporan:'Lihat laporan',void:'Batalkan transaksi',produk_edit:'Ubah produk',harga_edit:'Ubah harga',stok_ubah:'Ubah stok jual',pesanan:'Pesanan custom',prod_lihat:'Lihat produksi',prod_buat:'Buat order produksi',prod_cetak:'Produksi: cetak',prod_bahan:'Produksi: bahan',prod_cutting:'Produksi: potong',prod_jahit:'Produksi: jahit',prod_finishing:'Produksi: finishing',gudang:'Gudang',hapus:'Hapus data',backup:'Cadangan data',pengaturan:'Pengaturan',rekap_kedawung:'Rekap order Kedawung',rekap_wonodadi:'Rekap order Wonodadi',rekap_edit:'Ubah rekap order',app_resi_print:'App Resi Print',app_resi_video:'App Resi Video Packing',app_resi_pickup:'App Resi Pickup Kurir',app_layout:'App Layout Stiker',bahan_lihat:'Lihat stok bahan',bahan_ambil:'Ambil bahan',bahan_kelola:'Kelola stok bahan',pengguna_kelola:'Kelola pengguna',peran_kelola:'Kelola peran',log_lihat:'Lihat catatan aktivitas'};
const FULL=['super_admin','owner'];
function toast(m,e){const t=$('tt');t.textContent=m;t.className='tt'+(e?' e':'');t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
async function api(path,body){
 const o={method:body===undefined?'GET':'POST',headers:{}};
 if(TOK)o.headers.Authorization='Bearer '+TOK;
 if(body!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
 let r;try{r=await fetch(API+path,o)}catch(e){throw new Error('Tidak bisa terhubung ke server.')}
 const j=await r.json().catch(()=>({ok:false,error:'Jawaban server tidak dikenal.'}));
 if(r.status===401&&path!=='/api/login'){lokalKeluar();throw new Error(j.error||'Sesi berakhir.')}
 if(!j.ok)throw new Error(j.error||'Gagal.');return j}
function simpanMe(m){ME=m;try{localStorage.setItem('positif2_me',JSON.stringify(m))}catch(e){}}
function lokalKeluar(){TOK='';ME=null;try{localStorage.removeItem(KT);localStorage.removeItem('positif2_me')}catch(e){}render()}
async function keluar(){try{await api('/api/logout',{})}catch(e){}lokalKeluar()}
async function boot(){if(!TOK)return render();try{simpanMe((await api('/api/me')).me)}catch(e){}render()}

function render(){
 if(!ME)return $('app').innerHTML=`<div class="lg"><div class="k"><h1>Positif</h1><p class="mu" style="margin:0 0 6px">Masuk dengan akun Anda.</p>
 <label>Username</label><input type="text" id="lu" autocapitalize="none" autocomplete="username">
 <label>PIN</label><input type="password" id="lp" autocomplete="current-password" onkeydown="if(event.key==='Enter')masuk()">
 <button class="b f" onclick="masuk()">Masuk</button><div class="ms" id="lm"></div></div></div>`;
 if(ME.must_change)return $('app').innerHTML=`<div class="lg"><div class="k"><h1>Ganti PIN dulu</h1><p class="mu">PIN Anda diatur oleh admin. Buat PIN pribadi sebelum melanjutkan.</p>${pinForm()}</div></div>`;
 const T=[];if(ME.perms.includes('pengguna_kelola'))T.push(['pengguna','Pengguna']);if(ME.perms.includes('peran_kelola'))T.push(['peran','Peran & izin']);if(ME.perms.includes('log_lihat'))T.push(['aktivitas','Aktivitas']);T.push(['akun','Akun saya']);
 if(!T.find(x=>x[0]===tab))tab=T[0][0];
 $('app').innerHTML=`<div class="c"><div class="top"><div><b>${esc(ME.name)}</b><div class="mu">${esc(ME.label)} · @${esc(ME.username)}</div></div><span class="sp"></span><button class="b s sm" onclick="keluar()">Keluar</button></div>
 <div class="tabs">${T.map(x=>`<button class="${x[0]===tab?'on':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('')}</div><div id="body"><p class="mu">Memuat...</p></div></div>`;
 ({pengguna:vPengguna,peran:vPeran,aktivitas:vAktivitas,akun:vAkun})[tab]()}
async function masuk(){const m=$('lm');m.className='ms';m.textContent='Memeriksa...';
 try{const j=await api('/api/login',{username:$('lu').value,pin:$('lp').value});TOK=j.token;localStorage.setItem(KT,TOK);simpanMe(j.me);tab='';render()}
 catch(e){m.className='ms e';m.textContent=e.message}}

/* ---- Akun saya / ganti PIN ---- */
function pinForm(){return `<label>PIN lama</label><input type="password" id="p0"><label>PIN baru (min. 4 karakter)</label><input type="password" id="p1"><label>Ulangi PIN baru</label><input type="password" id="p2"><button class="b f" onclick="gantiPin()">Simpan PIN baru</button><div class="ms" id="pm"></div>`}
async function vAkun(){
 let m=ME;try{m=(await api('/api/me')).me;simpanMe(m)}catch(e){}
 $('body').innerHTML=`<div class="cd"><h2>Izin saya</h2><p class="mu">Peran: <b>${esc(m.label)}</b> · @${esc(m.username)} · ${m.perms.length} izin</p><div class="pg">${m.perms.map(p=>`<label style="cursor:default">${esc(LBL[p]||p)}</label>`).join('')||'<span class="mu">Tidak ada izin.</span>'}</div></div><div class="cd" style="max-width:420px"><h2>Ganti PIN</h2>${pinForm()}</div>`}
async function gantiPin(){const m=$('pm');m.className='ms';
 if($('p1').value!==$('p2').value){m.className='ms e';m.textContent='PIN baru dan ulangannya tidak sama.';return}
 try{await api('/api/pin',{lama:$('p0').value,baru:$('p1').value});simpanMe((await api('/api/me')).me);toast('PIN diganti.');render()}catch(e){m.className='ms e';m.textContent=e.message}}

/* ---- Pengguna ---- */
async function vPengguna(){
 try{const [u,r]=await Promise.all([api('/api/users'),api('/api/roles')]);USERS=u.users;ROLES=r.roles;PERMS=r.perms}catch(e){return $('body').innerHTML='<p class="off">'+esc(e.message)+'</p>'}
 const rl=id=>(ROLES.find(r=>r.id===id)||{}).label||id;
 $('body').innerHTML=`<div class="cd"><div class="row"><h2 style="margin:0">Pengguna</h2><span class="sp"></span><button class="b" onclick="editUser(null)">+ Tambah pengguna</button></div>
 <div class="sc"><table><tr><th>Nama</th><th>Username</th><th>Peran</th><th>Status</th><th></th></tr>${USERS.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>@${esc(x.username)}</td><td><span class="bd">${esc(rl(x.role))}</span></td><td class="${x.active?'on':'off'}">${x.active?'Aktif':'Nonaktif'}</td><td>${x.bisa_diubah?`<button class="b s sm" onclick="editUser('${esc(x.username)}')">Ubah</button>`:`<span class="mu">${x.username===ME.username?'(Anda)':'-'}</span>`}</td></tr>`).join('')}</table></div></div>`}
function bisaPeran(){return ROLES.filter(r=>ME.role==='super_admin'||r.level<ME.level)}
function grid(sel,kunci){return PERMS.map(p=>{const dis=kunci||(!ME.perms.includes(p)&&!sel.has(p));return `<label class="${dis?'x':''}"><input type="checkbox" data-p="${p}" ${sel.has(p)?'checked':''} ${dis?'disabled':''}>${esc(LBL[p]||p)}</label>`}).join('')}
function editUser(un){
 const x=un?USERS.find(u=>u.username===un):{username:'',name:'',role:(bisaPeran()[bisaPeran().length-1]||{}).id,active:true,extra:[],denied:[]};
 const base=id=>new Set((ROLES.find(r=>r.id===id)||{perms:[]}).perms);
 const sel=new Set(base(x.role));x.extra.forEach(p=>sel.add(p));x.denied.forEach(p=>sel.delete(p));
 window._eu={x,un};
 $('mk').innerHTML=`<h2>${un?'Ubah pengguna':'Tambah pengguna'}</h2>
 <label>Username</label><input type="text" id="eu" value="${esc(x.username)}" ${un?'disabled':''} autocapitalize="none">
 <label>Nama</label><input type="text" id="en" value="${esc(x.name)}">
 <label>Peran</label><select id="er" onchange="gantiPeranForm()">${bisaPeran().map(r=>`<option value="${r.id}" ${r.id===x.role?'selected':''}>${esc(r.label)}</option>`).join('')}</select>
 <label>${un?'PIN baru (kosongkan jika tidak diganti)':'PIN awal (min. 4 karakter, orangnya wajib menggantinya)'}</label><input type="password" id="ep" autocomplete="new-password">
 <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ea" ${x.active?'checked':''}> Akun aktif</label>
 <label>Izin <span class="mu">(awalnya mengikuti peran; centang/hapus untuk pengecualian orang ini)</span></label><div class="pg" id="eg">${grid(sel,FULL.includes(x.role))}</div>
 <div class="row" style="margin-top:16px"><button class="b s" onclick="tutup()">Batal</button><span class="sp"></span><button class="b" onclick="simpanUser()">Simpan</button></div><div class="ms" id="em"></div>`;
 $('md').classList.add('on')}
function gantiPeranForm(){const id=$('er').value,r=ROLES.find(x=>x.id===id);$('eg').innerHTML=grid(new Set(r.perms),FULL.includes(id))}
async function simpanUser(){
 const id=$('er').value,base=new Set(ROLES.find(r=>r.id===id).perms),cek=new Set([...document.querySelectorAll('#eg input:checked')].map(i=>i.dataset.p));
 const extra=[...cek].filter(p=>!base.has(p)),denied=[...base].filter(p=>!cek.has(p));
 const b={username:_eu.un||$('eu').value,name:$('en').value,role:id,active:$('ea').checked,extra,denied};if($('ep').value)b.pin=$('ep').value;
 try{await api('/api/users',b);tutup();toast('Tersimpan.');vPengguna()}catch(e){const m=$('em');m.className='ms e';m.textContent=e.message}}
function tutup(){$('md').classList.remove('on')}

/* ---- Peran ---- */
async function vPeran(){
 try{const r=await api('/api/roles');ROLES=r.roles;PERMS=r.perms}catch(e){return $('body').innerHTML='<p class="off">'+esc(e.message)+'</p>'}
 window._rid=window._rid&&ROLES.find(r=>r.id===_rid)?_rid:ROLES[0].id;drawPeran()}
function drawPeran(){const r=ROLES.find(x=>x.id===_rid),kunci=r.terkunci||!(ME.role==='super_admin'||r.level<ME.level);
 $('body').innerHTML=`<div class="cd"><h2>Peran & izin</h2><div class="row"><select id="rs" style="max-width:280px" onchange="_rid=this.value;drawPeran()">${ROLES.map(x=>`<option value="${x.id}" ${x.id===_rid?'selected':''}>${esc(x.label)}</option>`).join('')}</select><span class="sp"></span>${kunci?'':'<button class="b" onclick="simpanPeran()">Simpan peran</button>'}</div>
 <p class="mu">${r.terkunci?'Peran ini selalu punya semua izin dan tidak bisa diubah.':kunci?'Peran ini setingkat atau lebih tinggi dari Anda, jadi hanya bisa dilihat.':'Centang izin yang dimiliki semua orang berperan ini.'}</p>
 <div class="pg" id="rg">${grid(new Set(r.perms),kunci)}</div><div class="ms" id="rm"></div></div>`}
async function simpanPeran(){const perms=[...document.querySelectorAll('#rg input:checked')].map(i=>i.dataset.p);
 try{await api('/api/roles',{id:_rid,perms});toast('Peran tersimpan.');vPeran()}catch(e){const m=$('rm');m.className='ms e';m.textContent=e.message}}

/* ---- Aktivitas ---- */
async function vAktivitas(){
 try{const j=await api('/api/audit'),f=t=>new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
 $('body').innerHTML=`<div class="cd"><h2>Catatan aktivitas (300 terakhir)</h2><div class="sc"><table><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Detail</th></tr>${j.log.map(x=>`<tr><td>${f(x.ts)}</td><td>${esc(x.user)}</td><td>${esc(x.aksi)}</td><td class="mu">${esc(x.detail)}</td></tr>`).join('')}</table></div></div>`}
 catch(e){$('body').innerHTML='<p class="off">'+esc(e.message)+'</p>'}}
boot();
</script></body></html>
