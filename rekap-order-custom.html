<style>
/* Positif POS — tampilan bersama (dipakai semua halaman) */
:root{--bg:#ececec;--card:#fff;--text:#262626;--muted:#767676;--line:#d4d4d4;--acc:#cfcfcf;--acc-t:#111;--ok:#2f6f46;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f0f;--card:#1b1b1b;--text:#ededed;--muted:#9a9a9a;--line:#333;--acc:#bdbdbd;--acc-t:#111;--ok:#6fcf97;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f0f0f;--card:#1b1b1b;--text:#ededed;--muted:#9a9a9a;--line:#333;--acc:#bdbdbd;--acc-t:#111;--ok:#6fcf97;--bad:#ff8a80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Barlow,system-ui,sans-serif}
h2,.num{font-family:"Barlow Condensed",Impact,sans-serif;letter-spacing:.01em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:8px 16px;flex-wrap:wrap}
.logo{height:34px;display:block}.badge.ok,.badge.mid,.badge.bad{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-weight:600;font-size:12px;line-height:1.3;white-space:nowrap;border:1px solid}
.badge svg{width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge.ok{color:#1f8a3b;border-color:rgba(31,138,59,.45);background:transparent;font-weight:500}
.badge.mid{color:#b7791f;border:1.5px solid #d9962b;background:transparent;padding:1px 8px}
.badge.bad{color:#fff;background:#b3302f;border-color:#b3302f;padding:2px 10px}
tr.st-mid>td{background:rgba(217,150,43,.12)}tr.st-mid .num{color:#b7791f}
tr.st-bad>td{background:rgba(179,48,47,.12)}tr.st-bad .num{color:#c0504f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.ok{color:#2fc24f;border-color:rgba(47,194,79,.4)}:root:not([data-theme="light"]) .badge.mid{color:#e8a734;border-color:#c98a2e}:root:not([data-theme="light"]) tr.st-mid>td{background:rgba(217,150,43,.16)}:root:not([data-theme="light"]) tr.st-bad>td{background:rgba(179,48,47,.22)}:root:not([data-theme="light"]) tr.st-mid .num{color:#e8a734}:root:not([data-theme="light"]) tr.st-bad .num{color:#f08a8a}}
:root[data-theme="dark"] .badge.ok{color:#2fc24f;border-color:rgba(47,194,79,.4)}:root[data-theme="dark"] .badge.mid{color:#e8a734;border-color:#c98a2e}:root[data-theme="dark"] tr.st-mid>td{background:rgba(217,150,43,.16)}:root[data-theme="dark"] tr.st-bad>td{background:rgba(179,48,47,.22)}:root[data-theme="dark"] tr.st-mid .num{color:#e8a734}:root[data-theme="dark"] tr.st-bad .num{color:#f08a8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo,:root:not([data-theme="light"]) .rlogo{filter:invert(1)}}
:root[data-theme="dark"] .logo,:root[data-theme="dark"] .rlogo{filter:invert(1)}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav button{border:0;background:none;color:var(--muted);font:600 15px Barlow,sans-serif;padding:8px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--acc);color:var(--acc-t);box-shadow:inset 0 -3px 0 var(--text)}
/* Tab Positif Hub (berframe + dropdown) */
.hub{display:inline-flex;align-items:stretch;flex:none;margin-left:4px;border:1px solid var(--text);border-radius:8px}
.hub button{border-radius:6px}
.hub .caret{padding:8px 10px 8px 4px;font-size:12px}
.hub button:hover,nav .stk:hover{color:var(--text)}
.hubmenu{position:fixed;z-index:20;min-width:200px;background:var(--card);border:1px solid var(--text);border-radius:8px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none}
.hubmenu.on{display:block}
.hubmenu a{display:block;padding:10px 14px;border-radius:6px;color:var(--text);text-decoration:none;font:600 15px Barlow,sans-serif;white-space:nowrap}
.hubmenu a:hover,.hubmenu a:focus-visible{background:var(--acc);color:var(--acc-t);outline:none}
main{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.pos{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
@media(max-width:860px){.pos{grid-template-columns:1fr}}
.bar{display:flex;gap:8px;margin-bottom:12px}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--text);outline-offset:1px}
.bar input{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.p{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;color:var(--text);font:inherit;display:flex;flex-direction:column;gap:4px;min-height:96px}
.p:hover{border-color:var(--text)}.p:disabled{opacity:.45;cursor:not-allowed}
.p b{font-weight:600}.p .num{font-size:22px;margin-top:auto}.p small{color:var(--muted)}
.p img{width:100%;height:96px;object-fit:cover;border-radius:6px;background:var(--bg)}
.thumb{display:flex;width:52px;height:52px;border:1px dashed var(--muted);border-radius:6px;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:12px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:8px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:6px}
.qty button,.x{width:28px;height:28px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:6px;cursor:pointer;font-size:16px}
.btn{border:1px solid var(--text);background:var(--acc);color:var(--acc-t);font:600 15px Barlow,sans-serif;padding:10px 16px;border-radius:6px;cursor:pointer}
.btn.big{width:100%;font-size:17px;padding:13px}.btn.sec{background:var(--bg);color:var(--text);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}.up{display:flex;align-items:center;justify-content:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0}
.total{font-size:40px;font-weight:700;line-height:1}
.muted{color:var(--muted)}.ok{color:var(--ok)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:13px}.scroll{overflow-x:auto}
td input{width:100%;min-width:70px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat .num{font-size:36px;font-weight:700}.stat span{color:var(--muted)}
.badge{padding:2px 8px;border-radius:99px;border:1px solid var(--line);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}.modal .card{width:340px;max-height:90vh;overflow:auto}.modal .card.wide{width:min(720px,100%)}
.rc{font-family:ui-monospace,Menlo,monospace;font-size:13px}.rc .row{margin:2px 0}.rc hr{border:0;border-top:1px dashed var(--muted)}
.lnk{display:block;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:12px;padding:2px 0}
#plabels{display:none}
.lb{box-sizing:border-box;padding:1mm 1.5mm;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#fff;color:#000;font-family:Arial,sans-serif;text-align:center;break-inside:avoid}
.lb .ln{font-size:8pt;font-weight:700;line-height:1.1;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lb .lv{font-size:7.5pt;line-height:1.1}.lb .lp{font-size:8pt;font-weight:700}
.lb svg{width:100%;height:auto;max-height:13mm}
@media print{body:not(.print-labels) *{visibility:hidden}body:not(.print-labels) #modal,body:not(.print-labels) #modal *{visibility:visible}body:not(.print-labels) #modal{position:absolute;background:none;display:block}.noprint{display:none!important}#modal .card{border:0;width:100%}#pk,#pm,#hm,#accm{display:none!important}.logo,.rlogo{filter:none!important}body.print-labels>*:not(#plabels){display:none!important}body.print-labels #plabels{display:flex;flex-wrap:wrap}}
nav{margin-left:clamp(20px,4vw,64px)}
main.full{max-width:none}
.hero{background:#000;border-radius:8px;overflow:hidden;display:flex;justify-content:center}
.hero img{display:block;width:100%;height:auto;max-height:calc(100vh - 110px);object-fit:contain}
.hero-box{position:relative;width:min(100%,calc((100vh - 110px)*1920/1080));aspect-ratio:1920/1080}
.hero-box img{width:100%;height:100%}
.hero-box a{position:absolute;display:block;border-radius:6px;transition:background .15s}
.hero-box a:hover,.hero-box a:focus-visible{background:rgba(255,255,255,.12);outline:none}
@media(max-width:600px){nav{margin-left:6px}main.full{padding:8px}}
.stg{display:flex;gap:4px;margin:8px 0}.stg i{flex:1;height:6px;border-radius:3px;background:currentColor;opacity:.15}.stg i.on{opacity:1;background:var(--ok,#2f6f46)}
.ptabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.ptabs button{white-space:nowrap;border:1px solid var(--line,#d4d4d4);background:var(--card,#fff);color:inherit;padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit}.ptabs button.on{background:var(--acc,#cfcfcf);color:var(--acc-t,#111);font-weight:600}.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}@media(max-width:820px){.cols{grid-template-columns:1fr}}
main{max-width:none;margin:0;padding:16px clamp(12px,2vw,32px)}
.pos{grid-template-columns:minmax(0,1fr) minmax(360px,28vw)}@media(max-width:860px){.pos{grid-template-columns:1fr}}
.dd{display:inline-flex;flex:none}.hubmenu a.cur{background:var(--acc);color:var(--acc-t)}
.ptabs{position:sticky;top:var(--hh,52px);z-index:4;background:var(--bg);padding:8px 0;margin-bottom:0}
.sk1{position:sticky;top:calc(var(--hh,52px) + var(--th,0px));z-index:3;background:var(--card);margin:0 -14px;padding:10px 14px 8px}.bar.sk1{margin-bottom:0}
@media(min-width:900px){#pl.scroll{overflow:visible}#pl th{position:sticky;top:calc(var(--hh,52px) + var(--th,0px) + var(--bh,0px));background:var(--card);z-index:2}}
*{scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.35) transparent}
@supports not (scrollbar-width:thin){::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(128,128,128,.35);border-radius:3px}::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}}
.fl{flex:1;min-height:0;display:flex;flex-direction:column}
.fs{flex:1;min-height:0;overflow:auto}
.fn{flex:none}
.mf{display:flex;flex-direction:column;min-height:0}
#edc,#hmc{overflow:hidden}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.two{grid-template-columns:1fr}}
#grid.fs,#pgrid.fs{align-content:start}
.jh{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-left:6px;padding:0;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;vertical-align:middle}.jh:hover{color:var(--text);border-color:var(--text)}
.accb{border:1px solid var(--line);background:var(--bg);color:var(--text);font:600 14px Barlow,sans-serif;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}.accb:hover{border-color:var(--text)}
#accm .mhr{border:0;border-top:1px solid var(--line);margin:4px 0}
#accm .mlab{display:block;padding:10px 14px;border-radius:6px;font:600 15px Barlow,sans-serif;cursor:pointer;white-space:nowrap}
#accm .mlab:hover{background:var(--acc);color:var(--acc-t)}
#accm .mdanger{color:var(--bad)}#accm .mdanger:hover{color:#b3261e}
@media(min-width:900px){#sbody.scroll,#rjl .scroll{overflow:visible}#sbody th,#rjl th{position:sticky;top:calc(var(--hh,52px) + var(--th,0px) + var(--bh,0px));background:var(--card);z-index:2}}
@media screen and (min-width:861px){
html:has(#view.fit){overflow:hidden}
#view.fit{height:calc(100vh - var(--hh,52px));height:calc(100dvh - var(--hh,52px));overflow:hidden;display:flex;flex-direction:column;gap:12px}

}
/* hover, tekan, popup */
#edc{display:flex;flex-direction:column;overflow:hidden;max-height:90vh}#edc .fs{overflow:auto;min-height:0}#edc .scroll{overflow:visible}
#edc th{position:sticky;top:0;z-index:1;background:color-mix(in srgb,var(--card),var(--text) 7%)}
.ed-ft{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
#pk{background:rgba(0,0,0,.45);backdrop-filter:none}
tr.st-mid>td{background:rgba(217,150,43,.05)}tr.st-mid>td:first-child{box-shadow:inset 3px 0 0 #d9962b}
tr.st-bad>td{background:rgba(179,48,47,.2)}tr.st-bad>td:first-child{box-shadow:inset 4px 0 0 #d23a39}
.form{align-items:center}.form .btn,.row .btn{white-space:nowrap;padding:7px 12px;font-size:14px;line-height:1.2}.form input,.form select{height:36px}
.x:hover{color:#e5484d;border-color:#e5484d!important}
.modal{background:rgba(0,0,0,.72);backdrop-filter:blur(3px)}
.modal .card{background:color-mix(in srgb,var(--card),var(--text) 7%);border:1px solid var(--text);box-shadow:0 24px 70px rgba(0,0,0,.65);animation:mpop .15s ease-out}

#pm{z-index:30}body:has(.modal.on){overflow:hidden}

.btn:not(:disabled):active,.qty button:active,.x:active{transform:translateY(1px)}
@media print{.modal .card{background:var(--card)!important;box-shadow:none!important;animation:none!important}#modal .card{border:0!important}}

.lh,.lr{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center}
.lh{font-size:13px;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.lh span:last-child,.lr>:last-child{text-align:right;justify-self:end}
.lr{padding:8px 6px;border-bottom:1px solid var(--line)}@media(hover:hover){.lr:hover,.rt tr:hover td,.hv tr:hover td{background:rgba(128,128,128,.12)}}
.bar2{height:4px;border-radius:2px;background:rgba(128,128,128,.2);margin-top:4px}.bar2 i{display:block;height:100%;border-radius:2px;background:var(--text);opacity:.7}
.rt th,.rt td{white-space:nowrap}.rt td.it{white-space:normal;min-width:240px;width:100%}.rt .r{text-align:right}.rt .mo{font:12px ui-monospace,Menlo,monospace}.rt small{color:var(--muted)}
.p{position:relative}.p img{object-fit:contain}

[data-cs=s] .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}[data-cs=s] .p img{height:70px}

.hero{height:var(--avh);border-radius:0;align-items:center}

/* ===== Tema gelap futuristik: lime ===== */
html:root[data-theme="dark"]{--bg:#060606;--card:#0f0f0f;--text:#f4f4f2;--muted:#8f8f8a;--line:rgba(255,255,255,.1);--acc:#d4ff3f;--acc-t:#0a0a0a;--ok:#4ddf9a;--bad:#ff6b6b}
body{background:radial-gradient(900px 520px at 88% -8%,rgba(212,255,63,.07),transparent 60%),radial-gradient(760px 520px at -8% 112%,rgba(111,184,255,.05),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
header{background:rgba(10,10,10,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

input:focus-visible,select:focus-visible{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(212,255,63,.15)}
input:focus-visible,select:focus-visible,button:focus-visible{outline-color:var(--acc)}
.modal .card{border-color:rgba(255,255,255,.16)}
.hub{border-color:var(--line)}
.hubmenu{border-color:var(--line);background:#111}
/* ikon */
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
nav{align-items:center;gap:6px;padding:6px 4px}
nav .nv,.hub button{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;position:relative}
.nv .nl{display:none}.nv.on .nl{display:inline}.nv .cv{font-size:11px;opacity:.7}
nav button.on{background:var(--acc);color:var(--acc-t);box-shadow:0 0 24px -6px rgba(212,255,63,.7)}
.bgn{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px Barlow,sans-serif;padding:0 5px;text-align:center}

.ib:hover{border-color:var(--acc);color:var(--acc)}.ib.on{background:var(--acc);color:var(--acc-t);border-color:var(--acc)}.ib .ico{width:20px;height:20px}
.ptabs button{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:14px}

/* alur produksi */

/* =====================================================================
   REVISI TAHAP 3
   - garis lime menyala di kartu, panel, kolom isian
   - sub menu samping: ikon + tulisan; di HP pindah ke bawah layar
   - kotak pesan bertema (pengganti alert/confirm/prompt browser)

   ===================================================================== */
:root{--lmb:rgba(212,255,63,.5);--lmw:rgba(212,255,63,.3);--lmg:0 0 22px -8px rgba(212,255,63,.5)}
@media screen{
 .card,.sb,div.pt,.hubmenu,#accm{border:1px solid var(--lmb)!important;box-shadow:var(--lmg)}
 .sb.cur,.pdt{border-color:rgba(212,255,63,.85)!important;box-shadow:0 0 0 1px rgba(212,255,63,.12),0 0 30px -8px rgba(212,255,63,.7)}
 input,select,textarea{border-color:var(--lmw)}
 input:hover,select:hover,textarea:hover{border-color:var(--lmb)}
 input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(212,255,63,.16),0 0 18px -6px rgba(212,255,63,.6)}
 .btn.sec,.chp,.ib,.si{border-color:var(--lmw)}
 .btn.sec:hover,.chp:hover,.ib:hover,.si:hover{border-color:var(--acc)}
 .chp.on{box-shadow:0 0 18px -4px rgba(212,255,63,.7)}
 .vr.on{box-shadow:0 0 16px -6px rgba(212,255,63,.7)}
}
/* menu atas: logo = Beranda */
.logo{cursor:pointer}

#view .prod>.ptabs.rl{padding:6px;gap:6px;border:1px solid var(--lmb);box-shadow:var(--lmg);border-radius:20px;background:rgba(10,10,10,.82)}

#view .prod>.ptabs.rl button .ico{width:21px;height:21px}
#view .prod>.ptabs.rl button:hover{color:var(--text);border-color:var(--lmw)}

 #view .prod>.ptabs.rl{position:fixed!important;left:8px;right:8px;top:auto!important;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:15;flex-direction:row;justify-content:space-around;overflow-x:auto;scrollbar-width:none;padding:5px;border-radius:18px;background:rgba(8,8,8,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

<script>

const APP_VER = '1.3';

/* ---------- ikon ---------- */
const MSN = {board:'view_kanban',printer:'print',truck:'local_shipping',upload:'upload',download:'download',chart:'bar_chart',gear:'settings',refresh:'refresh',moon:'dark_mode',sun:'light_mode',home:'home',copy:'content_copy',file:'description',trash:'delete',check:'check',x:'close',plus:'add',msg:'send',box:'inventory_2',alert:'warning',wand:'auto_fix_high',user:'person',nota:'receipt_long',edit:'edit',wa:'chat',money:'payments'};
(function(){if(!document.querySelector('link[data-ms]')){var l=document.createElement('link');l.rel='stylesheet';l.setAttribute('data-ms','1');l.href='https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block';document.head.appendChild(l)}if(!document.getElementById('mscss')){var s=document.createElement('style');s.id='mscss';s.textContent='.ms{font-family:"Material Symbols Sharp";font-weight:400;font-style:normal;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-feature-settings:"liga";-webkit-font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 300,"GRAD" 0,"opsz" 24;transition:font-variation-settings .15s;user-select:none;overflow:hidden;line-height:1;flex:none;width:1em;height:1em}.ico.ms{width:1em!important;height:1em!important;fill:none;stroke:none;font-size:22px}.ib .ico.ms{font-size:20px}#view .prod>.ptabs.rl button .ico.ms{font-size:21px}.lnk .ico.ms{font-size:16px}.bcc .btn .ico.ms{font-size:18px}.drop .ico.ms{font-size:30px}.btn .ico.ms{font-size:17px}.dlbtn .ico.ms,.wal .ico.ms,.pbt .ico.ms,.mbtn .ico.ms{font-size:15px}.ptabs button.on .ico.ms,.ib.on .ico.ms,#view .prod>.ptabs.rl button.on .ico.ms,nav button.on .ico.ms,#rail .on .ico.ms{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}@media(max-width:760px){#view .prod>.ptabs.rl button .ico.ms{font-size:24px}}';document.head.appendChild(s)}})();
const ic = (n, c = '') => `<span class="ico ms ${c}" aria-hidden="true">${MSN[n] || n}</span>`;

/* ---------- konstanta ---------- */
const STAT = { BARU: 'Perlu Desain', PROSES: 'Proses Desain', PENDING: 'Pending', SIAP: 'Siap Cetak', CETAK: 'Sudah Cetak', KIRIM: 'Dikirim', BATAL: 'Batal' };

const BAHAN = ['VINYL', 'BONTAK', 'SATIN', 'MESH', 'BANNER', 'TOPI', 'JORAN', 'LAIN'];
const POTONG = { KOTAK: 'Kotak', KISSCUT: 'KissCut', DIECUT: 'DieCut' };
const PRINTABLE = ['pdf', 'png', 'jpg', 'jpeg', 'webp', 'gif'];
const SEMUA = ['OWNER', 'KEDAWUNG', 'WONODADI'];
const VIEWS = [
  { id: 'produksi', l: 'Produksi', s: 'Produksi', i: 'board', r: SEMUA },
  { id: 'cetak', l: 'Antrean Cetak', s: 'Cetak', i: 'printer', r: SEMUA },
  { id: 'telasih', l: 'Order ke Telasih', s: 'Telasih', i: 'truck', r: SEMUA },
  { id: 'laporan', l: 'Laporan', s: 'Laporan', i: 'chart', r: SEMUA },
  { id: 'atur', l: 'Pengaturan', s: 'Atur', i: 'gear', r: SEMUA },
  { id: 'nota', l: 'Pengaturan nota', s: 'Nota', i: 'nota', r: SEMUA }
];
const DEF_CFG = {
  toko: ['soundbalapblitar', 'positif kids', 'jrsy project'],
  tokoDefault: 'soundbalapblitar',
  kataKunci: ['cetak', 'desain sendiri'],
  skuCustom: ['SATIN', 'BONTAK', 'VYNIL', 'VINYL', 'VISU', 'MESH', 'TOPICUSTOM', 'CUSTOM'],
  aturanPositif: ['VINYL:KOTAK', 'VINYL:KISSCUT'],
  bahanRules: [['MESH', 'mesh|jaring'], ['SATIN', 'satin|bendera'], ['BONTAK', 'bontak|cromo'], ['TOPI', 'topi'], ['JORAN', 'joran'], ['VINYL', 'vynil|vinyl|visu|vynyl|stiker|sticker']],
  waTelasih: '',
  hapusHari: 30,
  hargaTelasih: {},
  posUrl: '',
  intervalSync: 30
};

/* ---------- tanggal & angka ---------- */
const pad = n => String(n).padStart(2, '0');
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const BLNF = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const nowStr = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
function pd(s) {
  if (!s) return null;
  const m = String(s).trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
  return m ? new Date(+m[1], m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)) : null;
}
const MEN = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, mei: 4, jun: 5, jul: 6, aug: 7, agu: 7, agt: 7, sep: 8, oct: 9, okt: 9, nov: 10, dec: 11, des: 11 };
function parseAny(s, tahun) {
  if (s == null || s === '') return '';
  if (s instanceof Date) return nowStr(s);
  s = String(s).trim();
  let d = pd(s); if (d) return nowStr(d);
  let m = s.match(/(\d{1,2})[-\s\/]([A-Za-z]{3,})[-\s\/,]*(\d{4})(?:\s+(\d{1,2})[:.](\d{2}))?/);
  if (m) { const mo = MEN[m[2].slice(0, 3).toLowerCase()]; if (mo != null) return nowStr(new Date(+m[3], mo, +m[1], +(m[4] || 0), +(m[5] || 0))); }
  m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})(?:\s+(\d{1,2})[:.](\d{2}))?/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return nowStr(new Date(y, m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0))); }
  m = s.match(/^(\d{1,2})[\/-](\d{1,2})$/);
  if (m) return nowStr(new Date(tahun || new Date().getFullYear(), m[2] - 1, +m[1]));
  return '';
}
const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
function fD(s, jam = true) { const d = pd(s); if (!d) return s || '-'; return `${pad(d.getDate())} ${BLN[d.getMonth()]}${jam ? ' ' + hm(d) : ''}`; }
function fDL(d = new Date()) { return `${HARI[d.getDay()]}, ${d.getDate()} ${BLNF[d.getMonth()]} ${d.getFullYear()}`; }
const num = x => { const n = Number(String(x ?? '').replace(/[^\d-]/g, '')); return isFinite(n) ? n : 0; };
const rp = n => 'Rp' + Math.round(n || 0).toLocaleString('id-ID');
const fx = (n, d = 2) => (Math.round(n * 10 ** d) / 10 ** d).toLocaleString('id-ID');
const mb = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const ext = n => (String(n).split('.').pop() || '').toLowerCase();
const no5 = no => String(no || '').replace(/\s+/g, '').toUpperCase().slice(-5);
const ymNow = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };

/* ---------- state ---------- */
const DEMO_URL = new URLSearchParams(location.search).has('demo');
const CONF = { api: LS.get('api', '') || API_URL_DEFAULT, demo: DEMO_URL || (!API_URL_DEFAULT && LS.get('demo', false)) };
let SES = null; // {nama, peran:'OWNER', user} — dari akun Positif POS
LS.del('ses');
const ST = {
  orders: {}, items: {}, byNo: {}, byUser: {}, users: [], cfg: { ...DEF_CFG }, since: '', loaded: false,
  view: 'produksi', online: true, lastSync: null,
  f: { q: '', st: 'AKTIF', bahan: '', toko: '' }, imports: [],
  tl: { tab: 'kirim', sel: new Set(), bulan: ymNow() },
  lap: { bulan: ymNow() }
};
let DET = null; // no order yang terbuka di popup
let IMP = null; // data import yang sedang dipratinjau

/* ---------- API ---------- */
const posCred = () => (window.POSBAR ? POSBAR.cred() : null);
async function api(action, data = {}) {
  if (CONF.demo) return Demo.call(action, data);
  if (!CONF.api) throw new Error('URL server belum diatur');
  const auth = posCred();
  if (!auth) throw new Error('AUTH Masuk dulu ke Positif POS.');
  let r;
  try { r = await fetch(CONF.api, { method: 'POST', body: JSON.stringify({ ...data, action, auth: { user: auth.u, tok: auth.t } }) }); }
  catch (e) { throw new Error('Tidak bisa terhubung ke server. Cek internet.'); }
  if (!r.ok) throw new Error('Server error ' + r.status);
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('Balasan server tidak valid. Cek URL Web App & akses "Anyone".'); }
  if (!j.ok) throw new Error(j.error || 'Gagal');
  return j;
}

/* ---------- mode demo (tanpa server, data di browser ini saja) ---------- */
const Demo = {
  db: null, files: new Map(),
  load() {
    this.db = LS.get('demo_db', null) || {
      ORDER: [], ITEM: [], MASTER: {}, LOG: [], IMPORT: [],
      USER: [{ nama: 'Owner', peran: 'OWNER', pin: '1234' }, { nama: 'Admin Kedawung', peran: 'KEDAWUNG', pin: '2222' }, { nama: 'Admin Wonodadi', peran: 'WONODADI', pin: '3333' }]
    };
  },
  save() { this.db.LOG = this.db.LOG.slice(-1000); LS.set('demo_db', this.db); },
  async call(a, d) {
    if (!this.db) this.load();
    await new Promise(r => setTimeout(r, 80));
    const user = { nama: SES?.nama || 'Demo', peran: 'OWNER' }, now = new Date().toISOString();
    const own = () => { if (user.peran !== 'OWNER') throw new Error('Hanya Owner yang boleh melakukan ini'); };
    const up = (t, key, rows, mode) => {
      const out = [];
      (rows || []).forEach(o => {
        const k = String(o[key] || '').trim(); if (!k) return;
        let r = this.db[t].find(x => x[key] === k);
        if (r) { if (mode === 'insert') return; for (const f in o) if (!['createdAt', 'createdBy', 'updatedAt', 'updatedBy'].includes(f)) r[f] = o[f] == null ? '' : String(o[f]); }
        else { if (mode === 'patch') return; r = {}; for (const f in o) r[f] = o[f] == null ? '' : String(o[f]); r[key] = k; r.createdAt = now; r.createdBy = user.nama; this.db[t].push(r); }
        r.updatedAt = now; r.updatedBy = user.nama; out.push({ ...r });
      });

    };
    const log = (aksi, ref, detail) => this.db.LOG.push({ waktu: nowStr(), user: user.nama, aksi, ref, detail: String(detail || '').slice(0, 300) });
    switch (a) {
      case 'login': return { ok: true, user };
      case 'pull': { const s = d.since || ''; return { ok: true, orders: this.db.ORDER.filter(r => !s || r.updatedAt > s).map(r => ({ ...r })), items: this.db.ITEM.filter(r => !s || r.updatedAt > s).map(r => ({ ...r })), users: this.db.USER.map(x => ({ nama: x.nama, peran: x.peran })), config: this.db.MASTER, imports: this.db.IMPORT.slice(-10), since: new Date(Date.now() - 90000).toISOString(), user }; }

/* kirim file ke Telasih: menu berbagi (semua PDF/gambar & didukung perangkat) atau ZIP + WhatsApp */
function bukaWA(text) {
  let n = String(ST.cfg.waTelasih || '').replace(/\D/g, ''); if (n.startsWith('0')) n = '62' + n.slice(1);
  const w = window.open(`https://wa.me/${n}?text=${encodeURIComponent(text)}`, '_blank');
  if (!w) toast('Popup diblokir browser. Izinkan popup untuk halaman ini.', 1);
}
async function kirimWA() {
  const ks = [...ST.tl.sel].filter(k => ST.items[k]); if (!ks.length) return;
  const nos = [...new Set(ks.map(k => ST.items[k].no))];
  const files = nos.flatMap(no => liveFiles(ST.orders[no]).map(f => ({ no, f })));
  const text = waText();
  if (!files.length) {
    if (!await dlg({ title: 'Belum ada file cetak', msg: 'Item yang dipilih belum punya file. Kirim teks daftar order saja?', ok: 'Kirim teks' })) return;
    bukaWA(text); return sudahTerkirim(ks);
  }
  const pg = progOpen('Menyiapkan file…'), got = [];
  try {
    for (let n = 0; n < files.length; n++) {
      const { f } = files[n];
      pg.set(n / files.length * 85, null, `${n + 1}/${files.length} · ${f.name}`);
      const v = await ambilFile(f.id);
      got.push(new File([v.blob], f.name, { type: v.blob.type || MIME[ext(f.name)] || 'application/octet-stream' }));
    }
  } catch (e) { pg.close(); return toast('Gagal mengambil file: ' + e.message, 1); }
  let bisaShare = false;
  try { bisaShare = got.every(x => PRINTABLE.includes(ext(x.name))) && !!navigator.canShare && navigator.canShare({ files: got }); } catch (e) { }
  if (bisaShare) {
    await pg.done('File siap');
    if (!await dlg({ title: 'Kirim ke WhatsApp', html: `<div class="ubm">${got.length} file siap.\nDi menu berbagi, pilih <b>WhatsApp</b> lalu kontak <b>Telasih</b>. Teks daftar order ikut terkirim.</div>`, ok: 'Bagikan' })) return;
    try { await navigator.share({ files: got, text }); }
    catch (e) { if (e && e.name === 'AbortError') return; return toast('Menu berbagi gagal: ' + e.message, 1); }
  } else {
    if (!window.JSZip) { pg.close(); return toast('Pembuat ZIP belum termuat. Pastikan terhubung internet lalu muat ulang halaman.', 1); }
    pg.set(90, 'Membuat ZIP…');
    const z = new JSZip(), dipakai = {};
    got.forEach(x => { let nm = x.name; if (dipakai[nm]) { dipakai[nm]++; nm = nm.replace(/(\.[^.]*)?$/, ` (${dipakai[nm]})$1`); } else dipakai[nm] = 1; z.file(nm, x); });
    const blob = await z.generateAsync({ type: 'blob' }), zn = `Order Telasih ${nowStr().slice(0, 10)}.zip`;
    await pg.done('ZIP siap');
    if (!await dlg({ title: 'Kirim ke WhatsApp', html: `<div class="ubm"><b>${esc(zn)}</b> · ${got.length} file · ${mb(blob.size)}\n\n1. Klik <b>Download & buka WhatsApp</b>\n2. Chat Telasih terbuka dengan teks daftar order\n3. Seret file ZIP dari folder Download ke chat, lalu kirim</div>`, ok: 'Download & buka WhatsApp' })) return;
    const u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u; a.download = zn; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 120000);
    bukaWA(text);
  }
  sudahTerkirim(ks);
}

  if (!await dlg({ title: 'File sudah terkirim ke Telasih?', msg: `${ks.length} item akan pindah ke tab "Sedang di Telasih" dengan tanggal kirim hari ini.`, ok: 'Ya, sudah terkirim', cancel: 'Nanti' })) return;

function pilihExcel(type, toko) {

async function bacaImport(f, type = 'shopee', toko = ST.cfg.tokoDefault) {
  if (!window.XLSX) return toast('Pembaca Excel belum termuat. Pastikan komputer terhubung internet, lalu muat ulang halaman.', 1);
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: true });
    IMP = { type, toko: toko || ST.cfg.tokoDefault, fname: f.name, wb, incl: new Set() };
    if (type === 'shopee') {
      const sn = wb.SheetNames.find(n => n.toLowerCase() === 'orders') || wb.SheetNames.find(n => { const r = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1 })[0] || []; return r.some(c => /No\.?\s*Pesanan/i.test(String(c))); });
      if (!sn) throw new Error('Sheet "orders" dengan kolom "No. Pesanan" tidak ditemukan. Pastikan ini file export Shopee.');
      IMP.rows = bacaShopee(wb.Sheets[sn]);
      openImp();
    } else {
      IMP.sheet = wb.SheetNames.find(n => /DASH|DASBOARD|PRODUKSI/i.test(n)) || wb.SheetNames[0];
      renderImp();
    }
  } catch (e) { IMP = null; toast('Gagal membaca file: ' + e.message, 1); }
}
function openImp() {
  DET = null;
  $('#mdc').className = 'card wide';
  $('#mdc').innerHTML = `<div class="mdh"><div><h2 style="margin:0">Upload Excel Shopee</h2><div class="muted sm">${esc(IMP.fname)}</div></div><button class="x" data-act="close">×</button></div><div id="impBody"></div>`;
  $('#md').classList.add('on');
  renderImp();
}
function bacaShopee(ws) {
  const raw = XLSX.utils.sheet_to_json(ws, { defval: '', raw: true });
  const val = v => v instanceof Date ? nowStr(v) : typeof v === 'number' ? String(Math.round(v)) : String(v ?? '').trim();
  if (!raw.length) return [];
  const keys = Object.keys(raw[0]);
  const H = (...c) => { for (const x of c) { const k = keys.find(k => k.trim().toLowerCase() === x.toLowerCase()); if (k) return k; } for (const x of c) { const k = keys.find(k => k.trim().toLowerCase().startsWith(x.toLowerCase())); if (k) return k; } return null; };
  const C = { no: H('No. Pesanan'), status: H('Status Pesanan'), dl: H('Pesanan Harus Dikirimkan Sebelum'), dibuat: H('Waktu Pesanan Dibuat'), skuI: H('SKU Induk'), nama: H('Nama Produk'), skuR: H('Nomor Referensi SKU'), var: H('Nama Variasi'), qty: H('Jumlah'), harga: H('Harga Setelah Diskon'), total: H('Total Pembayaran'), note: H('Catatan dari Pembeli'), user: H('Username (Pembeli)') };
  if (!C.no || !C.nama) throw new Error('Kolom "No. Pesanan" / "Nama Produk" tidak ada.');
  if (!C.dl) throw new Error('Kolom "Pesanan Harus Dikirimkan Sebelum" tidak ada di file ini.');
  return raw.map(r => { const o = {}; for (const k in C) o[k] = C[k] ? val(r[C[k]]) : ''; o.no = o.no.replace(/\s+/g, '').toUpperCase(); return o; }).filter(r => r.no && !/batal/i.test(r.status));
}
function isCustomLine(l) {
  if (IMP.incl.has(l.nama)) return true;
  const nm = l.nama.toLowerCase();
  if ((ST.cfg.kataKunci || []).some(k => k && nm.includes(String(k).toLowerCase()))) return true;
  const s1 = l.skuR.toUpperCase(), s2 = l.skuI.toUpperCase();
  return (ST.cfg.skuCustom || []).some(s => { s = String(s).toUpperCase().trim(); return s && (s === s1 || s === s2); });
}
function buildShopee() {
  const by = {};
  IMP.rows.forEach(r => (by[r.no] || (by[r.no] = [])).push(r));
  const res = { baru: [], ada: [], non: {}, nonRows: 0, total: Object.keys(by).length, rows: IMP.rows.length };
  for (const no in by) {
    const lines = by[no], cl = lines.filter(isCustomLine);
    lines.filter(l => !cl.includes(l)).forEach(l => { res.non[l.nama] = (res.non[l.nama] || 0) + 1; res.nonRows++; });
    if (!cl.length) continue;
    const f = lines[0];
    const o = { no, no5: no5(no), toko: IMP.toko, platform: 'SHOPEE', sumber: 'IMPORT', deadline: parseAny(f.dl), dibuat: parseAny(f.dibuat), username: f.user, catatanPembeli: f.note, jasaDesain: '', totalBayar: String(num(f.total)), status: 'BARU', catatan: '', files: '[]', cekShopee: '' };
    const cnt = {}, items = [];
    cl.forEach(l => {
      const v = l.var;
      if (/desain/i.test(v)) o.jasaDesain = '1';
      if (/jasa\s*desain/i.test(v) && !/cetak/i.test(v)) return;
      const sku = l.skuR || l.skuI;
      const base = `${no}|${v}|${sku}`;
      cnt[base] = (cnt[base] || 0) + 1;
      const bahan = detBahan(v, sku, l.nama), potong = detPotong(v), q = num(l.qty) || 1, h = num(l.harga);
      items.push({ kunci: base + '#' + cnt[base], no, bahan, skuRaw: sku, namaProduk: l.nama, variasi: v, potong, ukuran: detUkuran(v), jumlah: String(q), harga: String(h), subtotal: String(h * q), label: '', namaDesain: '', pencetak: detPencetak(bahan, potong), tglKeVendor: '', tglCetak: '', dicetakOleh: '', hapus: '' });
    });
    if (!items.length && !o.jasaDesain) continue;
    if (ST.orders[no]) { res.ada.push(no); continue; }

const isWA = o => o && (o.sumber === 'WA' || o.platform === 'WA');
function bayarOf(o) {

  const disk = Math.min(num(o.diskon), sub), total = Math.max(0, sub - disk), dp = num(o.dp), lunas = num(o.bayarLunas);
  const sisa = Math.max(0, total - dp - lunas);
  return { sub, disk, total, dp, lunas, sisa, min: Math.ceil(total * 0.6), lunasOk: total > 0 && sisa === 0 };
}

const FC = new Map();
const b64 = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(new Error('File tidak bisa dibaca')); r.readAsDataURL(f); });
const MIME = { pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', gif: 'image/gif', cdr: 'application/x-coreldraw' };
function progOpen(title) {
  const w = document.createElement('div'); w.className = 'ubx';
  w.innerHTML = `<div class="ubc pgc"><div class="spin"></div><h3 class="ubt">${esc(title)}</h3><div class="ubm sm" data-s></div><div class="pgb"><i data-i></i></div><div class="row sm muted" style="margin:0"><span data-m>0 detik</span><b data-p>0%</b></div></div>`;
  document.body.append(w);
  const q = x => w.querySelector(x), t0 = Date.now();
  let sim = null;
  const tick = setInterval(() => { q('[data-m]').textContent = Math.round((Date.now() - t0) / 1000) + ' detik'; }, 500);
  const P = {
    set(p, msg, sub) { p = Math.max(0, Math.min(100, p)); q('[data-i]').style.width = p + '%'; q('[data-p]').textContent = Math.round(p) + '%'; if (msg != null) q('.ubt').textContent = msg; if (sub != null) q('[data-s]').textContent = sub; },
    sim(from, to, sec) { clearInterval(sim); const s0 = Date.now(); sim = setInterval(() => { const k = (Date.now() - s0) / 1000 / sec; P.set(from + (to - from) * (1 - Math.exp(-2.2 * k))); }, 200); },
    stop() { clearInterval(sim); },
    async done(msg = 'Selesai') { clearInterval(sim); P.set(100, msg); q('.spin').classList.add('ok'); await new Promise(r => setTimeout(r, 800)); P.close(); },
    close() { clearInterval(sim); clearInterval(tick); w.classList.add('out'); setTimeout(() => w.remove(), 150); }
  };
  return P;
}
const b64p = (f, on) => new Promise((res, rej) => { const r = new FileReader(); r.onprogress = e => e.lengthComputable && on && on(e.loaded / e.total); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(new Error('File tidak bisa dibaca')); r.readAsDataURL(f); });
async function uploadFiles(no, files) {
  files = [...files]; if (!files.length || !no) return;
  const besar = files.filter(f => f.size > 30 * 1048576);
  if (besar.length && !await dlg({ title: 'File besar', msg: besar.map(f => `${f.name} (${mb(f.size)})`).join('\n') + '\n\nBatas nyaman ±30 MB — upload bisa lama atau gagal. Lanjutkan?', ok: 'Lanjut' })) return;
  const pg = progOpen('Mengupload file cetak…');
  let ok = 0;
  for (let n = 0; n < files.length; n++) {
    const f = files[n], base = n / files.length * 100, span = 100 / files.length;
    pg.set(base, files.length > 1 ? `Mengupload ${n + 1} dari ${files.length}…` : 'Mengupload file cetak…', `${f.name} · ${mb(f.size)}`);
    try {
      const data = await b64p(f, p => pg.set(base + span * 0.15 * p));
      pg.sim(base + span * 0.15, base + span * 0.97, Math.max(3, f.size / 1048576 * 2.5 + 2));
      const j = await api('upload', { no, name: f.name, mime: f.type || MIME[ext(f.name)] || 'application/octet-stream', size: f.size, data });
      merge(j); refresh(); ok++;
    } catch (e) { pg.stop(); toast('Upload gagal: ' + f.name + ' — ' + e.message, 1); }
  }
  if (ok) await pg.done(ok === files.length ? 'Upload selesai ✓' : `${ok} dari ${files.length} file terupload`); else pg.close();
}
async function tandaiCetakFile(no, id) {
  const o = ST.orders[no]; if (!o) return;
  const fs = filesOf(o), f = fs.find(x => x.id === id); if (!f) return;
  f.printedAt = new Date().toISOString(); f.printedBy = SES.nama;
  ST.orders[no] = { ...o, files: JSON.stringify(fs) }; reindex(); refresh();
  try { merge(await api('fileMark', { no, id })); }
  catch (e) {
    if (/tidak dikenal/i.test(e.message)) { try { merge(await api('save', { orders: [{ no, files: JSON.stringify(fs) }], items: [], mode: 'patch', aksi: 'file dicetak' })); } catch (e2) { toast(e2.message, 1); } }
    else toast('Gagal menandai: ' + e.message, 1);
  }
  // semua file order sudah dicetak → item cetak sendiri ikut ditandai sudah cetak
  if (liveFiles(ST.orders[no]).every(x => x.printedAt)) {
    const ks = itemsOf(no).filter(i => i.pencetak === 'POSITIF' && !i.tglCetak).map(i => i.kunci);
    if (ks.length) await setCetak(ks, true);
  }
  refresh();
}
async function ambilFile(id) {
  if (FC.has(id)) return FC.get(id);
  toast('Mengambil file…');
  const j = await api('getFile', { id });
  const bin = atob(j.data), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  const blob = new Blob([u], { type: j.mime || 'application/octet-stream' });
  const v = { blob, url: URL.createObjectURL(blob) };
  FC.set(id, v);
  return v;
}
const fileOf = (no, id) => filesOf(ST.orders[no]).find(f => f.id === id);
async function cetakFile(no, id) {
  const f = fileOf(no, id); if (!f) return;
  const e = ext(f.name);
  if (!PRINTABLE.includes(e)) return toast('File ' + e.toUpperCase() + ' tidak bisa dicetak dari browser. Gunakan Download.', 1);
  let v; try { v = await ambilFile(id); } catch (err) { return toast('Gagal mengambil file: ' + err.message, 1); }
  const ok = await dlg({ title: f.printedAt ? 'Cetak ulang?' : 'Siap mencetak', html: `<div class="ubm"><b>${esc(f.name)}</b>${f.printedAt ? `\n<span style="color:#ffc247">File ini sudah dicetak ${fDT(f.printedAt)}${f.printedBy ? ' oleh ' + esc(f.printedBy) : ''}.</span>` : ''}\n\nDi jendela cetak, pastikan:\n• Ukuran kertas: <b>A3</b>\n• Skala: <b>Ukuran sebenarnya / Actual size (100%)</b> — bukan "Fit to page"\n• Margin: <b>None / Tidak ada</b></div>`, ok: f.printedAt ? 'Cetak ulang' : 'Buka & Cetak' });
  if (!ok) return;
  if (e === 'pdf') {
    const w = window.open(v.url, '_blank');
    if (!w) return toast('Popup diblokir browser. Izinkan popup untuk halaman ini lalu coba lagi.', 1);
    if (!f.printedAt) tandaiCetakFile(no, id);
    return;
  }
  const w = window.open('', '_blank');
  if (!w) return toast('Popup diblokir browser. Izinkan popup untuk halaman ini lalu coba lagi.', 1);
  const img = new Image();
  img.onload = () => {
    const land = img.naturalWidth > img.naturalHeight;
    w.document.write(`<!doctype html><title>${esc(f.name)}</title><style>@page{size:A3 ${land ? 'landscape' : 'portrait'};margin:0}html,body{margin:0;background:#fff}img{display:block;width:100%;height:auto}</style><img src="${v.url}">`);
    w.document.close();
    setTimeout(() => { w.focus(); w.print(); }, 400);
  };
  img.src = v.url;
  if (!f.printedAt) tandaiCetakFile(no, id);
}
async function unduhFile(no, id) {
  const f = fileOf(no, id); if (!f) return;
  let v; try { v = await ambilFile(id); } catch (err) { return toast('Gagal mengambil file: ' + err.message, 1); }
  const a = document.createElement('a'); a.href = v.url; a.download = f.name; document.body.append(a); a.click(); a.remove();
  if (!PRINTABLE.includes(ext(f.name)) && !f.printedAt) tandaiCetakFile(no, id); // CDR dicetak dari CorelDraw
}

  applyTheme();
  $('#btnRef').innerHTML = ic('refresh');
  if (!CONF.api && !CONF.demo) return showSetup();
  if (CONF.demo) { SES = { nama: (window.POSBAR && POSBAR.me()?.name) || 'Demo', peran: 'OWNER' }; return start(); }
  const c = posCred();
  if (!c) return blokir('');
  if (!bolehRekap()) return blokir('Akun ' + (POSBAR.me()?.name || c.u) + ' tidak punya izin Rekap order. Minta Owner mengaturnya di Positif POS > Pengaturan > Pengguna.');
  SES = { nama: POSBAR.me()?.name || c.u, peran: 'OWNER', user: c.u };
  start();
}
boot();
new ResizeObserver(() => document.documentElement.style.setProperty('--hh', $('#hd').offsetHeight + 'px')).observe($('#hd'));
setInterval(() => { if (SES && ST.loaded) refresh(); }, 60000); // perbarui label "terlambat / hari ini"
</script>
</body>
</html>
