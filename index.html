<body>
<header class="noprint"><h1 style="margin:0;line-height:0"><img id="lg" class="logo" alt="Positif Clothing" title="POS" onclick="go('beranda')"></h1><nav id="nav"></nav><span id="sync" class="muted" style="font-size:13px;cursor:pointer" onclick="syncNow()" title="Klik untuk sinkron sekarang"></span><span id="acc"></span></header>

<div id="modal" class="modal"><div class="card"><div id="rc" class="rc"></div>
<div class="row noprint"><button class="btn sec" onclick="closeM()">Tutup</button><select id="rw" onchange="setRW(this.value)" title="Lebar kertas"><option value="58">58 mm</option><option value="80">80 mm</option><option value="100">100 mm</option></select><button class="btn" onclick="printRc()">Cetak struk</button></div></div></div>
<div id="pk" class="modal" onclick="if(event.target===this)closePk()"><div class="card wide" id="pkc"></div></div>
<div id="pm" class="modal" onclick="if(event.target===this)closePm()"><div class="card wide" id="pmc"></div></div>

<div id="plabels"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script>window.PAGE_TABS=["beranda", "kasir", "riwayat", "laporan", "produk", "stok", "bahan", "pesanan", "pengguna", "cadangan"];window.PAGE_HOME="beranda";</script>
<script src="inti.js?v=20261120b"></script>
<script>
/* ---------- MENU: Beranda, Kasir, Produk, Stok, Foto & Barcode, Pesanan, Riwayat, Laporan ---------- */
/* ---------- BERANDA ---------- */
function vBeranda(){
 $('view').innerHTML='<div class="dash"><div class="dclk" id="dclk"><div class="dclk-t"></div><div class="dclk-w"></div><div class="dclk-d"></div></div></div>';startClock()}
let clkT=null;
function startClock(){clearInterval(clkT);const tick=()=>{const e=$('dclk');if(!e){clearInterval(clkT);return}const n=new Date(),p=x=>String(x).padStart(2,'0');
 e.querySelector('.dclk-t').innerHTML=p(n.getHours())+':'+p(n.getMinutes())+'<span class="sec">:'+p(n.getSeconds())+'</span>';
 e.querySelector('.dclk-w').textContent=n.toLocaleDateString('id-ID',{weekday:'long'});
 e.querySelector('.dclk-d').textContent=n.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})};tick();clkT=setInterval(tick,1000)}
/* ---------- KASIR ---------- */
function vKasir(){
 $('view').innerHTML=`<div class="pos"><section class="fl">
 <div class="bar fn"><input id="q" placeholder="Scan barcode atau cari produk..." value="${esc(q)}" oninput="q=this.value;grid()" onkeydown="scanKey(event)" autocomplete="off" autofocus><select id="cat" onchange="cat=this.value;grid()">${[HID,...cats()].map(c=>`<option ${c===cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
 <div id="msg" class="muted fn" style="min-height:22px;margin:-4px 0 8px"></div><div id="grid" class="grid fs"></div></section>
 <aside class="card fl"><h2 class="fn" style="margin:0 0 4px;font-size:24px">Keranjang</h2><div id="lines" class="fs"></div><div class="fn">
 <div class="row"><span>Diskon (Rp)</span><input id="disc" type="text" inputmode="numeric" data-n min="0" value="0" style="width:130px" oninput="calc()"></div>
 <div class="row"><span>Pembayaran</span><select id="pay" onchange="calc()"><option>Transfer</option><option>Tunai</option><option>QRIS</option></select></div>
 <div class="row" id="paidrow"><span>Uang diterima</span><input id="paid" type="text" inputmode="numeric" data-n min="0" style="width:130px" oninput="calc()"></div>
 <div class="row"><span class="muted">Total bayar</span><span id="tot" class="num total">Rp0</span></div>
 <div class="row"><span class="muted">Kembalian</span><b id="chg">Rp0</b></div>
 <button class="btn big" id="go" onclick="checkout()">Bayar</button></div></aside></div>`;
 grid();lines();$('q').focus();
}
function grid(){
 const ql=q.toLowerCase();
 if(cat===HID&&!q.trim()){$('grid').innerHTML='<p class="muted">Produk disembunyikan. Pilih kategori di kanan atas, atau ketik nama produk / scan barcode.</p>';return}
 const l=S.products.filter(p=>p.variants.length&&(cat===HID||cat==='Semua'||p.cat===cat)&&(p.name.toLowerCase().includes(ql)||p.variants.some(v=>vl(v).toLowerCase().includes(ql)||bcv(v).includes(q))));
 $('grid').innerHTML=l.length?l.map(p=>{const im=(p.variants.find(v=>v.img)||{}).img,iv=(p.variants.find(v=>v.img)||{}).id,st=p.variants.reduce((a,v)=>a+v.stock,0),n=p.variants.length,pr=p.variants.map(v=>vp(p,v)),lo=Math.min(...pr);
 return `<button class="p" ${st<1?'disabled':''} onclick="pick(${p.id})">${im?`<img src="${im}" alt="">`+zb(p.id,iv):''}<b>${esc(p.name)}</b><small>${n>1?n+' varian, ':''}${st>=9999?'jasa':'stok '+st}</small><span class="num">${Math.max(...pr)!==lo?'mulai ':''}${rp(lo)}</span></button>`}).join(''):'<p class="muted">Produk tidak ditemukan. Tambahkan di menu Produk.</p>';
}
function beep(ok){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?880:220;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}}
function scanKey(e){
 if(e.key!=='Enter')return;const code=$('q').value.trim();if(!code)return;
 let x=allV().find(a=>bcv(a.v)===code);
 if(!x){const m=allV().filter(a=>(a.p.name+' '+vl(a.v)).toLowerCase().includes(code.toLowerCase()));if(m.length===1)x=m[0]}
 if(!x){if(/^\d{6,}$/.test(code)){note('Barcode '+code+' belum terdaftar. Tambahkan di menu Produk.',1);beep(0)}return}
 if(x.v.stock<1){note(cn(x.p,x.v)+' stok habis.',1);beep(0);return}
 addV(x.v.id);q='';$('q').value='';grid();note(cn(x.p,x.v)+' masuk keranjang.');beep(1)}
function pick(pid){const p=S.products.find(x=>x.id===pid);if(p.variants.length===1)addV(p.variants[0].id);else{pk=pid;renderPk();$('pk').classList.add('on')}}
function closePk(){pk=null;$('pk').classList.remove('on');const i=$('q');if(i)i.focus()}
function renderPk(){pkSide();const p=S.products.find(x=>x.id===pk);if(!p)return;
 $('pkc').innerHTML=`<h2 style="margin:0 0 4px;font-size:24px">${esc(p.name)}</h2><p class="muted" style="margin:0 0 10px">Pilih varian. Klik beberapa kali untuk menambah jumlah.</p><div class="grid">${p.variants.map(v=>{const c=cart.find(c=>c.id===v.id);return `<button class="p" ${v.stock<1?'disabled':''} onclick="addV(${v.id})">${v.img?`<img src="${v.img}" alt="">`+zb(p.id,v.id):''}<b>${esc(vl(v))}</b><small>${v.stock>=9999?'jasa':'stok '+nf(v.stock)}${c?', di keranjang '+c.qty:''}</small><span class="num">${rp(vp(p,v))}</span></button>`}).join('')}</div><div class="row"><span></span><button class="btn" onclick="closePk()">Selesai</button></div>`}
function addV(id){const x=findV(id);if(!x)return;const c=cart.find(c=>c.id===id);
 if(c){if(c.qty<x.v.stock)c.qty++}else if(x.v.stock>0)cart.push({id,name:cn(x.p,x.v),price:vp(x.p,x.v),qty:1});
 lines();if(pk)renderPk();else{const i=$('q');if(i)i.focus()}}
function setQty(id,v){const c=cart.find(x=>x.id===id),x=findV(id);v=Math.floor(+v||0);if(!c)return;if(x&&v>x.v.stock){note('Stok hanya '+nf(x.v.stock),1);v=x.v.stock}if(v<1)cart=cart.filter(y=>y.id!==id);else c.qty=v;lines();const q=$('q');if(q)q.focus()}
function chg(id,d){const c=cart.find(x=>x.id===id),x=findV(id);c.qty+=d;if(x&&c.qty>x.v.stock)c.qty=x.v.stock;if(c.qty<1)cart=cart.filter(x=>x.id!==id);lines()}
function lines(){
 cart=cart.filter(c=>findV(c.id));
 $('lines').innerHTML=cart.length?cart.map(c=>`<div class="line"><b>${esc(c.name)}</b><span>${rp(c.price*c.qty)}</span><div class="qty"><button onclick="chg(${c.id},-1)" aria-label="Kurangi">-</button><input type="text" inputmode="numeric" data-n value="${c.qty}" style="width:52px;text-align:center;height:30px" onchange="setQty(${c.id},this.value)" aria-label="Jumlah"><button onclick="chg(${c.id},1)" aria-label="Tambah">+</button></div><span class="muted">@ ${rp(c.price)}</span></div>`).join(''):'<p class="muted">Scan barcode atau pilih produk untuk mulai transaksi.</p>';
 calc();
}
function calc(){
 const sub=cart.reduce((a,c)=>a+c.price*c.qty,0),d=Math.min(Math.max(+$('disc').value||0,0),sub),t=sub-d,cash=$('pay').value==='Tunai';
 $('tot').textContent=rp(t);$('paidrow').style.display=cash?'flex':'none';
 const paid=+$('paid').value||0;
 $('chg').textContent=cash?rp(Math.max(paid-t,0)):'-';$('chg').className=cash&&paid<t?'bad':'ok';
 $('go').disabled=!cart.length;return{sub,d,t,cash,paid}
}
function checkout(){
 const{sub,d,t,cash,paid}=calc();if(!cart.length)return;
 if(cash&&paid<t){alert('Uang diterima masih kurang dari total.');return}
 const s={id:invId(),date:new Date().toISOString(),items:cart.map(c=>({...c})),sub,disc:d,total:t,pay:$('pay').value,paid:cash?paid:t};
 cart.forEach(c=>{const x=findV(c.id);if(x&&!isJ(x.v)){logS(x,'Penjualan',x.v.stock,x.v.stock-c.qty,s.id);x.v.stock-=c.qty}});
 S.sales.unshift(s);save();cart=[];receipt(s);render();
}
let RCS=null,RW=100;try{RW=+localStorage.getItem("positif_rw")||100}catch(e){}
function setRW(v){RW=+v;try{localStorage.setItem("positif_rw",v)}catch(e){}}
function receipt(s){RCS=s;$("rw").value=RW;
 $('rc').innerHTML=`<img class="rlogo" src="${LOGO}" alt="Positif Clothing" style="display:block;width:70%;margin:0 auto 6px"><p style="text-align:center;margin:0" class="muted">${fmt(s.date)}<br>${s.id}</p><hr>`+
 s.items.map(i=>`<div>${esc(i.name)}</div><div class="row"><span>${nf(i.qty)} x ${rp(i.price)}</span><span>${rp(i.qty*i.price)}</span></div>`).join('')+
 `<hr><div class="row"><span>Subtotal</span><span>${rp(s.sub)}</span></div>${s.disc?`<div class="row"><span>Diskon</span><span>-${rp(s.disc)}</span></div>`:''}<div class="row"><b>Total</b><b>${rp(s.total)}</b></div><div class="row"><span>${s.pay}</span><span>${rp(s.paid)}</span></div>${s.paid>s.total?`<div class="row"><span>Kembali</span><span>${rp(s.paid-s.total)}</span></div>`:''}<hr><p style="text-align:center;margin:0">Terima kasih!</p>`;
 $('modal').classList.add('on');
}
function closeM(){$('modal').classList.remove('on')}
/* ---------- PRODUK & VARIAN ---------- */
 const addForm=()=>`<div>
 <div class="form"><input id="n" placeholder="Nama (cth: Kaos Polos)"><input id="c" placeholder="Kategori" list="cl"><datalist id="cl">${cats().slice(1).map(c=>`<option value="${esc(c)}">`).join('')}</datalist><input id="pr" type="text" inputmode="numeric" data-n placeholder="Harga dasar"><input id="co" placeholder="Warna, pisahkan koma (opsional)"><input id="sz" placeholder="Ukuran, cth: S,M,L,XL (opsional)"><button class="btn" onclick="addP()">Buat produk dan varian</button></div>
 <p class="muted" style="margin:0 0 8px">Setiap kombinasi warna dan ukuran menjadi satu varian dengan foto, barcode, harga, dan stok sendiri. Barcode varian baru otomatis sama dengan ID varian.</p></div>`;
 const pEd=p=>`<div><div class="form"><input value="${esc(p.name)}" onchange="updP(${p.id},'name',this.value)" aria-label="Nama produk"><input value="${esc(p.cat)}" onchange="updP(${p.id},'cat',this.value)" aria-label="Kategori"><input type="text" inputmode="numeric" data-n value="${p.price}" onchange="updP(${p.id},'price',+this.value)" aria-label="Harga dasar"><button class="btn sec" onclick="addVar(${p.id})">+ Varian</button><button class="btn sec" onclick="printBC(${p.id})">Cetak semua label</button></div>
 <div class="scroll"><table><tr><th>Foto</th><th>Warna</th><th>Ukuran</th><th>Barcode</th><th>Harga (kosong = dasar)</th><th>Stok</th><th></th></tr>
 ${p.variants.map(v=>`<tr><td><label class="thumb" title="Klik untuk mengganti foto">${v.img?`<img src="${v.img}" alt="">`:'+ Foto'}<input type="file" accept="image/*" hidden onchange="setImg(${v.id},this)"></label>${v.img?`<button class="lnk" onclick="delImg(${v.id})">Hapus foto</button>`:''}</td><td><input value="${esc(v.color)}" onchange="updV(${v.id},'color',this.value)"></td><td><input value="${esc(v.size)}" onchange="updV(${v.id},'size',this.value)"></td><td><input value="${esc(v.barcode||'')}" placeholder="${v.id}" onchange="setBC(${v.id},this.value)"></td><td><input type="text" inputmode="numeric" data-n value="${v.price||''}" placeholder="${nf(p.price)}" onchange="updV(${v.id},'price',+this.value)"></td><td><input type="text" inputmode="numeric" data-n value="${v.stock}" onchange="updV(${v.id},'stock',+this.value)"></td><td style="white-space:nowrap"><button class="btn sec" style="padding:4px 8px;margin-right:4px" onclick="printBC(${p.id},${v.id})">Cetak label</button><button class="x" style="width:34px;padding:0" title="Hapus varian" onclick="delV(${v.id})" aria-label="Hapus varian"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14M10 11v6M14 11v6"/></svg></button></td></tr>`).join('')}</table></div></div>`;
let ed=null,addOpen=false,pfq='',pfc='Semua';
function vProduk(){
 $('view').innerHTML=`<div class="bar fn"><input id="pfq" placeholder="Cari produk atau varian..." value="${esc(pfq)}" oninput="pfq=this.value;pgrid()" autocomplete="off"><label class="si${pfc!=='Semua'?' act':''}" title="Filter kategori">${IC('filter')}<select aria-label="Filter kategori" onchange="pfc=this.value;this.parentNode.classList.toggle('act',pfc!=='Semua');pgrid()">${cats().map(c=>`<option ${c===pfc?'selected':''}>${esc(c)}</option>`).join('')}</select></label><button class="btn" title="Tambah produk" aria-label="Tambah produk" onclick="addOpen=true;vProduk()">+<span class="hm"> Tambah produk</span></button></div><div id="pgrid" class="grid fs"></div>`;
 pgrid();edShow()}
function pgrid(){const ql=pfq.toLowerCase(),l=S.products.filter(p=>(pfc==='Semua'||p.cat===pfc)&&(!ql||p.name.toLowerCase().includes(ql)||p.variants.some(v=>vl(v).toLowerCase().includes(ql)||bcv(v).includes(pfq))));
 $('pgrid').innerHTML=l.length?l.map(p=>{const im=(p.variants.find(v=>v.img)||{}).img,iv=(p.variants.find(v=>v.img)||{}).id,st=p.variants.reduce((a,v)=>a+v.stock,0),n=p.variants.length,pr=p.variants.map(v=>vp(p,v)),lo=pr.length?Math.min(...pr):p.price;
  return `<button class="p" onclick="edP(${p.id})">${im?`<img src="${im}" alt="">`+zb(p.id,iv):''}<b>${esc(p.name)}</b><small>${n>1?n+' varian, ':''}${st>=9999?'jasa':'stok '+st}</small><span class="num">${pr.length&&Math.max(...pr)!==lo?'mulai ':''}${rp(lo)}</span></button>`}).join(''):'<p class="muted">Produk tidak ditemukan.</p>'}
function edP(id){DR={snap:JSON.stringify(S.products.find(p=>p.id===id)),log:(S.log||[]).slice()};ed=id;edShow()}
async function edClose(){if(DR){const i=S.products.findIndex(x=>x.id===ed);if(i>=0&&JSON.stringify(S.products[i])!==DR.snap){if(!(await askC('Buang perubahan yang belum disimpan?','Buang')))return;S.products[i]=JSON.parse(DR.snap);S.log=DR.log}}DR=null;ed=null;addOpen=false;vProduk()}
function edSave(){DR=null;save();ed=null;addOpen=false;vProduk()}
function edShow(){const m=$('ed');if(!m)return;if(addOpen){$('edc').innerHTML='<div class="row fn" style="margin-top:0"><h2 style="margin:0;font-size:24px">Tambah produk</h2><button class="btn sec" onclick="addOpen=false;vProduk()">Tutup</button></div><div class="fs">'+addForm()+'</div>';m.classList.add('on');return}const p=S.products.find(x=>x.id===ed);if(!p){ed=null;m.classList.remove('on');return}
 const h=pEd(p),i=h.indexOf('<div class="scroll">'),top=h.slice(5,i),rest=h.slice(i,h.lastIndexOf('</div>'));
 $('edc').innerHTML='<div class="fn" style="margin:0 0 8px"><h2 style="margin:0;font-size:24px">Edit produk</h2></div><div class="fn">'+top+'</div><div class="fs" style="margin-top:8px">'+rest+'</div><div class="fn ed-ft"><button class="btn sec" onclick="delP('+p.id+')">Hapus produk</button><span style="display:flex;gap:8px"><button class="btn sec" onclick="edClose()">Batal</button><button class="btn" id="edsv" onclick="edSave()">Simpan</button></span></div>';
 const sv=$('edsv');if(sv)sv.disabled=!DR||JSON.stringify(p)===DR.snap;
 m.classList.add('on')}
function addP(){const n=$('n').value.trim(),pr=+$('pr').value;if(!n||!pr){alert('Isi nama dan harga dasar produk.');return}
 const L=s=>s.split(',').map(x=>x.trim()).filter(Boolean),co=L($('co').value),sz=L($('sz').value);
 S.products.unshift({id:nid(),name:n,cat:$('c').value.trim()||'Umum',price:pr,variants:(co.length?co:['']).flatMap(c=>(sz.length?sz:['']).map(s=>{const id=nid();return{id,color:c,size:s,barcode:String(id),img:null,stock:0,price:0}}))});save();addOpen=false;render()}
function updP(id,k,v){S.products.find(p=>p.id===id)[k]=v;save()}
function addVar(pid){const nv=nid();S.products.find(p=>p.id===pid).variants.push({id:nv,color:'',size:'',barcode:String(nv),img:null,stock:0,price:0});save();render()}
async function delP(id){if(await askC('Hapus produk beserta semua variannya?','Hapus produk')){const pp=S.products.find(p=>p.id===id);pp.variants.forEach(v=>logS({p:pp,v},'Hapus',v.stock,0,'Produk dihapus'));DR=null;S.products=S.products.filter(p=>p.id!==id);save();render()}}
async function delV(id){const p=findV(id).p;if(p.variants.length<2){alert('Produk harus punya minimal satu varian. Hapus produknya jika tidak dipakai.');return}
 if(await askC('Hapus varian ini?')){const x=findV(id);logS(x,'Hapus',x.v.stock,0,'Varian dihapus');p.variants=p.variants.filter(v=>v.id!==id);save();render()}}
function updV(id,k,val){const x=findV(id);if(k==='stock'){const b=x.v.stock;x.v.stock=val;if(b!==val)logS(x,'Ubah',b,val,'Diubah di menu Produk')}else x.v[k]=val;save()}
function setBC(id,val){val=val.trim();if(val&&allV().some(x=>x.v.id!==id&&x.v.barcode===val)){alert('Barcode sudah dipakai varian lain.');render();return}findV(id).v.barcode=val;save()}
function setImg(id,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let m=640,u='';for(let t=0;t<8;t++){const s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);for(const q of[.8,.7,.6,.5]){u=c.toDataURL('image/jpeg',q);if(u.length<=45000)break}if(u.length<=45000)break;m=Math.round(m*.85)}findV(id).v.img=u;save();render()};im.src=r.result};r.readAsDataURL(f)}
/* ---------- STOK PERSEDIAAN ---------- */
let sf='all',sq='',sv='now',lt='all';
const srow=v=>{const s=stt(v);return s==='Habis'?'st-bad':s==='Menipis'?'st-mid':''};
function setLow(){const n=prompt('Batas stok menipis (unit)',S.low);if(n===null)return;S.low=Math.max(1,parseInt(n)||10);save();vStok()}
let sc='Semua',ssel=0,SCN=[];
const pcat=p=>String(p.cat||'').trim()||'Lainnya';
const CI=n=>/stiker|sticker/i.test(n)?'sticker':/jersey|kaos|baju|kemeja|jaket|polo|hoodie|seragam|celana/i.test(n)?'shirt':'box';
const cvl=v=>{const s=stt(v);return s==='Habis'?'bad':s==='Menipis'?'mid2':''};
function vStok(){

function zAdd(id){addV(id);const c=cart.find(c=>c.id===id);$('zadd').textContent='Tambah lagi · di keranjang '+(c?c.qty:0)}
function zNav(d){ZI=(ZI+d+ZL.length)%ZL.length;zShow()}
function zClose(){$('zm').classList.remove('on')}
document.addEventListener('keydown',e=>{if(!$('zm').classList.contains('on'))return;if(e.key==='Escape'){zClose();e.stopImmediatePropagation();e.preventDefault()}else if(e.key==='ArrowLeft')zNav(-1);else if(e.key==='ArrowRight')zNav(1)},true);
function setCS(v){CS=v;document.documentElement.dataset.cs=v;try{localStorage.setItem('positif_cs',v)}catch(e){}}
function csCtl(){if($('cs'))return;const h=`<label class="si" title="Ukuran thumbnail">${IC('thumb')}<select id="cs" onchange="setCS(this.value)" aria-label="Ukuran thumbnail"><option value="l">Large thumbnail</option><option value="m">Medium thumbnail</option><option value="s">Small thumbnail</option></select></label>`;let a=$('cat')||($('pfq')&&$('pfq').nextElementSibling);if(a){a.insertAdjacentHTML('afterend',h);$('cs').value=CS}}
const _r=render;render=function(){_r();csCtl()};
function vRiwayat(){
 const dt=d=>new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}),tm=d=>new Date(d).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
 const its=s=>{const a=s.items.map(i=>esc(i.name)+' x'+i.qty),n=a.length,pc=s.items.reduce((x,i)=>x+i.qty,0);return `<b>${n} item · ${nf(pc)} pcs</b><br>${a.slice(0,2).join(', ')}`+(n>2?`<span hidden>, ${a.slice(2).join(', ')}</span> <button class="lnk" style="display:inline" onclick="const p=this.previousElementSibling;p.hidden=!p.hidden;this.textContent=p.hidden?'+${n-2} item lainnya':'Ringkas'">+${n-2} item lainnya</button>`:'')};
 $('view').innerHTML=`<div class="card fl"><h2 class="fn" style="margin:0 0 10px">Riwayat penjualan</h2><div class="scroll fs"><table class="rt"><tr><th>No.</th><th>Waktu</th><th>Item</th><th>Bayar</th><th class="r">Total</th><th></th></tr>
 ${S.sales.length?S.sales.map(s=>`<tr><td class="mo">${s.id}</td><td>${dt(s.date)}<br><small>${tm(s.date)}</small></td><td class="it">${its(s)}</td><td><span class="badge">${s.pay}</span></td><td class="r"><b>${rp(s.total)}</b></td><td><button class="btn sec" onclick="receipt(S.sales.find(x=>x.id==='${s.id}'))">Struk</button></td></tr>`).join(''):'<tr><td colspan="6" class="muted">Belum ada transaksi. Selesaikan penjualan pertama di menu Kasir.</td></tr>'}</table></div></div>`;
}
/* ---------- LAPORAN ---------- */
function vLaporan(){
 const td=S.sales.filter(s=>today(s.date)),sum=a=>a.reduce((x,s)=>x+s.total,0);
 const cnt={};S.sales.forEach(s=>s.items.forEach(i=>cnt[i.name]=(cnt[i.name]||0)+i.qty));
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
 const piutang=S.orders.reduce((a,o)=>a+(o.total-o.dp),0),low=allV().filter(x=>!isJ(x.v)&&x.v.stock<=S.low);
 $('view').innerHTML=`<div class="stats fn">
 <div class="card stat"><span>Omzet hari ini</span><div class="num">${rp(sum(td))}</div></div>
 <div class="card stat"><span>Transaksi hari ini</span><div class="num">${td.length}</div></div>
 <div class="card stat"><span>Total omzet semua</span><div class="num">${rp(sum(S.sales))}</div></div>
 <div class="card stat"><span>Sisa bayar pesanan custom</span><div class="num ${piutang?'bad':''}">${rp(piutang)}</div></div></div>
 <div class="two"><div class="card fl"><h2 class="fn" style="margin:0 0 8px">Produk terlaris</h2><div class="fs"><div class="lh"><span>#</span><span>Produk</span><span>Terjual</span></div>${top.length?top.map((t,i)=>`<div class="lr"><span class="muted">${i+1}</span><div><div>${esc(t[0])}</div><div class="bar2"><i style="width:${Math.round(t[1]/top[0][1]*100)}%"></i></div></div><b>${t[1]} terjual</b></div>`).join(''):'<p class="muted">Belum ada data penjualan.</p>'}</div></div>
 <div class="card fl"><h2 class="fn" style="margin:0 0 8px">Stok menipis atau habis</h2><div class="fs"><div class="lh" style="grid-template-columns:minmax(0,1fr) auto"><span>Produk</span><span>Sisa stok</span></div>${low.length?low.map(x=>`<div class="lr" style="grid-template-columns:minmax(0,1fr) auto"><span>${esc(cn(x.p,x.v))}</span><span class="badge ${x.v.stock<1?'bad':'mid'}">${nf(x.v.stock)}</span></div>`).join(''):'<p class="muted">Semua stok aman.</p>'}</div></div></div>
 `;
}
boot();
</script></body></html>
