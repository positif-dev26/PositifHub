:root[data-theme="dark"]{--bg:#0f0f0f;--card:#1b1b1b;--text:#ededed;--muted:#9a9a9a;--line:#333;--acc:#bdbdbd;--acc-t:#111;--ok:#6fcf97;--bad:#ff8a80}

body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Barlow,system-ui,sans-serif}

.logo{height:34px;display:block}.badge.ok,.badge.mid,.badge.bad{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-weight:600;font-size:12px;line-height:1.3;white-space:nowrap;border:1px solid}

tr.st-bad>td{background:rgba(179,48,47,.12)}tr.st-bad .num{color:#c0504f}

:root[data-theme="dark"] .badge.ok{color:#2fc24f;border-color:rgba(47,194,79,.4)}:root[data-theme="dark"] .badge.mid{color:#e8a734;border-color:#c98a2e}:root[data-theme="dark"] tr.st-mid>td{background:rgba(217,150,43,.16)}:root[data-theme="dark"] tr.st-bad>td{background:rgba(179,48,47,.22)}:root[data-theme="dark"] tr.st-mid .num{color:#e8a734}:root[data-theme="dark"] tr.st-bad .num{color:#f08a8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo,:root:not([data-theme="light"]) .rlogo{filter:invert(1)}}
:root[data-theme="dark"] .logo,:root[data-theme="dark"] .rlogo{filter:invert(1)}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav button{border:0;background:none;color:var(--muted);font:600 15px Barlow,sans-serif;padding:8px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--acc);color:var(--acc-t);box-shadow:inset 0 -3px 0 var(--text)}
/* Tab Positif Hub (berframe + dropdown) */
.hub{display:inline-flex;align-items:stretch;flex:none;margin-left:4px;border:1px solid var(--text);border-radius:8px}
.hub button{border-radius:6px}
.hub .caret{padding:8px 10px 8px 4px;font-size:12px}
.hub button:hover,nav .stk:hover{color:var(--text)}
.hubmenu{position:fixed;z-index:20;min-width:200px;background:var(--card);border:1px solid var(--text);border-radius:8px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none}
.hubmenu.on{display:block}
.hubmenu a{display:block;padding:10px 14px;border-radius:6px;color:var(--text);text-decoration:none;font:600 15px Barlow,sans-serif;white-space:nowrap}
.hubmenu a:hover,.hubmenu a:focus-visible{background:var(--acc);color:var(--acc-t);outline:none}
main{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.pos{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
@media(max-width:860px){.pos{grid-template-columns:1fr}}
.bar{display:flex;gap:8px;margin-bottom:12px}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--text);outline-offset:1px}
.bar input{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.p{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;color:var(--text);font:inherit;display:flex;flex-direction:column;gap:4px;min-height:96px}
.p:hover{border-color:var(--text)}.p:disabled{opacity:.45;cursor:not-allowed}
.p b{font-weight:600}.p .num{font-size:22px;margin-top:auto}.p small{color:var(--muted)}
.p img{width:100%;height:96px;object-fit:cover;border-radius:6px;background:var(--bg)}
.thumb{display:flex;width:52px;height:52px;border:1px dashed var(--muted);border-radius:6px;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:12px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:8px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:6px}
.qty button,.x{width:28px;height:28px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:6px;cursor:pointer;font-size:16px}
.btn{border:1px solid var(--text);background:var(--acc);color:var(--acc-t);font:600 15px Barlow,sans-serif;padding:10px 16px;border-radius:6px;cursor:pointer}
.btn.big{width:100%;font-size:17px;padding:13px}.btn.sec{background:var(--bg);color:var(--text);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}.up{display:flex;align-items:center;justify-content:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0}
.total{font-size:40px;font-weight:700;line-height:1}
.muted{color:var(--muted)}.ok{color:var(--ok)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:13px}.scroll{overflow-x:auto}
td input{width:100%;min-width:70px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat .num{font-size:36px;font-weight:700}.stat span{color:var(--muted)}
.badge{padding:2px 8px;border-radius:99px;border:1px solid var(--line);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}.modal .card{width:340px;max-height:90vh;overflow:auto}.modal .card.wide{width:min(720px,100%)}
.rc{font-family:ui-monospace,Menlo,monospace;font-size:13px}.rc .row{margin:2px 0}.rc hr{border:0;border-top:1px dashed var(--muted)}
.lnk{display:block;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:12px;padding:2px 0}
#plabels{display:none}
.lb{box-sizing:border-box;padding:1mm 1.5mm;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#fff;color:#000;font-family:Arial,sans-serif;text-align:center;break-inside:avoid}
.lb .ln{font-size:8pt;font-weight:700;line-height:1.1;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lb .lv{font-size:7.5pt;line-height:1.1}.lb .lp{font-size:8pt;font-weight:700}
.lb svg{width:100%;height:auto;max-height:13mm}
@media print{body:not(.print-labels) *{visibility:hidden}body:not(.print-labels) #modal,body:not(.print-labels) #modal *{visibility:visible}body:not(.print-labels) #modal{position:absolute;background:none;display:block}.noprint{display:none!important}#modal .card{border:0;width:100%}#pk,#pm,#hm,#accm{display:none!important}.logo,.rlogo{filter:none!important}body.print-labels>*:not(#plabels){display:none!important}body.print-labels #plabels{display:flex;flex-wrap:wrap}}
nav{margin-left:clamp(20px,4vw,64px)}

.ptabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.ptabs button{white-space:nowrap;border:1px solid var(--line,#d4d4d4);background:var(--card,#fff);color:inherit;padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit}.ptabs button.on{background:var(--acc,#cfcfcf);color:var(--acc-t,#111);font-weight:600}.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}@media(max-width:820px){.cols{grid-template-columns:1fr}}

.pos{grid-template-columns:minmax(0,1fr) minmax(360px,28vw)}@media(max-width:860px){.pos{grid-template-columns:1fr}}
.dd{display:inline-flex;flex:none}.hubmenu a.cur{background:var(--acc);color:var(--acc-t)}

.fl{flex:1;min-height:0;display:flex;flex-direction:column}

.accb{border:1px solid var(--line);background:var(--bg);color:var(--text);font:600 14px Barlow,sans-serif;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}.accb:hover{border-color:var(--text)}

#accm .mdanger{color:var(--bad)}#accm .mdanger:hover{color:#b3261e}
@media(min-width:900px){#sbody.scroll,#rjl .scroll{overflow:visible}#sbody th,#rjl th{position:sticky;top:calc(var(--hh,52px) + var(--th,0px) + var(--bh,0px));background:var(--card);z-index:2}}

.stp{display:flex;align-items:center;gap:10px;margin:0 0 18px;overflow-x:auto;padding-bottom:4px}.stp i{flex:1;min-width:16px;height:1px;background:var(--line)}
.sti{display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--muted)}.sti b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-weight:500}
.sti.dn b{background:var(--acc);color:var(--acc-t);border-color:var(--acc)}.sti.cur{color:var(--text)}.sti.cur b{background:var(--acc);color:var(--acc-t);border-color:var(--text)}
.pf{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}@media(max-width:900px){.pf{grid-template-columns:1fr}}
.rh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.rh h2{margin:0}
.rack{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.rr{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--line);min-height:76px}.rr:last-child{border:0}
.rl{padding:12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:2px}.rl small{color:var(--muted)}
.rp{display:flex;flex-wrap:wrap;gap:8px;padding:10px;align-items:center}
.pill{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);color:inherit;border-radius:999px;padding:6px 16px 6px 6px;cursor:pointer;font:inherit;text-align:left}
.pill small{display:block;color:var(--muted)}.pill.on{border:2px solid var(--text);padding:5px 15px 5px 5px}
.cr{width:38px;height:38px;border-radius:50%;background:var(--acc);color:var(--acc-t);display:grid;place-items:center;font-weight:600;flex:none}
.pdt .pn{font-size:18px;font-weight:600;margin:6px 0 2px}.dr2{display:flex;justify-content:space-between;gap:8px;padding:5px 0}.dr2>span:first-child{color:var(--muted)}
.pdt label{display:block;margin:10px 0 4px}.pdt input,.pdt select{width:100%;margin-bottom:6px}.f2{display:flex;gap:6px;align-items:center}.f2 input{min-width:0}.btn.wide{width:100%;margin-top:6px;padding:12px}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:rgba(24,24,24,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;padding:10px 16px;border-radius:12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.3);animation:tin .2s}
.toast span{color:#6fcf97;font-weight:700}.toast.bad span{color:#ff8a80}.toast.out{opacity:0;transition:opacity .4s}@keyframes tin{from{opacity:0;transform:translateY(8px)}}
