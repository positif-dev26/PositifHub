 const tgt=kPJ(cf.tgt)||{},aman=+cf.aman||14,lim=Object.assign({},KLIM,kPJ(cf.lim)||{}),V={},sold={},d30=Date.now()-30*864e5;

  return Object.values(m).map(o=>{const x=V[o.vid],st=x?x.v.stock:0,own=tgt[o.vid],tg=own!=null&&own!==''?Math.max(0,+own):Math.max(12,Math.round((sold[o.vid]||0)/30*aman/12)*12),lv=st<=0?0:st<tg?1:2;return{...o,st,tg,lv,age:kDays(o.date),src}})

  svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" class="ksvg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Kantor AI POSITIF Clothing Company">'+kRoom(W,[{y:0,wall:AY+58,end:H}])
  +kSign(W/2,22,Math.min(520,W*0.5),17)+kBoard(34,84,bw,Math.min(170,AY-84-26),P)+kClock(cx,94,cw,15);
  const ws=34+bw+40,we=cx-40,n=Math.max(0,Math.floor((we-ws+24)/114));for(let i=0;i<n;i++){const tot=n*114-24,x0=ws+((we-ws)-tot)/2;svg+=kWin(x0+i*114,96)}
  KA.forEach((a,i)=>svg+=kAgent(a,slot*i+slot/2-48,AY,P,badge[a.id]));svg+='</svg>'}
 else{const W=380,AY1=196,F2=AY1+154,AY2=F2+50,H=AY2+150;
  svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" class="ksvg" role="img" aria-label="Kantor AI POSITIF Clothing Company">'+kRoom(W,[{y:0,wall:AY1+58,end:F2},{y:F2,wall:AY2+58,end:H}])
  +kSign(W/2,20,340,13)+kBoard(16,82,212,94,P)+kClock(240,92,124,11);
  KA.forEach((a,i)=>{const f=Math.floor(i/3),c=i%3;svg+=kAgent(a,10+c*124,f?AY2:AY1,P,badge[a.id])});svg+='</svg>'}
 v.innerHTML='<div class="kao'+(mob?'':' kfull')+'" id="kaOff"'+(mob?'':' style="min-height:'+kFullH+'px"')+'><div class="kar"'+(hgt?' style="height:'+hgt+'"':'')+'>'+svg+'</div></div>';
 v.querySelectorAll('.kag').forEach(g=>{const o=()=>kOpen(g.dataset.k);g.addEventListener('click',o);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();o()}})});
 startClock();kFit()}
/* kecilkan tulisan yang melebihi tempatnya (aman walau huruf piksel belum termuat) */
function kFit(){document.querySelectorAll('#kaOff [data-fw]').forEach(t=>{const fw=+t.dataset.fw;let fs=+(t.dataset.fs0||t.getAttribute('font-size'));t.dataset.fs0=fs;t.setAttribute('font-size',fs);try{let n=0;while(t.getComputedTextLength()>fw&&fs>5&&n++<40){fs-=.5;t.setAttribute('font-size',fs)}}catch(e){}})}
let kRz=null;addEventListener('resize',()=>{clearTimeout(kRz);kRz=setTimeout(()=>{if(typeof tab!=='undefined'&&tab==='beranda'&&$('kaOff'))kDraw()},200)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(typeof tab!=='undefined'&&tab==='beranda'&&$('kaOff'))kDraw()});

/* ---------- popup ---------- */
let kCur='',kTab='h';
function kOpen(id){const a=KA.find(x=>x.id===id);if(!a)return;if(a.kind!=='lowongan'&&!a.ok())return toast('Akun Anda tidak punya akses ke meja '+a.n+'.',1);kCur=id;kTab='h';if(id==='lap')kLoadLap(true);kPop()}
function kPop(){const a=KA.find(x=>x.id===kCur);if(!a)return;let m=$('kam');if(!m){m=document.createElement('div');m.id='kam';m.className='modal';m.onclick=e=>{if(e.target===m)kClose()};m.innerHTML='<div class="card wide kpc" id="kamc"></div>';document.body.appendChild(m)}
 const st=a.kind==='lowongan'?'<span class="ktg" style="--c:#999">lowongan</span>':'<span class="ktg" style="--c:'+a.c+'">'+a.kind+'</span>';
 $('kamc').innerHTML='<div class="kph"><div><h2>'+esc(a.n)+' '+st+'</h2><p>'+esc(a.role)+'</p></div><button class="ib" onclick="kClose()" aria-label="Tutup">'+IC('x')+'</button></div>'
 +'<div class="ktb"><button class="'+(kTab==='h'?'on':'')+'" onclick="kTab=\'h\';kPop()">Hasil kerja</button><button class="'+(kTab==='r'?'on':'')+'" onclick="kTab=\'r\';kPop()">Rincian kerja</button></div><div class="kbd">'+(kTab==='h'?kHasil(a):kRinci(a))+'</div>';
 m.classList.add('on')}
function kClose(){const m=$('kam');if(m)m.classList.remove('on')}
const kStat=L=>'<div class="kst">'+L.map(([n,l,c])=>'<div><b'+(c?' style="color:'+c+'"':'')+'>'+n+'</b><small>'+l+'</small></div>').join('')+'</div>';
function kHasil(a){
 if(a.kind==='lowongan')return '<p class="muted">Belum ada karyawan di meja ini, jadi belum ada hasil kerja.</p>';
 if(a.id==='prod'){const P=kProd(),SN=['HABIS','MENIPIS','AMAN'];const row=r=>'<div class="kln"><span><b class="kb l'+r.lv+'">'+SN[r.lv]+'</b>'+esc(r.name)+'</span><span>'+kDz(r.qty)+' · '+r.age+' hr</span></div>';
  return kStat([[P.habis,'habis di rak','#ff8a8a'],[P.tipis,'menipis','#f0b860'],[P.tert,'order tertahan','#d4ff3f']])
  +'<h3>Rak bahan → tim Cutting</h3>'+(P.C.length?P.C.slice(0,4).map(row).join('')+(P.C.length>4?'<p class="muted ksm">+'+(P.C.length-4)+' produk lagi di lembar kerja</p>':''):'<p class="muted ksm">Rak bahan kosong.</p>')
  +'<h3>Rak cutting → tim Jahit</h3>'+(P.H.length?P.H.slice(0,4).map(row).join('')+(P.H.length>4?'<p class="muted ksm">+'+(P.H.length-4)+' produk lagi di lembar kerja</p>':''):'<p class="muted ksm">Rak cutting kosong.</p>')
  +'<div class="kbt"><a class="btn" href="produksi.html#lk=bahan">'+IC('scissors')+' Lembar Cutting</a><a class="btn" href="produksi.html#lk=cutting">'+IC('shirt')+' Lembar Jahit</a><a class="btn sec" href="produksi.html">Buka Produksi</a></div>'}
 if(a.id==='lap'){if(kLapErr)return '<p class="muted">'+esc(kLapErr)+'</p>';if(!kLap)return '<p class="muted">Memuat laporan…</p>';
  if(!kLap.length)return '<p class="muted">Belum ada laporan pagi yang tersimpan. Laporan berikutnya otomatis masuk ke sini setelah tugas pagi berjalan (setiap hari 08.07).</p>';
  const L=kLap[0],d=L.data||{},tg=x=>new Date(x).toLocaleString('id-ID',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  return (d&&('baru' in d||'terlambat' in d)?kStat([[+d.baru||0,'order custom baru'],[+d.terlambat||0,'terlambat','#ff8a8a'],[+d.hariIni||0,'deadline hari ini','#f0b860']]):'')
  +'<h3>Laporan terakhir · '+esc(tg(L.at))+'</h3><pre class="kpre">'+esc(L.ringkasan)+'</pre>'
  +(kLap.length>1?'<h3>Riwayat</h3>'+kLap.slice(1,8).map(r=>'<div class="kln"><span>'+esc(r.judul||'Laporan pagi')+'</span><span>'+esc(tg(r.at))+'</span></div>').join(''):'')
  +'<div class="kbt"><a class="btn sec" href="https://positif-dev26.github.io/PositifHub/rekap-order-custom.html">Buka Rekap Order</a></div>'}
 return ''}
function kRinci(a){return '<h3>Langkah kerja</h3><ol class="kol">'+a.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>'
 +(a.sched?'<div class="kln"><span>Jadwal</span><span>'+esc(a.sched)+'</span></div>':'')+(a.src?'<div class="kln"><span>Sumber data</span><span>'+esc(a.src)+'</span></div>':'')
 +(a.id==='prod'?'<div class="kln"><span>Terakhir bekerja</span><span>'+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+' (saat Beranda dibuka)</span></div>':'')
 +(a.id==='lap'&&kLap&&kLap[0]?'<div class="kln"><span>Terakhir bekerja</span><span>'+new Date(kLap[0].at).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</span></div>':'')
 +(a.kind==='lowongan'?'<p class="muted ksm" style="margin-top:10px">Meja ini masih kosong. Rincian di atas adalah rencana tugasnya.</p>':'')}
function vBeranda(){kDraw();kLoadLap(false)}
let clkT=null,kMq=null;
function startClock(){clearInterval(clkT);const tick=()=>{const e=$('kclk');if(!e){clearInterval(clkT);return}const n=new Date(),p=x=>String(x).padStart(2,'0');
 e.textContent=p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());const d=$('kdt');if(d&&!d.textContent){d.textContent=n.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});kFit()}};tick();clkT=setInterval(tick,1000)}
try{matchMedia('(max-width:760px)').addEventListener('change',()=>{if(tab==='beranda'&&$('kaOff'))kDraw()})}catch(e){}
document.addEventListener('keydown',e=>{if(e.key==='Escape')kClose()});
boot();
</script></body></html>
