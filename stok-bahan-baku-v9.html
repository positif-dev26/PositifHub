<style>
:root{--bg:#060606;--cd:#0f0f0f;--in:#0a0a0a;--bd:rgba(255,255,255,.09);--tx:#f4f4f2;--mu:#8f8f8a;--pill:#d4ff3f;--ac:#d4ff3f;--red:#ff6b6b;--yel:#ffd24a;--grn:#4ddf9a;--blu:#6fb8ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.35 "Barlow Semi Condensed",system-ui,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:14px 20px 2px;flex-wrap:wrap}#nv{display:flex;gap:8px;flex-wrap:wrap}
.sp{flex:1}
button,input,select{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:8px 14px}
button{cursor:pointer;font-weight:600}button:hover{border-color:#555}
.nav{background:var(--cd);border-color:var(--bd);color:var(--tx);border-radius:999px;padding:8px 16px;font-weight:500}
.on{background:var(--pill)!important;color:#111!important;border-color:var(--pill)!important}
.pri{background:#fff;color:#111;border-color:#fff}
.ic{padding:8px 10px;display:inline-flex}
main{padding:16px 20px 40px;width:100%}
.tot{color:var(--mu);font-size:14px;margin-bottom:8px}.tot b{color:var(--tx)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.sc{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--cd),#171717);border:1px solid var(--bd);border-radius:18px;padding:20px 24px}
.sc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.sc small{color:var(--mu);font-size:16px}.sc b{display:block;font-size:76px;line-height:1;margin-top:8px;color:var(--c);font-weight:700;letter-spacing:-1px}
.al{border-radius:14px;padding:12px 18px;margin-bottom:10px;border:1px solid;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.al.r{border-color:#7a3b37;background:#2a1716;color:var(--red)}.al.y{border-color:#7a6130;background:#2a2213;color:var(--yel)}
.al i{font-style:normal;background:#0004;border-radius:999px;padding:3px 12px;font-size:14px;cursor:pointer}.al i:hover{background:#0008;text-decoration:underline}
.panel{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1;min-width:200px}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mu);font-size:14px;padding:8px 10px;border-bottom:1px solid var(--bd)}
td{padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr.sub td{background:#161616}tr.sub td:first-child{padding-left:34px}
.big{font-size:28px;font-weight:700}
.bd{display:inline-block;border:1px solid;border-radius:999px;padding:1px 10px;font-size:14px;margin-left:6px;vertical-align:middle}
.habis{color:var(--red)}.tipis{color:var(--yel)}.aman{color:var(--grn)}.info{color:var(--blu)}
.q{display:flex;gap:8px;align-items:center}.q input{width:90px}
.mu{color:var(--mu);font-size:14px}.nm{cursor:pointer;font-size:18px;font-weight:700}
.ord{border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--in)}
.stp{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.stp span{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--bd);color:var(--mu)}
.stp span.d{color:var(--grn);border-color:#2f6b45}.stp span.c{background:var(--pill);color:#111;border-color:var(--pill)}
h4{margin:18px 0 8px;font-size:18px}
.fl{animation:fl 1.8s}@keyframes fl{0%,70%{box-shadow:0 0 0 3px var(--yel)}100%{box-shadow:none}}
.hb{height:14px;border-radius:7px;background:var(--blu);min-width:3px}
.hr{display:grid;grid-template-columns:minmax(150px,260px) 1fr 110px;gap:10px;align-items:center;margin:6px 0}
dialog{background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:18px;width:min(440px,92vw);padding:22px;max-height:92vh}
dialog::backdrop{background:#000a}
dialog h3{margin:0 0 8px;font-size:22px}dialog label{display:block;margin:10px 0 3px;color:var(--mu);font-size:14px}
dialog input,dialog select{width:100%}dialog input[type=checkbox]{width:auto}
.rw{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
tr.sel td{background:#26262a}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 20px;border-radius:999px;display:none;z-index:99;font-weight:700}
.pos{display:grid;grid-template-columns:1fr 390px;gap:20px;align-items:start}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pc{background:var(--in);border:1px solid var(--bd);border-radius:14px;padding:16px;cursor:pointer;min-height:120px;display:flex;flex-direction:column;gap:4px}
.pc:hover{border-color:#777}.pc.off{opacity:.4;cursor:not-allowed}.pc>b{font-size:18px}.pc .t{margin-top:auto;font-size:15px}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:12px}
.cl{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.cl input{width:70px;text-align:center;padding:6px}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.tl button{padding:28px;font-size:22px;text-align:left;border-radius:16px;background:var(--in)}
.seg{display:inline-flex;gap:4px;margin-left:6px}
@media(max-width:1000px){.pos{grid-template-columns:1fr}.tl{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.sum{grid-template-columns:repeat(2,1fr)}.sc b{font-size:56px}}
.pc.st{border-left:5px solid var(--c);cursor:pointer}.pc.st:hover{border-color:#777;border-left-color:var(--c)}
.pc.st .no{font-size:46px;font-weight:700;line-height:1;color:var(--c)}
.pc.st .t{margin-top:auto;padding-top:6px}
.pc .bd{margin-left:0;margin-right:6px}
.chs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ch{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bd);border-radius:999px;padding:1px 9px 1px 6px;font-size:13px;color:var(--mu)}.ch b{color:var(--tx)}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid #777;vertical-align:-2px;margin-right:6px;flex:none}
.ch .sw{width:11px;height:11px;margin:0}
.pg{display:flex;gap:3px;margin:6px 0}.pg i{flex:1;height:6px;border-radius:3px;background:#333}.pg i.f{background:var(--c)}
.vr{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--bd)}
.kr{display:grid;grid-template-columns:1fr 100px 100px 42px;gap:6px;margin-bottom:6px}.kr input{width:100%}
dialog label.rd{display:inline-flex;align-items:center;gap:8px;margin:0 8px 0 0;padding:8px 14px;border:1px solid var(--bd);border-radius:999px;color:var(--tx);font-size:16px;cursor:pointer}
dialog label.rd input{width:auto}
dialog label.rd:has(input:checked){background:var(--pill);color:#111;border-color:var(--pill)}
.tw{overflow-x:auto}

/* ===== Tema futuristik (lime neon, kaca gelap) ===== */
body{background:radial-gradient(900px 520px at 88% -8%,rgba(212,255,63,.11),transparent 60%),radial-gradient(760px 520px at -8% 112%,rgba(111,184,255,.08),transparent 60%),#060606;background-attachment:fixed;min-height:100vh}
h3,h4,.sc b,.no,.big,.pc>b{font-family:"Space Grotesk","Barlow Semi Condensed",system-ui,sans-serif}
.app{margin-left:78px}
header{padding:16px 24px 2px;gap:10px}
.seg{margin:0;padding:4px;background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:999px;gap:2px}
.seg button{border:0;border-radius:999px;background:transparent;padding:7px 16px;color:var(--mu)}
.seg button.on{box-shadow:0 0 22px -4px rgba(212,255,63,.55)}
main{padding:14px 24px 40px}
button,input,select{background:#0b0b0b;border-color:var(--bd);border-radius:12px}
button:hover{border-color:rgba(212,255,63,.45)}
input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(212,255,63,.14)}
.pri{background:var(--ac);color:#0a0a0a;border-color:var(--ac);font-weight:700}
.pri:hover{box-shadow:0 0 26px -6px rgba(212,255,63,.7);border-color:var(--ac)}
.on{box-shadow:none}
.panel{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:26px;padding:20px;backdrop-filter:blur(10px)}
.panel.flat{background:none;border:0;padding:0;backdrop-filter:none}
.sc{border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid var(--bd);padding:22px 26px}
.sc:before{width:auto;height:3px;right:0;bottom:auto;background:linear-gradient(90deg,var(--c),transparent 70%)}
.sc b{font-size:68px;text-shadow:0 0 30px color-mix(in srgb,var(--c) 45%,transparent)}
.sc:nth-child(4){background:var(--ac);border-color:var(--ac)}.sc:nth-child(4):before{display:none}
.sc:nth-child(4) small,.sc:nth-child(4) b{color:#0a0a0a!important;text-shadow:none}
.al{border-radius:18px}
.pc{background:linear-gradient(160deg,#141414,#0b0b0b);border:1px solid var(--bd);border-radius:20px;transition:.18s}
.pc:hover{border-color:rgba(212,255,63,.5);box-shadow:0 0 0 1px rgba(212,255,63,.2),0 14px 40px -14px rgba(212,255,63,.3);transform:translateY(-2px)}
.pc.off:hover{transform:none;box-shadow:none;border-color:var(--bd)}
.pc.st{border-left:1px solid var(--bd);box-shadow:inset 4px 0 0 var(--c),0 0 28px -16px var(--c)}
.pc.st:hover{border-left-color:rgba(212,255,63,.5);box-shadow:inset 4px 0 0 var(--c),0 14px 40px -14px rgba(212,255,63,.3)}
.pc.st .no{font-size:42px}
.bd{background:rgba(255,255,255,.03)}
.dvb{position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.012));border:1px solid var(--bd);border-radius:26px;padding:20px 22px 22px;margin-bottom:18px}
.dvb:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--ac),transparent 65%);opacity:.8}
.dvh{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.dvh h3{margin:0;font-size:23px}
.dvh .bd{margin:0}
.dvg{grid-template-columns:repeat(auto-fill,minmax(205px,1fr))}
dialog{background:#0e0e0e;border-radius:26px;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 90px -20px #000}
dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}
#toast{background:var(--ac)}
/* pengambilan: kotak divisi + barcode */
.pc{position:relative}
.bcb{position:absolute;top:10px;right:10px;width:34px;height:34px;padding:0;display:grid;place-items:center;border-radius:10px;color:var(--mu);background:rgba(255,255,255,.04)}
.bcb:hover{color:#fff}
.bcb svg,.bk svg,.ig svg,.ig2 svg,.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bk{display:inline-flex;align-items:center;gap:8px}
.dvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.dvt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;aspect-ratio:1/1;min-height:170px;padding:18px;border-radius:24px;background:linear-gradient(160deg,#141414,#0b0b0b);transition:.18s}
.dvt:hover{border-color:rgba(212,255,63,.55);transform:translateY(-2px);box-shadow:0 14px 40px -16px rgba(212,255,63,.35)}
.dvt .ig{width:68px;height:68px;display:grid;place-items:center;border-radius:20px;background:rgba(212,255,63,.1);color:var(--ac)}
.dvt .ig svg{width:34px;height:34px}
.dvt b{font:700 19px/1.2 "Space Grotesk","Barlow Semi Condensed",sans-serif;text-align:center}
.dvt .lw{position:absolute;top:12px;right:12px;margin:0}
.ig2{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.07)}
.bcl{display:grid;gap:12px;margin-top:12px;max-height:60vh;overflow:auto}
.bcc{background:#fff;color:#000;border-radius:14px;padding:12px 14px;text-align:center}
.bcn{font-weight:700;font-size:16px;margin-bottom:6px}
.bcs{display:block;width:100%;height:64px}
.bct{font:13px monospace;margin-top:4px;color:#333}
/* rail ikon */
#rail{position:fixed;left:0;top:0;bottom:0;width:78px;z-index:30;display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 0;background:rgba(8,8,8,.82);backdrop-filter:blur(16px);border-right:1px solid var(--bd)}
#rail .ri{position:relative;width:50px;height:50px;padding:0;display:grid;place-items:center;border-radius:17px;background:transparent;border:1px solid transparent;color:#8d8d88}
#rail .ri svg,.acb svg,.ddm svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#rail .ri:hover{color:#fff;background:rgba(255,255,255,.07);border-color:transparent}
#rail .ri.on{background:var(--ac)!important;color:#0a0a0a!important;box-shadow:0 0 30px -4px rgba(212,255,63,.6)}
#rail .bg{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font:700 11px/19px "Space Grotesk",sans-serif;text-align:center;padding:0 5px;box-shadow:0 0 0 3px #080808}
#rail .ri:after{content:attr(data-tip);position:absolute;left:62px;top:50%;transform:translate(-4px,-50%);white-space:nowrap;background:#171717;border:1px solid var(--bd);color:#fff;padding:5px 11px;border-radius:9px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.15s}
#rail .ri:hover:after{opacity:1;transform:translate(0,-50%)}
/* dropdown akun */
.dd{position:relative}
.acb{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 10px 6px 8px;background:rgba(255,255,255,.05)}
.acb svg{width:22px;height:22px}.acb svg:last-child{width:16px;height:16px}
.ddm{display:none;position:absolute;right:0;top:calc(100% + 10px);min-width:232px;background:#111;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:6px;z-index:60;box-shadow:0 24px 70px -12px #000}
.ddm.o{display:block}
.ddm button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:10px 12px;font-weight:500}
.ddm button:hover{background:rgba(255,255,255,.07)}
.ddm svg{width:20px;height:20px;color:var(--mu)}
.ddm hr{border:0;border-top:1px solid var(--bd);margin:6px 4px}
.whoi{padding:8px 12px 6px;color:var(--mu);font-size:13px}.whoi b{color:var(--tx)}

  dItem(pid)}

var C128=["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function bcSvg(t){t=String(t);var codes=[104],sum=104,i,c,x=10,r="";
  for(i=0;i<t.length;i++){c=t.charCodeAt(i)-32;if(c<0||c>95)c=0;codes.push(c);sum+=c*(i+1)}
  codes.push(sum%103,106);
  codes.forEach(function(cd){var p=C128[cd];for(var j=0;j<p.length;j++){var w=+p[j];if(j%2==0)r+='<rect x="'+x+'" y="0" width="'+w+'" height="60"/>';x+=w}});
  return'<svg class="bcs" viewBox="0 0 '+(x+10)+' 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" fill="#000"><rect x="0" y="0" width="'+(x+10)+'" height="60" fill="#fff"/>'+r+'</svg>'}
function dBar(id){var m=gb(id);if(!m)return;var k=kids(id),lv=k.length?k:[m];
  D('<h3>Barcode</h3><div class="mu">'+esc(m.nama)+(k.length?" · "+k.length+" variasi":"")+'</div><div class="bcl">'+lv.map(function(x){return'<div class="bcc"><div class="bcn">'+esc(fn(x))+'</div>'+bcSvg(x.id)+'<div class="bct">'+esc(x.id)+'</div></div>'}).join("")+'</div><div class="rw"><button onclick="X()">Tutup</button><button class="pri" data-i="'+esc(lv.map(function(x){return x.id}).join(","))+'" onclick="printLbl(this.dataset.i)">Cetak label</button></div>',"min(560px,94vw)")}
function printLbl(s){var ids=String(s).split(",").filter(function(i){return gb(i)});if(!ids.length)return;
  var h='<!doctype html><meta charset="utf-8"><title>Label barcode</title><style>body{margin:12px;font-family:Arial,sans-serif}.g{display:flex;flex-wrap:wrap;gap:8px}.l{width:6cm;border:1px solid #000;padding:6px 8px;text-align:center;page-break-inside:avoid}.n{font-size:12px;font-weight:700;line-height:1.2;margin-bottom:3px}.s{font-size:10px;color:#333}svg{width:100%;height:46px;display:block}.c{font-size:10px;font-family:monospace}</style><div class="g">'+ids.map(function(i){var b=gb(i);return'<div class="l"><div class="n">'+esc(fn(b))+'</div>'+bcSvg(b.id)+'<div class="c">'+esc(b.id)+'</div><div class="s">'+esc(dn(b.divisi))+' · '+esc(b.satuan)+'</div></div>'}).join("")+'</div>';
  var w=window.open("","_blank");if(!w)return toast("Izinkan pop-up browser untuk mencetak label");w.document.write(h);w.document.close();w.focus();setTimeout(function(){w.print()},400)}
var scStream=null,scTimer=null;
function dScan(){if(!need())return;pm=null;
  D('<h3>Scan barcode</h3><p class="mu" style="font-size:16px;margin:0 0 8px">Arahkan scanner ke barcode, atau ketik kodenya lalu tekan Enter. Barang langsung masuk keranjang.</p><input id="sci" autocomplete="off" placeholder="Kode barcode" onkeydown="if(event.key==\'Enter\')scanIn()"><div id="scm" style="margin-top:10px;min-height:24px;font-size:17px;font-weight:600"></div>'
  +('BarcodeDetector' in window?'<button style="margin-top:6px" onclick="camOn()">Pakai kamera</button><video id="scv" playsinline muted style="display:none;width:100%;border-radius:14px;margin-top:10px"></video>':"")
  +'<div class="rw"><button class="pri" onclick="X()">Selesai</button></div>');setTimeout(function(){var e=$("sci");if(e)e.focus()},60)}
function scanIn(){var e=$("sci"),m=$("scm");if(!e)return;var v=e.value;e.value="";if(!String(v).trim())return;var b=findCode(v);
  if(!b){m.className="habis";m.textContent="Kode tidak ditemukan: "+v;return}
  var c0=cart[b.id]||0;addC(b.id);
  if((cart[b.id]||0)>c0){m.className="aman";m.textContent="✓ "+fn(b)+" · dibawa "+cart[b.id]+" "+b.satuan}else{m.className="habis";m.textContent=fn(b)+": stok tidak cukup"}
  e.focus()}
async function camOn(){try{var st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});scStream=st;var v=$("scv");v.srcObject=st;v.style.display="block";await v.play();
  var det=new BarcodeDetector({formats:["code_128"]}),last="",lt=0;
  scTimer=setInterval(async function(){try{var r=await det.detect(v);if(r.length){var c=r[0].rawValue,n=Date.now();if(c!=last||n-lt>2000){last=c;lt=n;$("sci").value=c;scanIn()}}}catch(e){}},350)}catch(e){toast("Kamera tidak bisa dibuka")}}
function camOff(){clearInterval(scTimer);if(scStream){scStream.getTracks().forEach(function(t){t.stop()});scStream=null}}
$("dlg").addEventListener("close",camOff);
