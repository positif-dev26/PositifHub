<!doctype html>
<html lang="id" data-theme="dark"><head>
<script src="akses.js" data-app="app_layout"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Layout Stiker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#060606">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Layout Stiker">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#060606;--card:#0f0f0f;--text:#f4f4f2;--muted:#8f8f8a;--line:rgba(255,255,255,.1);--acc:#d4ff3f;--acc-t:#0a0a0a;--ok:#4ddf9a;--bad:#ff6b6b;--mid:#ffd24a;--glow:rgba(212,255,63,.38);box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:radial-gradient(900px 520px at 88% -8%,rgba(212,255,63,.07),transparent 60%),radial-gradient(760px 520px at -8% 112%,rgba(111,184,255,.05),transparent 60%),var(--bg);color:var(--text);font:500 15px Barlow,system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(10,10,10,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);flex:none;padding-top:max(8px,env(safe-area-inset-top));position:relative;z-index:5}
.logo{height:46px;display:block;filter:invert(1);cursor:pointer}
h1{margin:0;font:700 24px "Barlow Condensed",Impact,sans-serif;letter-spacing:.03em;white-space:nowrap}
.sp{flex:1}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;height:40px;padding:0 10px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;cursor:pointer;font:600 14px Barlow,sans-serif;position:relative}
.ib:hover{border-color:rgba(212,255,63,.55)}.ib:disabled{opacity:.35;cursor:default}
.ib.pri{background:var(--acc);color:var(--acc-t);border-color:var(--acc);box-shadow:0 0 24px -6px rgba(212,255,63,.7)}
.ib.sm{min-width:32px;height:32px;padding:0 6px;border-radius:10px}.ib.on{border-color:var(--acc);color:var(--acc);background:rgba(212,255,63,.1)}
.pg{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid rgba(212,255,63,.3);background:rgba(212,255,63,.08);border-radius:999px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .ico{width:17px;height:17px;color:var(--acc)}
#wbtn{position:relative}#wbtn.has{color:var(--mid);border-color:rgba(255,210,74,.5)}#wbtn.bad{color:var(--bad);border-color:rgba(255,107,107,.5)}
#wbtn b{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--mid);color:#000;font-size:11px;display:grid;place-items:center;padding:0 4px}
#wpop{display:none;position:absolute;top:100%;right:14px;margin-top:6px;width:min(340px,92vw);max-height:60vh;overflow:auto;background:#111;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 12px 30px rgba(0,0,0,.6)}#wpop.on{display:block}
#wpop div{padding:5px 2px;font-size:14px;font-weight:600;color:var(--mid)}#wpop div.b{color:var(--bad)}
.wrap{flex:1;min-height:0;display:flex;gap:12px;padding:12px}
.rail{flex:none;align-self:flex-start;display:flex;flex-direction:column;gap:8px;padding:8px 6px;border:1px solid rgba(212,255,63,.22);border-radius:20px;background:rgba(15,15,15,.7)}
.rail .ib{width:46px;height:46px;padding:0;border-radius:14px}.rail .ib.on{background:var(--acc);color:var(--acc-t);box-shadow:0 0 24px -6px rgba(212,255,63,.7)}
.panel{width:340px;flex:none;min-height:0;display:flex;flex-direction:column}
.pn{display:none;flex-direction:column;gap:10px;min-height:0;flex:1}.pn.on{display:flex}
.sb{border:1px solid var(--glow);border-radius:22px;padding:12px;background:linear-gradient(165deg,rgba(212,255,63,.05),rgba(255,255,255,.01) 42%),var(--card);box-shadow:0 0 0 1px rgba(212,255,63,.05),0 0 26px -10px rgba(212,255,63,.5)}
.fi{display:flex;align-items:center;gap:6px;height:36px;padding:0 8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--muted);min-width:0;flex:1}
.fi:focus-within{border-color:var(--acc);color:var(--acc)}
.fi .ico{width:16px;height:16px}
.fi input{flex:1;min-width:0;width:100%;height:100%;padding:0;border:0;background:transparent;color:var(--text);font:600 15px Barlow,sans-serif;outline:none}
.rw{display:flex;align-items:center;gap:8px}.rw+.rw{margin-top:8px}
.gi{width:34px;display:grid;place-items:center;color:var(--acc);flex:none}
.seg{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:14px;background:var(--bg);flex:1}
.seg button{flex:1;height:34px;border:0;border-radius:11px;background:transparent;color:var(--muted);cursor:pointer;font:700 14px Barlow,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:var(--acc);color:var(--acc-t);box-shadow:0 0 16px -6px rgba(212,255,63,.8)}
#dl{display:flex;flex-direction:column;gap:8px;margin-top:10px;overflow:auto;min-height:0;flex:1;padding:2px}
.dc{border:1px solid var(--line);border-radius:16px;padding:8px;display:grid;grid-template-columns:46px 1fr auto;gap:6px 8px;align-items:center;cursor:pointer;background:rgba(255,255,255,.02);flex:none}
.dc.act{border-color:rgba(212,255,63,.7);box-shadow:0 0 22px -10px rgba(212,255,63,.7)}
.dc img{width:46px;height:46px;object-fit:contain;border-radius:8px;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/10px 10px}
.dn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;background:rgba(212,255,63,.13);border:1px solid rgba(212,255,63,.42);border-radius:10px;padding:5px 9px;display:flex;align-items:center;gap:8px}
.dn span.n{overflow:hidden;text-overflow:ellipsis}
.dpi{font-size:12px;font-weight:700;margin-left:auto;flex:none}.dpi.ok{color:var(--ok)}.dpi.mid{color:var(--mid)}.dpi.bad{color:var(--bad)}
.cn{font-size:12px;color:var(--acc);flex:none;font-weight:700}
.dg{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr 1fr;gap:6px;align-items:center}
.pc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;flex:none;align-items:center}.pc>.ico{color:var(--acc)}
.chp{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 11px;font-weight:600;cursor:pointer;background:var(--bg);font-size:13px}
.chp:hover{border-color:var(--acc)}.chp i{font-style:normal;color:var(--muted);padding:0 3px}.chp i:hover{color:var(--bad)}
#stage{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;position:relative;border:1px solid var(--glow);border-radius:22px;background:rgba(255,255,255,.015);box-shadow:0 0 30px -14px rgba(212,255,63,.5)}
main{flex:1;min-width:0;min-height:0;display:flex}
#cv{box-shadow:0 25px 50px -12px rgba(0,0,0,.8);border-radius:2px;display:block}
#busy{position:absolute;top:12px;right:14px;color:var(--acc);opacity:0;transition:opacity .15s}#busy.on{opacity:1}
#empty{position:absolute;color:var(--muted);pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px}#empty .ico{width:44px;height:44px;opacity:.6}
.drop{height:40px;padding:0 14px;border-radius:14px;border:1px dashed rgba(212,255,63,.5);background:rgba(212,255,63,.06);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:700}.drop:hover,.drop.on{background:rgba(212,255,63,.16)}
@media(max-width:860px){
 .wrap{flex-direction:column;padding:8px;gap:8px}main{order:1}.rail{order:2;flex-direction:row;align-self:stretch;justify-content:center;padding:5px}.rail .ib{width:52px;height:40px}.panel{order:3;width:auto;height:min(38vh,300px);overflow:auto}
 h1{font-size:20px}.logo{height:26px}header{flex-wrap:wrap;gap:6px 8px;padding-left:10px;padding-right:10px}.chip{height:30px;padding:0 9px}
}
@media(max-width:520px){h1{display:none}.chip em{display:none}.chip{padding:0 9px}.logo{height:30px}}

.chip em{font-style:normal;font-weight:600;color:var(--muted);font-size:13px}
.cap{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}.cap .ico{width:15px;height:15px;color:var(--acc)}
.fi .lb{font-size:13px;font-weight:600;white-space:nowrap}.fi input{text-align:right}
.stp{display:flex;flex-direction:column;flex:none;margin-right:-4px}.stp button{width:22px;height:16px;padding:0;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}.stp button:hover{color:var(--acc)}.stp .ico{width:14px;height:14px}
.seg button{flex-direction:column;height:50px;gap:2px;font-size:12px}.seg button .ico{width:18px;height:18px}
.drop{height:56px;width:100%;font-size:15px;border-style:dashed;border-width:2px;flex:none}
.tgb{flex:1;height:46px;flex-direction:column;gap:2px;font-size:12px}
.pn{overflow:auto}a.ib{text-decoration:none}
.rail{width:68px;align-items:stretch}.rail .ib{width:auto;height:56px;flex-direction:column;gap:3px;font-size:11px;font-weight:700}.rail .ib span{line-height:1}.rail .sep{height:1px;background:var(--line);margin:2px 6px}
.dg .fi .lb{font-size:12px}.dg .fi{padding:0 6px}
@media(max-width:860px){.rail{width:auto}.rail .ib{width:78px;height:46px}.logo{height:34px}}
</style></head><body>

function cropBmp(im){const W=im.naturalWidth,H=im.naturalHeight;let box={x:0,y:0,w:W,h:H};
 if(ST.crop!=='off'){const sc=Math.min(1,900/Math.max(W,H)),tw=Math.max(1,Math.round(W*sc)),th=Math.max(1,Math.round(H*sc)),c=document.createElement('canvas');c.width=tw;c.height=th;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,tw,th);let d=null;try{d=x.getImageData(0,0,tw,th).data}catch(e){}
  if(d){let x0=tw,y0=th,x1=-1,y1=-1;const bk=ST.crop==='ab';for(let y=0;y<th;y++)for(let xx=0;xx<tw;xx++){const i=(y*tw+xx)*4;if(d[i+3]<10)continue;if(bk&&d[i]<25&&d[i+1]<25&&d[i+2]<25)continue;if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(y<y0)y0=y;if(y>y1)y1=y}

$('dl').addEventListener('input',e=>{const i=e.target;if(!i.dataset.k)return;const c=i.closest('.dc'),d=DS.find(x=>x.id==c.dataset.id);if(!d)return;act=d.id;const k=i.dataset.k;
 if(k==='q'){d.qty=i.value.replace(/\D/g,'');if(i.value!==d.qty)i.value=d.qty}
 else{const n=pv(i.value);if(!(n>0))return;if(k==='w'){d.w=n;if(d.lock){d.h=n*d.ph/d.pw;c.querySelector('[data-k=h]').value=fv(d.h)}}else{d.h=n;if(d.lock){d.w=n*d.pw/d.ph;c.querySelector('[data-k=w]').value=fv(d.w)}}$('dpi'+d.id).innerHTML=dpiBadge(d)}
 later()});
$('prs').addEventListener('click',e=>{const x=e.target.closest('[data-x]');if(x){presets.splice(+x.dataset.x,1);store();drawList();return}const p=e.target.closest('[data-p]');if(!p)return;const d=DS.find(x=>x.id===act);if(!d)return;const pr=presets[+p.dataset.p];d.w=pr.w;d.h=pr.h;d.lock=false;drawList();later()});

/* ---------- engine susunan (MaxRects + grid) ---------- */
const E=1e-6;
function newSheet(g){return{free:[{x:0,y:0,w:g.UW+g.s,h:g.UH+g.s}],items:[]}}
function split(sh,p){const out=[];for(const f of sh.free){if(p.x>=f.x+f.w-E||p.x+p.w<=f.x+E||p.y>=f.y+f.h-E||p.y+p.h<=f.y+E){out.push(f);continue}
 if(p.x>f.x+E)out.push({x:f.x,y:f.y,w:p.x-f.x,h:f.h});if(p.x+p.w<f.x+f.w-E)out.push({x:p.x+p.w,y:f.y,w:f.x+f.w-p.x-p.w,h:f.h});
 if(p.y>f.y+E)out.push({x:f.x,y:f.y,w:f.w,h:p.y-f.y});if(p.y+p.h<f.y+f.h-E)out.push({x:f.x,y:p.y+p.h,w:f.w,h:f.y+f.h-p.y-p.h})}
 sh.free=out.filter((a,i)=>!out.some((b,j)=>j!==i&&a.x>=b.x-E&&a.y>=b.y-E&&a.x+a.w<=b.x+b.w+E&&a.y+a.h<=b.y+b.h+E&&(j<i||Math.abs(a.w-b.w)>E||Math.abs(a.h-b.h)>E||Math.abs(a.x-b.x)>E||Math.abs(a.y-b.y)>E)))}
function place(sh,it,rot,s){let best=null;const rs=rot&&Math.abs(it.fw-it.fh)>E?[0,1]:[0];
 for(const f of sh.free)for(const r of rs){const w=(r?it.fh:it.fw)+s,h=(r?it.fw:it.fh)+s;if(w<=f.w+E&&h<=f.h+E){const a=Math.min(f.w-w,f.h-h),b=Math.max(f.w-w,f.h-h);if(!best||a<best.a-E||(Math.abs(a-best.a)<E&&b<best.b-E))best={x:f.x,y:f.y,w,h,r,a,b}}}
 if(!best)return false;sh.items.push({d:it.d,x:best.x,y:best.y,w:best.w-s,h:best.h-s,r:best.r,fw:it.fw,fh:it.fh});split(sh,best);return true}
function packMR(g,list,fills,rot){const sheets=[],errs=[];list=list.slice().sort((a,b)=>b.fw*b.fh-a.fw*a.fh);
 for(const it of list){let ok=false;for(const sh of sheets)if(place(sh,it,rot,g.s)){ok=true;break}
  if(!ok){const sh=newSheet(g);if(place(sh,it,rot,g.s))sheets.push(sh);else if(!errs.includes(it.d))errs.push(it.d)}}
 if(fills.length){if(!sheets.length)sheets.push(newSheet(g));const sh=sheets[sheets.length-1];let prog=true,n=0;while(prog&&n<4000){prog=false;for(const f of fills)if(place(sh,f,rot,g.s)){prog=true;n++}}}
 return{sheets,errs}}
function packGrid(g,it,qty,o){const fw=o?it.fh:it.fw,fh=o?it.fw:it.fh,cols=Math.floor((g.UW+g.s+E)/(fw+g.s)),rows=Math.floor((g.UH+g.s+E)/(fh+g.s)),cap=cols*rows;if(cap<1)return null;
 const n=qty>0?qty:cap,sheets=[];for(let i=0;i<n;i++){if(i%cap===0)sheets.push({items:[]});const k=i%cap;sheets[sheets.length-1].items.push({d:it.d,x:(k%cols)*(fw+g.s),y:Math.floor(k/cols)*(fh+g.s),w:fw,h:fh,r:o,fw:it.fw,fh:it.fh})}return{sheets,errs:[],grid:1}}
const cnt=r=>r.sheets.reduce((a,s)=>a+s.items.length,0),rotN=r=>r.sheets.reduce((a,s)=>a+s.items.filter(i=>i.r).length,0);
function layout(){const s=effSp(),b=ST.bleed,pad=ST.marks==='reg'?REGPAD:0,e=ST.edge+pad,UW=ST.aw-2*e,UH=ST.ah-2*e,g={s,b,UW,UH,e,pad};G=g;
 const out={sheets:[],errs:[],msgs:[]};if(UW<=0||UH<=0){out.msgs.push('Area cetak terlalu kecil.');return out}
 if(!DS.length)return out;
 if(ST.mode==='grid'){const d=DS[0],cols=ST.cols,rows=ST.rows,fw=(UW-(cols-1)*s)/cols;let fh=d.lock?fw*d.ph/d.pw:(UH-(rows-1)*s)/rows;if(fw<=0||fh<=0){out.msgs.push('Kolom/baris terlalu banyak.');return out}
  d.w=fw-2*b;d.h=fh-2*b;const sh={items:[]};for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(r*(fh+s)+fh>UH+E)continue;sh.items.push({d,x:c*(fw+s),y:r*(fh+s),w:fw,h:fh,r:0,fw,fh})}
  if(d.lock&&sh.items.length<cols*rows)out.msgs.push('Baris yang tidak muat dihilangkan ('+sh.items.length+' dari '+cols*rows+' stiker).');
  out.sheets=[sh];document.querySelectorAll('.dc').forEach(c=>{if(c.dataset.id==d.id){const w=c.querySelector('[data-k=w]'),h=c.querySelector('[data-k=h]');if(w&&document.activeElement!==w)w.value=fv(d.w);if(h&&document.activeElement!==h)h.value=fv(d.h);const q=$('dpi'+d.id);if(q)q.innerHTML=dpiBadge(d)}});
 }else{
  const list=[],fills=[];DS.forEach(d=>{const it={d,fw:d.w+2*b,fh:d.h+2*b},q=parseInt(d.qty)||0;if(q>0)for(let i=0;i<q;i++)list.push(it);else fills.push(it)});
  const cands=[];
  if(DS.length===1){const it=fills.length?fills[0]:list[0],q=fills.length?0:list.length;
   [0,1].forEach(o=>{if(o&&!ST.rot)return;const r=packGrid(g,it,q,o);if(r)cands.push(r)});
   if(q<=600){[false,true].forEach(rt=>{if(rt&&!ST.rot)return;cands.push(packMR(g,list,fills,rt))})}}
  else{[false,true].forEach(rt=>{if(rt&&!ST.rot)return;cands.push(packMR(g,list,fills,rt))})}
  const fillMode=DS.length===1&&fills.length;let best=null;
  for(const r of cands){if(!r.sheets.length)continue;const sc=fillMode?[-cnt(r),rotN(r)]:[r.sheets.length,rotN(r)];if(DS.length===1&&r.grid)sc[0]+=fillMode?-Math.ceil(cnt(r)*.1):-.5;if(!best||sc[0]<best.sc[0]||(sc[0]===best.sc[0]&&sc[1]<best.sc[1]))best={r,sc}}
  if(best){out.sheets=best.r.sheets;out.errs=best.r.errs}else{cands.forEach(r=>r.errs.forEach(d=>{if(!out.errs.includes(d))out.errs.push(d)}))}}
 out.sheets.forEach(sh=>{let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;sh.items.forEach(i=>{x0=Math.min(x0,i.x);y0=Math.min(y0,i.y);x1=Math.max(x1,i.x+i.w);y1=Math.max(y1,i.y+i.h)});
  const dx=ST.center?(UW-(x1-x0))/2-x0:0,dy=ST.center?(UH-(y1-y0))/2-y0:0;sh.items.forEach(i=>{i.x+=dx;i.y+=dy});sh.bb={x0:x0+dx,y0:y0+dy,x1:x1+dx,y1:y1+dy}});
 return out}

/* ---------- gambar ---------- */
function draw(ctx,k,sh,prev){const PW=ST.pw,PH=ST.ph,g=G||layout();ctx.save();ctx.fillStyle='#fff';ctx.fillRect(0,0,PW*k,PH*k);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
 if(prev){ctx.strokeStyle='rgba(0,0,0,.28)';ctx.setLineDash([6,4]);ctx.lineWidth=1;ctx.strokeRect((PW-ST.aw)/2*k,(PH-ST.ah)/2*k,ST.aw*k,ST.ah*k);ctx.setLineDash([])}
 if(!sh){ctx.restore();return}
 const ox=(PW-g.UW)/2,oy=(PH-g.UH)/2,b=g.b;
 sh.items.forEach(it=>{const X=(ox+it.x)*k,Y=(oy+it.y)*k,W=it.w*k,H=it.h*k;if(!it.r)ctx.drawImage(it.d.bmp,X,Y,W,H);else{ctx.save();ctx.translate(X+W/2,Y+H/2);ctx.rotate(Math.PI/2);ctx.drawImage(it.d.bmp,-H/2,-W/2,H,W);ctx.restore()}});
 if(ST.marks==='in'){ctx.save();ctx.scale(k,k);ctx.lineCap='butt';const t=Math.max(MT,prev?1.3/k:0),paths=new Path2D();
  sh.items.forEach(it=>{const x0=ox+it.x+b+t/2,y0=oy+it.y+b+t/2,x1=ox+it.x+it.w-b-t/2,y1=oy+it.y+it.h-b-t/2,l=Math.min(Math.max(ST.markL,prev?2.5/k:0),(x1-x0)/2,(y1-y0)/2);
   [[x0,y0,1,1],[x1,y0,-1,1],[x0,y1,1,-1],[x1,y1,-1,-1]].forEach(([cx,cy,sx,sy])=>{paths.moveTo(cx+sx*l,cy);paths.lineTo(cx,cy);paths.lineTo(cx,cy+sy*l)})});
  ctx.strokeStyle='#e00000';ctx.lineWidth=t;ctx.stroke(paths);ctx.restore()}
 else if(ST.marks==='reg'){const x0=ox+sh.bb.x0+b,y0=oy+sh.bb.y0+b,x1=ox+sh.bb.x1-b,y1=oy+sh.bb.y1-b;ctx.save();ctx.scale(k,k);ctx.strokeStyle='#000';ctx.lineWidth=Math.max(.05,prev?1.2/k:0);ctx.beginPath();
  [[x0,y0,1,1],[x1,y0,-1,1],[x0,y1,1,-1],[x1,y1,-1,-1]].forEach(([cx,cy,sx,sy])=>{const px=cx-sx*(REGO+b),py=cy-sy*(REGO+b);ctx.moveTo(px+sx*REGA,py);ctx.lineTo(px,py);ctx.lineTo(px,py+sy*REGA)});ctx.stroke();ctx.restore()}
 ctx.restore()}
let rq=0;function redraw(){cancelAnimationFrame(rq);rq=requestAnimationFrame(()=>{const st=$('stage'),cv=$('cv'),dpr=Math.min(2,window.devicePixelRatio||1),aw=st.clientWidth-20,ah=st.clientHeight-20,k=Math.max(1,Math.min(aw/ST.pw,ah/ST.ph));
 cv.style.width=ST.pw*k+'px';cv.style.height=ST.ph*k+'px';cv.width=Math.round(ST.pw*k*dpr);cv.height=Math.round(ST.ph*k*dpr);const x=cv.getContext('2d');x.setTransform(1,0,0,1,0,0);draw(x,k*dpr,SH[cur],true)})}
addEventListener('resize',redraw);
/* ---------- hasil & preview tertunda ---------- */
let tmr=0;function later(){$('busy').classList.add('on');clearTimeout(tmr);tmr=setTimeout(update,140)}
function update(){const L=layout();SH=L.sheets;if(cur>=SH.length)cur=Math.max(0,SH.length-1);const g=G;
 const tot=SH.reduce((a,s)=>a+s.items.length,0),ar=SH.reduce((a,s)=>a+s.items.reduce((q,i)=>q+(i.w-2*g.b)*(i.h-2*g.b),0),0),eff=SH.length&&g.UW>0?ar/(SH.length*g.UW*g.UH)*100:0;
 const ad=DS.find(x=>x.id===act)||DS[0];$('c4').textContent=ad?fv(ad.w)+' × '+fv(ad.h)+' '+ST.unit:'-';$('c1').textContent=tot;$('c2').textContent=SH.length;$('c3').textContent=eff.toFixed(0)+'%';
 const W=[];L.errs.forEach(d=>W.push(['b',d.name+': ukuran terlalu besar untuk area cetak.']));L.msgs.forEach(m=>W.push(['m',m]));
 DS.forEach(d=>{if(dpiOf(d)<200)W.push(['m',d.name.slice(0,24)+': resolusi rendah ('+Math.round(dpiOf(d))+' dpi), hasil cetak bisa pecah.'])});
 const wb=$('wbtn');wb.style.display=W.length?'':'none';wb.className='ib sm'+(W.length?(W.some(w=>w[0]==='b')?' bad':' has'):'');wb.innerHTML=IC('warn')+(W.length?'<b>'+W.length+'</b>':'');
 $('wpop').innerHTML=W.map(w=>'<div class="'+w[0]+'">'+esc(w[1])+'</div>').join('');if(!W.length)$('wpop').classList.remove('on');
 $('pn').textContent=SH.length?(cur+1)+' / '+SH.length:'-';$('pv').disabled=cur<=0;$('nx').disabled=cur>=SH.length-1;$('bpng').disabled=$('bpdf').disabled=!SH.length;
 fillCounts();$('busy').classList.remove('on');redraw()}
$('wbtn').onclick=e=>{e.stopPropagation();$('wpop').classList.toggle('on')};document.addEventListener('click',e=>{if(!e.target.closest('#wpop'))$('wpop').classList.remove('on')});
$('pv').onclick=()=>{if(cur>0){cur--;update()}};$('nx').onclick=()=>{if(cur<SH.length-1){cur++;update()}};

/* ---------- ekspor ---------- */
const DPI=300;function renderSheet(sh){const k=DPI/2.54,c=document.createElement('canvas');c.width=Math.round(ST.pw*k);c.height=Math.round(ST.ph*k);draw(c.getContext('2d'),k,sh,false);return c}
const blobOf=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const stamp=()=>ST.pw+'x'+ST.ph+'cm_'+Date.now();
$('bpng').onclick=async()=>{if(!SH.length)return;$('busy').classList.add('on');const c=renderSheet(SH[cur]);dl(await blobOf(c,'image/png'),'POSITIF_Layout_'+stamp()+(SH.length>1?'_lembar'+(cur+1):'')+'.png');$('busy').classList.remove('on')};
function buildPDF(pages,wcm,hcm){const enc=new TextEncoder(),parts=[],offs=[];let len=0;const push=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length};
 const W=(wcm/2.54*72).toFixed(2),H=(hcm/2.54*72).toFixed(2),n=pages.length,obj=(i,fn)=>{offs[i]=len;push(i+' 0 obj\n');fn();push('\nendobj\n')};
 push('%PDF-1.4\n');obj(1,()=>push('<</Type/Catalog/Pages 2 0 R>>'));obj(2,()=>push('<</Type/Pages/Count '+n+'/Kids['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+']>>'));
 pages.forEach((p,i)=>{const pg=3+i*3,ct=pg+1,im=pg+2,c='q '+W+' 0 0 '+H+' 0 0 cm /Im0 Do Q';
  obj(pg,()=>push('<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+W+' '+H+']/Resources<</XObject<</Im0 '+im+' 0 R>>>>/Contents '+ct+' 0 R>>'));
  obj(ct,()=>push('<</Length '+c.length+'>>\nstream\n'+c+'\nendstream'));
  obj(im,()=>{push('<</Type/XObject/Subtype/Image/Width '+p.w+'/Height '+p.h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+p.bytes.length+'>>\nstream\n');push(p.bytes);push('\nendstream')})});
 const xo=len,N=3*n+3;push('xref\n0 '+N+'\n0000000000 65535 f \n');for(let i=1;i<N;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
 push('trailer\n<</Size '+N+'/Root 1 0 R>>\nstartxref\n'+xo+'\n%%EOF');return new Blob(parts,{type:'application/pdf'})}
async function makePDF(){const pages=[];for(const sh of SH){const c=renderSheet(sh),b=await blobOf(c,'image/jpeg',.95);pages.push({w:c.width,h:c.height,bytes:new Uint8Array(await b.arrayBuffer())})}return buildPDF(pages,ST.pw,ST.ph)}
$('bpdf').onclick=async()=>{if(!SH.length)return;$('busy').classList.add('on');try{dl(await makePDF(),'POSITIF_Layout_'+stamp()+'.pdf')}finally{$('busy').classList.remove('on')}};

/* ---------- awal ---------- */
sync();drawList();update();
</script></body></html>
