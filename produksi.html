function pdata(){const inJ={},sold={},stt={},d30=Date.now()-30*864e5;realJ().filter(j=>j.stage!=='selesai'&&j.stage!=='batal').forEach(j=>j.items.forEach(i=>{inJ[i.vid]=(inJ[i.vid]||0)+i.qty;const o=stt[i.vid]=stt[i.vid]||{};o[stg(j)]=(o[stg(j)]||0)+i.qty}));S.sales.forEach(s=>{if(new Date(s.date)>d30)s.items.forEach(c=>sold[c.id]=(sold[c.id]||0)+c.qty)});return{inJ,sold,stt}}
/* target otomatis per varian: laku per hari × hari stok aman, dibulatkan ke lusin terdekat, minimal 1 lusin */
const autoT=(daily,P)=>Math.max(12,Math.round(daily*P.aman/12)*12);
function fillL(){const{inJ,sold,stt}=pdata(),P=PC(),q=pq.trim().toLowerCase(),ed=can('prod_buat'),mob=MOB();
 let rows=allV().filter(x=>!isJ(x.v)).map(x=>{const pj=inJ[x.v.id]||0,s30=sold[x.v.id]||0,daily=s30/30,own=P.tgt[x.v.id],man=own!=null&&own!=='',at=autoT(daily,P),t=man?+own:at;return{...x,pj,s30,daily,own,man,at,t,st:stt[x.v.id]||{},n:Math.max(0,t-x.v.stock-pj)}})
  .filter(x=>(!q||cn(x.p,x.v).toLowerCase().includes(q))&&(pjn==='Semua'||x.p.cat===pjn)&&(!pOnly||q||x.n>0||x.v.stock<=S.low)).sort((a,b)=>b.n-a.n||a.v.stock-b.v.stock);
 const tot=rows.length;rows=rows.slice(0,80);
 const tIn=(v,own,at,cls)=>'<input class="'+cls+'" type="text" inputmode="numeric" data-n value="'+(own!=null&&own!==''?own:'')+'" placeholder="'+at+'" title="Target stok varian ini (kosong = otomatis '+at+' pcs)" aria-label="Target"'+(ed?'':' disabled')+' onchange="setTgt('+v.id+',this.value)">';
 const more=tot>80?'<p class="muted">Menampilkan 80 dari '+tot+'. Gunakan pencarian.</p>':'',none='<p class="muted">'+(q?'Produk tidak ditemukan.':'Tidak ada produk yang perlu dicetak pada filter ini.')+'</p>';
 if(mob){$('pl').innerHTML=rows.length?rows.map(({p,v,pj,daily,own,man,at,st,n})=>'<div class="ccd"><div class="cch"><div><b>'+esc(cn(p,v))+'</b>'+(p.cat?'<small class="muted">'+esc(p.cat)+'</small>':'')+'</div>'+sbadge(v)+'</div><div class="cg4"><div><small>Stok</small><b>'+v.stock+'</b></div><div><small>Laku/hari</small><b>'+(daily?daily.toFixed(1).replace('.',','):'-')+'</b></div><div><small>Diproduksi</small><b>'+(pj||'-')+'</b></div><div><small>Target</small>'+tIn(v,own,at,'ctg'+(man?' man':''))+'</div></div>'+'<div class="cps">'+(pj?Object.entries(st).map(([s,k])=>'<span class="cpc" style="--sc:'+SC[s]+'">'+stn(s)+' '+k+'</span>').join(''):'')+'<span class="cpc '+(man?'mn':'au')+'">'+(man?'target manual':'target otomatis')+'</span></div><div class="cad"><input type="text" inputmode="numeric" data-n min="1" id="q'+v.id+'" value="'+(n||'')+'" placeholder="0" aria-label="Jumlah cetak"><span class="muted">pcs</span><button class="btn" onclick="addD('+v.id+')">+ Order</button></div></div>').join('')+more:none;return}
 $('pl').innerHTML=rows.length?'<table><tr><th>Produk</th><th>Stok</th><th>Laku / hari</th><th>Diproduksi</th><th>Posisi produksi</th><th>Target</th><th>Jumlah cetak</th><th></th></tr>'+rows.map(({p,v,pj,daily,own,man,at,st,n})=>'<tr><td><b>'+esc(cn(p,v))+'</b>'+(p.cat?'<br><small class="muted">'+esc(p.cat)+'</small>':'')+'</td><td>'+v.stock+' '+sbadge(v)+'</td><td>'+(daily?daily.toFixed(1).replace('.',','):'-')+'</td><td>'+(pj||'-')+'</td><td>'+(pj?Object.entries(st).map(([s,k])=>'<div><span class="wd" style="background:'+SC[s]+'"></span>'+stn(s)+': <b>'+k+'</b></div>').join(''):'<span class="muted">-</span>')+'</td><td>'+tIn(v,own,at,'tgi')+'</td><td><input type="text" inputmode="numeric" data-n min="1" id="q'+v.id+'" value="'+(n||'')+'" style="width:80px"></td><td><button class="btn sec" onclick="addD('+v.id+')">+ Order</button></td></tr>').join('')+'</table>'+more:none}
function setTgt(vid,val){if(!can('prod_buat'))return;const t=Object.assign({},PC().tgt);val=String(val).replace(/\D/g,'');if(val==='')delete t[vid];else t[vid]=+val;setPC({tgt:t});fillL()}
function addD(id){const n=Math.floor(+$('q'+id).value)||0;if(n<=0){toast('Isi jumlah cetak lebih dari 0.',1);return}
 const x=allV().find(x=>x.v.id===id);if(!x)return;const d=draft.find(i=>i.vid===id);if(d)d.qty+=n;else draft.push({vid:id,name:cn(x.p,x.v),qty:n});fillR();if(MOB())toast(cn(x.p,x.v)+': '+n+' pcs masuk order')}
function fillR(){const jobs=realJ(),day=pday,made=jobs.filter(j=>ymd(j.date)===day&&j.stage!=='batal'),done=jobs.filter(j=>j.hist.some(h=>h.stage==='bahan'&&!h.kind&&!h.back&&ymd(h.date)===day)),vs=vendNames();
 const tb=a=>a.length?'<div class="scroll"><table><tr><th>Produk</th><th>Jumlah</th><th>Vendor</th><th>Posisi</th></tr>'+a.map(j=>'<tr><td>'+jl(j)+'</td><td>'+jq(j)+'</td><td>'+esc(j.vendor||'-')+'</td><td>'+schip(stg(j))+'</td></tr>').join('')+'</table></div>':'<p class="muted" style="margin:4px 0">Tidak ada.</p>';
 const h3=t=>'<h3 style="margin:12px 0 4px;font-size:14px">'+t+'</h3>';
 const vsel=vs.length?'<select id="vend" title="Vendor"><option value="">- pilih vendor -</option>'+vs.map(v=>'<option>'+esc(v)+'</option>').join('')+'</select>':'<input id="vend" placeholder="Nama vendor (atur daftar di menu Vendor)">';
 $('pr').innerHTML='<div class="card fl dr"><h2 class="fn" style="margin:0 0 8px">Buat order cetak</h2>'+(draft.length?'<div class="fs"><table><tr><th>Produk</th><th>Jumlah</th><th></th></tr>'+draft.map((d,k)=>'<tr><td>'+esc(d.name)+'</td><td><input type="text" inputmode="numeric" data-n min="1" value="'+d.qty+'" style="width:70px" onchange="draft['+k+'].qty=Math.max(1,Math.floor(+this.value)||1)"></td><td><button class="btn sec" onclick="draft.splice('+k+',1);fillR()">Hapus</button></td></tr>').join('')+'</table></div><div class="form fn" style="margin-top:10px">'+vsel+'<label class="muted" style="display:flex;align-items:center;gap:6px">Tanggal butuh <input type="date" id="due" value="'+pdue+'" onchange="pdue=this.value"></label><button class="btn" onclick="saveOrd()">Simpan order ('+nf(draft.reduce((a,d)=>a+d.qty,0))+' pcs)</button><button class="btn sec" onclick="printDraft()">Cetak A4</button></div>':'<p class="muted">Klik "+ Order" pada produk di sebelah kiri. Order yang disimpan muncul di Alur produksi pada tahap Cetak vendor.</p>')+'</div>'
 +'<div class="card fl rk"><h2 class="fn" style="margin:0 0 8px">Rekap per hari</h2><div class="bar fn" style="align-items:center"><input type="date" value="'+day+'" onchange="pday=this.value||ymd(new Date());fillR()"><button class="btn sec" onclick="pday=ymd(new Date());fillR()">Hari ini</button><button class="btn sec" onclick="printDay()">Cetak A4</button></div><div class="fs">'+h3('Order dibuat ('+nf(tq(made))+' pcs)')+tb(made)+h3('Diterima dari vendor, masuk rak bahan ('+nf(tq(done))+' pcs)')+tb(done)+'</div></div>';cBar()}
function cBar(){const b=$('cbar'),n=$('ctn'),q=draft.reduce((a,d)=>a+d.qty,0);if(n)n.textContent=draft.length||'';if(!b)return;b.hidden=!draft.length;
 b.innerHTML=draft.length?'<div><b>'+draft.length+' produk · '+nf(q)+' pcs</b><small class="muted">siap dijadikan order cetak</small></div><button class="btn sec" onclick="cTab(\'order\')">Lihat order</button>':''}
function saveOrd(){if(!draft.length)return;const vd=(($('vend')||{}).value||'').trim(),due=(($('due')||{}).value||''),now=new Date().toISOString(),base=invId().replace('INV','PRD');S.jobs=S.jobs||[];
 if(vendNames().length&&!vd)return toast('Pilih vendor dulu.',1);
 draft.forEach((it,k)=>S.jobs.unshift({id:String(nid()),no:base+'-'+(k+1),grp:base,date:now,due,stage:'cetak',rc:1,vendor:vd,items:[{vid:it.vid,name:it.name,qty:it.qty}],hist:[{stage:'cetak',date:now,by:ME,q:it.qty,note:'Order cetak dibuat'+(vd?' · Vendor: '+vd:'')+(due?' · Butuh: '+due:'')}]}));

const dz=n=>{n=Math.max(0,Math.round(n));const d=Math.floor(n/12),r=n%12;return(d?d+' lusin':'')+(d&&r?' ':'')+((r||!d)?r+' pcs':'')},dzf=n=>dz(n)+(n>=12?' ('+nf(n)+' pcs)':'');
const lby=s=>{try{return(JSON.parse(localStorage.getItem('pos_by')||'{}'))[s]||''}catch(e){return''}},sby=(s,v)=>{try{const o=JSON.parse(localStorage.getItem('pos_by')||'{}');o[s]=v;localStorage.setItem('pos_by',JSON.stringify(o))}catch(e){}};

function jobsV(){const J=realJ().map(j=>({...j,items:j.items.map(i=>({...i}))})),add=[];
 PV.forEach(p=>{const j=J.find(x=>x.id===p.jid),it=j&&j.items.find(i=>i.vid===p.vid);if(!it)return;const m=p.add?0:(p.mv||((p.done||0)+(p.rej||0)));it.qty=Math.max(0,it.qty-m);const q=p.nq!=null?p.nq:(p.add||p.mv||p.done);

function groups(){const g={};jobsV().forEach(j=>{if(!RS.includes(j.stage))return;const l=jloc(j),st=stg(j);if(pg!=='Semua'&&l!==pg)return;j.items.forEach(it=>{if(it.qty<=0)return;const k=st+'|'+l+'|'+it.vid,o=g[k]=g[k]||{k,st,es:'',loc:l,vid:it.vid,name:it.name,qty:0,parts:[],date:lastH(j).date,prev:prevBy(j),vend:{},due:''};o.qty+=it.qty;o.parts.push({j,it});if(j.vendor)o.vend[j.vendor]=1;if(j.due&&(!o.due||j.due<o.due))o.due=j.due;const es=dstr(j.ves);if(es&&(!o.es||es<o.es))o.es=es;if(lastH(j).date<o.date){o.date=lastH(j).date;o.prev=prevBy(j)}})});

/* peringatan: lv 1 = mendekati batas, 2 = lewat batas / tanggal butuh terlewat */
function warn(G){const lim=PC().lim[G.st]||99,age=ndays(G.date);let lv=age>=lim?2:(lim>1&&age>=lim-1?1:0),dd=null,se=null;
