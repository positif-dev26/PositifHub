<script>
/* ---------- MENU PRODUKSI ---------- */
/* ---------- GUDANG PRODUKSI ---------- */
const PT=[['cetak','Cetak'],['tunggu','Menunggu vendor'],['bahan','Rak bahan'],['cutting','Cutting'],['jahit','Jahit'],['finishing','Finishing'],['reject','Reject'],['selesai','Selesai'],['gudang','Data gudang']];
const SS={cetak:'Di vendor',bahan:'Rak bahan',cutting:'Cutting',jahit:'Jahit',finishing:'Finishing'};
const GDEF=[{id:'g1',name:'Gudang 1',note:''},{id:'g2',name:'Gudang 2',note:''}];
const GL=()=>S.gudang&&S.gudang.length?S.gudang.slice().sort((a,b)=>(a.ord||0)-(b.ord||0)):GDEF;
const gres=l=>{const g=GL();return(g.find(x=>x.id===l)||g.find(x=>x.name===l)||g[0]).id},gname=id=>(GL().find(x=>x.id===id)||{name:id}).name;
let pg='Semua',pjn='Semua';
const jloc=j=>gres(j.loc||''),prevBy=j=>lastH(j).by||'-';
const stageRows=s=>{const q=pq.trim().toLowerCase();return jlist(s).filter(j=>(pg==='Semua'||jloc(j)===pg)&&(!q||jn(j).toLowerCase().includes(q))).sort((a,b)=>lastH(a).date<lastH(b).date?-1:1)};
let pst='alur',pq='',pOnly=true,tgt=0,draft=[],pday='';
const ymd=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const jlist=s=>(S.jobs||[]).filter(j=>j.stage===s),lastH=j=>[...j.hist].reverse().find(x=>!x.kind)||j.hist[0]||{date:j.date},jq=j=>j.items.reduce((a,i)=>a+i.qty,0),jn=j=>j.items.map(i=>i.name).join(', '),tq=a=>a.reduce((s,j)=>s+jq(j),0);
const PTI={alur:'workflow',cetak:'printer',selesai:'check',reject:'ban',gudang:'warehouse',petugas:'users'};
const PT2=[['alur','Alur produksi'],['cetak','Buat order cetak'],['selesai','Selesai'],['reject','Reject'],['gudang','Data gudang'],['petugas','Penanggung jawab']];
function vProd(){if(!pTabOk(pst))pst=(PT2.map(t=>t[0]).find(pTabOk)||'alur');if(!pday)pday=ymd(new Date());$('view').classList.toggle('fit',pst==='cetak'||pst==='selesai');
 $('view').innerHTML='<div class="prod"><div class="ptabs">'+PT2.filter(t=>pTabOk(t[0])).map(([k,l])=>'<button class="'+(k===pst?'on':'')+'" title="'+l+'" aria-label="'+l+'" onclick="pst=\''+k+'\';vProd()">'+IC(PTI[k])+'</button>').join('')+'</div><div id="pbody"></div></div>';
 if(pst==='alur')flowView();else if(pst==='cetak')cetakView();else if(pst==='selesai')doneView();else if(pst==='reject')rejectView();else if(pst==='petugas')petugasView();else gudangView();stk()}
/* ----- Cetak: produk di kiri, order di kanan ----- */
function cetakView(){$('pbody').innerHTML='<div class="cols"><div class="card fl"><div class="sk1 fn"><h2 style="margin:0 0 8px">Produk</h2><div class="bar" style="align-items:center;flex-wrap:wrap;margin-bottom:0"><input id="pq" placeholder="Cari produk, mis. kaos pe anak hitam L" value="'+esc(pq)+'" oninput="pq=this.value;fillL()" style="flex:1;min-width:160px"><select onchange="pjn=this.value;fillL()" title="Jenis produk">'+cats().map(c=>'<option value="'+esc(c)+'"'+(c===pjn?' selected':'')+'>'+(c==='Semua'?'Semua jenis':esc(c))+'</option>').join('')+'</select><label class="muted"><input type="checkbox" '+(pOnly?'checked':'')+' onchange="pOnly=this.checked;fillL()"> Hanya habis/menipis</label><span class="muted">Target stok</span><input type="text" inputmode="numeric" data-n min="1" value="'+(tgt||S.low*3)+'" style="width:80px" onchange="tgt=Math.max(1,+this.value||0);fillL()"></div></div><div id="pl" class="scroll fs"></div></div><div id="pr"></div></div>';fillL();fillR()}
function pdata(){const inJ={},sold={},stt={},d30=Date.now()-30*864e5;(S.jobs||[]).filter(j=>j.stage!=='selesai').forEach(j=>j.items.forEach(i=>{inJ[i.vid]=(inJ[i.vid]||0)+i.qty;const o=stt[i.vid]=stt[i.vid]||{};o[j.stage]=(o[j.stage]||0)+i.qty}));S.sales.forEach(s=>{if(new Date(s.date)>d30)s.items.forEach(c=>sold[c.id]=(sold[c.id]||0)+c.qty)});return{inJ,sold,stt}}
function fillL(){const{inJ,sold,stt}=pdata(),t=tgt||S.low*3,q=pq.trim().toLowerCase();
 let rows=allV().filter(x=>!isJ(x.v)).map(x=>{const pj=inJ[x.v.id]||0,s30=sold[x.v.id]||0;return{...x,pj,s30,st:stt[x.v.id]||{},n:Math.max(Math.max(t,s30)-x.v.stock-pj,0)}}).filter(x=>(!q||cn(x.p,x.v).toLowerCase().includes(q))&&(pjn==='Semua'||x.p.cat===pjn)&&(!pOnly||q||x.v.stock<=S.low)).sort((a,b)=>a.v.stock-b.v.stock);
 const tot=rows.length;rows=rows.slice(0,80);
 $('pl').innerHTML=rows.length?'<table><tr><th>Produk</th><th>Stok</th><th>Terjual 30 hari</th><th>Diproduksi</th><th>Status produksi</th><th>Jumlah</th><th></th></tr>'+rows.map(({p,v,pj,s30,st,n})=>'<tr><td><b>'+esc(cn(p,v))+'</b>'+(p.cat?'<br><small class="muted">'+esc(p.cat)+'</small>':'')+'</td><td>'+v.stock+' '+sbadge(v)+'</td><td>'+(s30||'-')+'</td><td>'+(pj||'-')+'</td><td>'+(pj?Object.entries(st).map(([s,k])=>'<div>'+SS[s]+': <b>'+k+'</b></div>').join(''):'<span class="muted">-</span>')+'</td><td><input type="text" inputmode="numeric" data-n min="1" id="q'+v.id+'" value="'+(n||'')+'" style="width:80px"></td><td><button class="btn sec" onclick="addD('+v.id+')">+ Order</button></td></tr>').join('')+'</table>'+(tot>80?'<p class="muted">Menampilkan 80 dari '+tot+'. Gunakan pencarian.</p>':''):'<p class="muted">'+(q?'Produk tidak ditemukan.':'Tidak ada produk yang perlu dicetak pada filter ini.')+'</p>'}
function addD(id){const n=Math.floor(+$('q'+id).value)||0;if(n<=0){alert('Isi jumlah cetak lebih dari 0.');return}
 const x=allV().find(x=>x.v.id===id);if(!x)return;const d=draft.find(i=>i.vid===id);if(d)d.qty+=n;else draft.push({vid:id,name:cn(x.p,x.v),qty:n});fillR()}
function fillR(){const jobs=S.jobs||[],day=pday,made=jobs.filter(j=>ymd(j.date)===day),done=jobs.filter(j=>j.hist.some(h=>h.stage==='bahan'&&!h.kind&&ymd(h.date)===day));
 const tb=a=>a.length?'<div class="scroll"><table><tr><th>Produk</th><th>Jumlah</th><th>Vendor</th><th>Status</th></tr>'+a.map(j=>'<tr><td>'+jl(j)+'</td><td>'+jq(j)+'</td><td>'+esc(j.vendor||'-')+'</td><td>'+SL[j.stage]+'</td></tr>').join('')+'</table></div>':'<p class="muted" style="margin:4px 0">Tidak ada.</p>';
 const h3=t=>'<h3 style="margin:12px 0 4px;font-size:14px">'+t+'</h3>';
 $('pr').innerHTML='<div class="card fl dr"><h2 class="fn" style="margin:0 0 8px">Buat order cetak</h2>'+(draft.length?'<div class="fs"><table><tr><th>Produk</th><th>Jumlah</th><th></th></tr>'+draft.map((d,k)=>'<tr><td>'+esc(d.name)+'</td><td><input type="text" inputmode="numeric" data-n min="1" value="'+d.qty+'" style="width:70px" onchange="draft['+k+'].qty=Math.max(1,Math.floor(+this.value)||1)"></td><td><button class="btn sec" onclick="draft.splice('+k+',1);fillR()">Hapus</button></td></tr>').join('')+'</table></div><div class="form fn" style="margin-top:10px"><input id="vend" placeholder="Nama vendor cetak"><button class="btn" onclick="saveOrd()">Simpan order ('+nf(draft.reduce((a,d)=>a+d.qty,0))+' pcs)</button><button class="btn sec" onclick="printDraft()">Cetak A4</button></div>':'<p class="muted">Klik "+ Order" pada produk di sebelah kiri. Order yang sudah disimpan menunggu di tab "Menunggu vendor".</p>')+'</div>'
 +'<div class="card fl rk"><h2 class="fn" style="margin:0 0 8px">Rekap per hari</h2><div class="bar fn" style="align-items:center"><input type="date" value="'+day+'" onchange="pday=this.value||ymd(new Date());fillR()"><button class="btn sec" onclick="pday=ymd(new Date());fillR()">Hari ini</button><button class="btn sec" onclick="printDay()">Cetak A4</button></div><div class="fs">'+h3('Order dibuat ('+nf(tq(made))+' pcs)')+tb(made)+h3('Selesai dicetak, masuk rak bahan ('+nf(tq(done))+' pcs)')+tb(done)+'</div></div>'}
function saveOrd(){if(!draft.length)return;const vd=($('vend')||{}).value?$('vend').value.trim():'',now=new Date().toISOString(),base=invId().replace('INV','PRD');S.jobs=S.jobs||[];
 draft.forEach((it,k)=>S.jobs.unshift({id:String(nid()),no:base+'-'+(k+1),grp:base,date:now,stage:'cetak',vendor:vd,items:[{vid:it.vid,name:it.name,qty:it.qty}],hist:[{stage:'cetak',date:now,by:ME,note:'Order cetak dibuat'+(vd?' · Vendor: '+vd:'')}]}));
 draft=[];save();render();toast('Order cetak disimpan')}
async function cancelSel(){const l=jlist('cetak').filter(j=>$('pc'+j.id)&&$('pc'+j.id).checked);if(!l.length){alert('Pilih order yang mau dibatalkan.');return}
 if(!(await askC('Batalkan '+l.length+' order ('+nf(l.reduce((a,j)=>a+jq(j),0))+' pcs)? Order tetap tersimpan di riwayat sebagai Dibatalkan.','Batalkan order')))return;
 const now=new Date().toISOString();l.forEach(j=>{j.stage='batal';j.hist.push({stage:'batal',date:now,by:ME,note:'Order dibatalkan'})});save();render()}
function selAll(){jlist('cetak').forEach(j=>{const e=$('pc'+j.id);if(e)e.checked=true})}
async function markPrinted(){const l=jlist('cetak').filter(j=>$('pc'+j.id)&&$('pc'+j.id).checked);if(!l.length){alert('Centang dulu order yang sudah dicetak.');return}const g=$('tg').value;if(!(await chkSrv()))return;advMany(l.map(j=>[j.id,'cetak','','',{},{loc:g}]))}
/* ----- Rak bahan, Cutting, Jahit, Finishing: satu tab per tahap ----- */
/* ----- Produksi: alur, rak, detail (jumlah digabung per produk, lusin, simpan di belakang layar) ----- */
let psel='',PV=[],PQ=[],PR=false,PK=0;
const dz=n=>{n=Math.max(0,Math.round(n));const d=Math.floor(n/12),r=n%12;return(d?d+' lusin':'')+(d&&r?' ':'')+((r||!d)?r+' pcs':'')},dzf=n=>dz(n)+(n>=12?' ('+nf(n)+' pcs)':'');
const lby=s=>{try{return(JSON.parse(localStorage.getItem('pos_by')||'{}'))[s]||''}catch(e){return''}},sby=(s,v)=>{try{const o=JSON.parse(localStorage.getItem('pos_by')||'{}');o[s]=v;localStorage.setItem('pos_by',JSON.stringify(o))}catch(e){}};
function jobsV(){const J=(S.jobs||[]).map(j=>({...j,items:j.items.map(i=>({...i}))})),add=[];
 PV.forEach(p=>{const j=J.find(x=>x.id===p.jid),it=j&&j.items.find(i=>i.vid===p.vid);if(!it)return;const m=p.mv||((p.done||0)+(p.rej||0));it.qty=Math.max(0,it.qty-m);const q=p.mv||p.done;
  if(q)add.push({...j,id:'v'+p.k,stage:p.to||j.stage,loc:p.toLoc||p.loc||j.loc,items:[{vid:p.vid,name:it.name,qty:q}],hist:[{stage:p.to||j.stage,date:new Date().toISOString(),by:p.by||''}],rejs:[]})});
 return J.concat(add).filter(j=>j.items.some(i=>i.qty>0))}
function groups(){const g={};jobsV().forEach(j=>{if(!RS.includes(j.stage))return;const l=jloc(j);if(pg!=='Semua'&&l!==pg)return;j.items.forEach(it=>{if(it.qty<=0)return;const k=j.stage+'|'+l+'|'+it.vid,o=g[k]=g[k]||{k,st:j.stage,loc:l,vid:it.vid,name:it.name,qty:0,parts:[],date:lastH(j).date,prev:prevBy(j),vend:{}};o.qty+=it.qty;o.parts.push({j,it});if(j.vendor)o.vend[j.vendor]=1;if(lastH(j).date<o.date){o.date=lastH(j).date;o.prev=prevBy(j)}})});
 return Object.values(g).map(o=>({...o,n:o.parts.length,vendor:Object.keys(o.vend).join(', ')})).sort((a,b)=>a.name.localeCompare(b.name))}
function pfs(v){pq=v;flowView();const i=$('pq');if(i){i.focus();i.setSelectionRange(v.length,v.length)}}
const SI2={cetak:'printer',bahan:'layers',cutting:'scissors',jahit:'shirt',finishing:'sparkles'};
const splitN=n=>{const m=String(n).match(/^(.*\S)\s*\(([^()]*)\)\s*$/);return m?{b:m[1],s:m[2]}:{b:String(n),s:''}};
function flowView(){const q=pq.trim().toLowerCase(),all=groups().filter(g=>!q||g.name.toLowerCase().includes(q)),gl=GL(),multi=gl.length>1&&pg==='Semua';
 let sel=all.find(g=>g.k===psel);if(!sel){sel=all[0];psel=sel?sel.k:''}
 const ci=sel?RS.indexOf(sel.st):-1;
 const box=s=>{const L=all.filter(g=>g.st===s),tot=L.reduce((a,g)=>a+g.qty,0),by={};
  L.forEach(g=>{const n=splitN(g.name);(by[n.b]=by[n.b]||[]).push({g,s:n.s})});
  const names=Object.keys(by).sort((a,b)=>a.localeCompare(b,'id'));
  return '<section class="sb'+(sel&&sel.st===s?' cur':'')+'"><div class="sbh"><span class="sbi">'+IC(SI2[s])+'</span><div><b>'+STL[s]+'</b><small>'+L.length+' item · '+dz(tot)+'</small>'+(pjName(s)?'<small class="pjn">PJ: '+esc(pjName(s))+'</small>':'')+'</div></div><div class="sbl">'
  +(names.map(b=>'<div class="vg"><div class="vgn">'+esc(b)+'</div>'+by[b].sort((x,y)=>x.s.localeCompare(y.s,'id',{numeric:true})).map(x=>'<button class="vr'+(x.g.k===psel?' on':'')+'" onclick="psel=\''+esc(x.g.k)+'\';flowView()"><span class="vs">'+esc(x.s||'Standar')+(multi?'<small> · '+esc(gname(x.g.loc))+'</small>':'')+'</span><span class="vq">'+dzf(x.g.qty)+'</span></button>').join('')+'</div>').join('')||'<div class="sbe">Kosong</div>')+'</div></section>'};
 $('pbody').innerHTML='<div class="pfh"><div><h1 class="pt">Alur produksi</h1><p class="muted">Pantau posisi setiap produk dari vendor sampai siap dikirim.</p></div><div class="bar" style="align-items:center;margin:0">'+(gl.length>1?'<select onchange="pg=this.value;flowView()"><option value="Semua"'+(pg==='Semua'?' selected':'')+'>Semua gudang</option>'+gl.map(g=>'<option value="'+esc(g.id)+'"'+(g.id===pg?' selected':'')+'>'+esc(g.name)+'</option>').join('')+'</select>':'')+'<input id="pq" placeholder="Cari produk" value="'+esc(pq)+'" oninput="pfs(this.value)" style="min-width:160px"><button class="ib" title="Cetak A4 tahap ini" aria-label="Cetak A4 tahap ini" onclick="printStage(\''+(sel&&sel.st!=='cetak'?sel.st:'bahan')+'\')">'+IC('printer')+'</button></div></div>'
 +'<div class="stp">'+RS.map((s,i)=>'<div class="sti'+(i<ci?' dn':i===ci?' cur':'')+'"><b>'+(i<ci?'&#10003;':i+1)+'</b>'+STL[s]+'</div>').join('<i></i>')+'</div>'
 +'<div class="pf"><div><div class="rh"><h2>Rak produksi</h2><span class="muted">'+all.length+' produk berjalan</span></div><div class="sbs">'+RS.map(box).join('')+'</div></div><div id="pdt">'+(sel?panel(sel):'<div class="card"><h2 style="margin:0 0 6px">Detail produk</h2><p class="muted">Belum ada produk berjalan. Buat order di tab "Buat order cetak".</p></div>')+'</div></div>';
 if(sel&&sel.st!=='cetak')prc(sel.k);stk()}
function panel(G){const nx=RS[RS.indexOf(G.st)+1]||'selesai',dy=Math.floor((Date.now()-new Date(G.date))/864e5),oth=GL().filter(x=>x.id!==G.loc),k=esc(G.k),r=(a,b)=>'<div class="dr2"><span>'+a+'</span><b>'+b+'</b></div>',ni='type="text" inputmode="numeric" data-n';
 let h='<div class="card pdt"><h2 style="margin:0">Detail produk</h2><div class="pn">'+esc(G.name)+'</div><div class="muted">'+(G.n>1?'Gabungan '+G.n+' order':'1 order')+(G.vendor?' · Vendor: '+esc(G.vendor):'')+'</div><hr class="mhr">'+r('Jumlah',dzf(G.qty))+r('Tahap',STL[G.st])+r('Masuk tahap',fmt(G.date)+' ('+dy+' hari)')+(G.st==='cetak'?'':r('Petugas sebelumnya',esc(G.prev)));
 if(!can('prod_'+G.st))h+='<p class="muted" style="margin:10px 0">Akun Anda tidak punya akses untuk memproses tahap ini.</p>';else if(G.st==='cetak')h+='<label class="muted">Masuk ke gudang</label><select id="tg">'+GL().map(g=>'<option value="'+esc(g.id)+'"'+(g.id===(pg!=='Semua'?pg:GL()[0].id)?' selected':'')+'>'+esc(g.name)+'</option>').join('')+'</select><button class="btn wide" onclick="pdone(\''+k+'\')">Tandai sudah dicetak</button>';
 else h+='<label class="muted">Sudah jadi</label><div class="f2"><input '+ni+' id="dl" value="'+Math.floor(G.qty/12)+'" oninput="prc(\''+k+'\')"><span>lusin</span><input '+ni+' id="dp" value="'+G.qty%12+'" oninput="prc(\''+k+'\')"><span>pcs</span></div><label class="muted">Reject (pcs)</label><input '+ni+' id="rj" placeholder="0" oninput="prc(\''+k+'\')"><div id="sisa" class="muted" style="margin-bottom:6px"></div><input id="by" list="pdl" autocomplete="off" placeholder="Petugas (wajib)" value="'+esc(lby(G.st)||pjName(G.st)||(can('prod_'+G.st)?ME:''))+'">'+pdl(G.st)+'<input id="nt" placeholder="Catatan (opsional)"><button class="btn wide" onclick="padv(\''+k+'\')">'+(nx==='selesai'?'Selesai: masuk stok POS':'Pindahkan ke '+STL[nx])+'</button>'
 +(oth.length?'<label class="muted">Kirim ke gudang lain (kosong = semua)</label><div class="f2"><select id="kt">'+oth.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('')+'</select><input '+ni+' id="sl" placeholder="lusin" style="width:70px"><input '+ni+' id="sp" placeholder="pcs" style="width:70px"></div><button class="btn sec wide" onclick="psend(\''+k+'\')">Kirim</button>':'');
 h+='<hr class="mhr"><div class="muted">Isi gabungan</div>'+G.parts.map(p=>'<div class="dr2"><span>'+esc(p.j.no||'')+'</span><span>'+dz(p.it.qty)+' <button type="button" class="jh" onclick="showHist(\''+p.j.id+'\')" title="Riwayat" aria-label="Riwayat">'+HIC+'</button></span></div>').join('');
