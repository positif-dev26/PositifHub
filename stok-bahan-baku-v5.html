<script>
// ====== PENGATURAN ======
// Tempel URL Web App Google Apps Script di sini. Kosong = mode demo (data di browser, PIN kantor 1234).
var API="https://script.google.com/macros/s/AKfycbxIEy8C4YY0H_DJJHRWjAA38YvpD2M01Kb7H-zcvaXqnFWJk0HWnIgg2Vtj0MMivl41/exec";
// ========================
var LK="positif-stok-v4",ST=["Diminta","Dibelanjakan","Dalam perjalanan","Sampai gudang","Unboxing","Masuk rak"],SAT=["pcs","pack","roll","kg","cone","botol"],KOND=["Baik","Perlu servis","Rusak"];
var S={Bahan:[],Divisi:[],Pengguna:[],Order:[],Riwayat:[],Alat:[]},me=null,view="home",fs="Semua",fd="Semua",qs="",ex={},foc=null,pend=0,lm="minggu",lo=0,selU=null,cart={},cat="",pm=null,ot=null,sq=Promise.resolve(),W=(function(){try{return localStorage.getItem("ws")||"1"}catch(e){return"1"}})();
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var uid=function(){return"x"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var rd=function(v){return Math.round(v*1000)/1000};
var idx=function(t,id){for(var i=0;i<t.length;i++)if(t[i].id==id)return i;return-1};

var ed=function(){return me&&(me.role=="kantor"||me.role=="editor")};

// ---- logika data (sama dengan Code.gs) ----
function run(L,p,role,a){
  var E=function(m){return{ok:0,err:m}},ok={ok:1},e=role=="kantor"||role=="editor";
  switch(p.op){
  case"load":return ok;
  case"login":return role?{ok:1,role:role}:E("Nama atau PIN salah");
  case"register":var n=String(p.name||"").trim();
    if(!/^\d{4}$/.test(String(p.pin||"")))return E("PIN harus 4 angka");
    if(!n||n.toLowerCase()=="kantor"||L.Pengguna.some(function(x){return x.nama.toLowerCase()==n.toLowerCase()}))return E("Nama tidak valid atau sudah terdaftar");
    L.Pengguna.push({id:p.id||uid(),nama:n,pin:String(p.pin),akses:""});return ok;
  case"setuser":if(role!="kantor")return E("Hanya kantor");var u=L.Pengguna[idx(L.Pengguna,p.id)];
    if(!u||!/^\d{4}$/.test(String(p.pin||""))||!String(p.nama||"").trim())return E("Data tidak valid");
    if(L.Pengguna.some(function(x){return x.id!=p.id&&x.nama.toLowerCase()==String(p.nama).trim().toLowerCase()}))return E("Nama sudah ada");
    u.nama=String(p.nama).trim();u.pin=String(p.pin);u.akses=p.akses?"1":"";return ok;
  case"upsert":if(["Bahan","Divisi","Order","Alat"].indexOf(p.sheet)<0)return E("Tabel tidak valid");
    var t=L[p.sheet],i=idx(t,p.row.id),baru=p.sheet=="Order"&&i<0&&p.row.status=="Diminta"&&role;
    if(!(baru||(p.sheet=="Order"?role=="kantor":e)))return E("Anda tidak punya akses untuk mengubah ini");
    if(i<0)t.push(p.row);else t[i]=p.row;return ok;
  case"del":var okd=["Bahan","Divisi","Alat"].indexOf(p.sheet)>=0?e:(["Order","Pengguna"].indexOf(p.sheet)>=0&&role=="kantor");
    if(!okd)return E("Anda tidak punya akses untuk menghapus");L[p.sheet]=L[p.sheet].filter(function(x){return x.id!=p.id});return ok;
  case"ambil":var it=p.items||[],j,bb,qq;if(!role)return E("Masuk dulu");if(!it.length)return E("Keranjang kosong");
    for(j=0;j<it.length;j++){bb=L.Bahan[idx(L.Bahan,it[j].id)];qq=Number(it[j].q);if(!bb||!(qq>0))return E("Data tidak valid");if(Number(bb.stok)<qq)return E("Stok "+bb.nama+" tidak cukup")}
    it.forEach(function(x){var b3=L.Bahan[idx(L.Bahan,x.id)];b3.stok=rd(Number(b3.stok)-Number(x.q));L.Riwayat.push({id:x.rid||uid(),tgl:p.t||new Date().toISOString(),bahanId:x.id,jumlah:-Number(x.q),oleh:a.name,ket:p.ket||""})});return ok;
  case"adjust":var b=L.Bahan[idx(L.Bahan,p.id)],d=Number(p.delta);
    if(!role)return E("Masuk dulu");if(!b||!d)return E("Data tidak valid");
    if(d>0&&role!="kantor")return E("Hanya kantor yang boleh menambah stok");
    if(Number(b.stok)+d<0)return E("Stok tidak cukup");
    b.stok=rd(Number(b.stok)+d);
    L.Riwayat.push({id:p.rid||uid(),tgl:p.t||new Date().toISOString(),bahanId:b.id,jumlah:d,oleh:a.name,ket:p.ket||""});return ok;
  case"editambil":var h=L.Riwayat[idx(L.Riwayat,p.id)],q=Number(p.jumlah);
    if(!h||h.jumlah>=0)return E("Data tidak valid");
    if(!role||(role!="kantor"&&h.oleh!=a.name))return E("Hanya pengambil atau kantor yang boleh mengubah");
    if(!(q>0))return E("Jumlah tidak valid");var b2=L.Bahan[idx(L.Bahan,h.bahanId)];if(!b2)return E("Bahan tidak ada");
    var df=-q-Number(h.jumlah);if(Number(b2.stok)+df<0)return E("Stok tidak cukup");
    b2.stok=rd(Number(b2.stok)+df);h.jumlah=-q;return ok}
  return E("Perintah tidak dikenal")}
function role_(L,a){if(a.name=="Kantor")return a.pin==(L._kp||"1234")?"kantor":null;
  var u=L.Pengguna.filter(function(x){return x.nama==a.name&&String(x.pin)==String(a.pin)})[0];return u?(u.akses?"editor":"user"):null}
function strip(L,role){return{Bahan:L.Bahan,Divisi:L.Divisi,Order:L.Order,Alat:L.Alat,Riwayat:L.Riwayat.slice(-2000),
  Pengguna:L.Pengguna.map(function(x){return role=="kantor"?x:{id:x.id,nama:x.nama,akses:x.akses}})}}
function demo(){var dv=[["Potong Bahan","1"],["Jahit","1"],["Pres DTF","1"],["Cetak Stiker","1"],["Packing","1"],["Print Resi","1"],["Potong Jersey","2"],["Jahit","2"],["Cetak DTF","2"]];
  return{Divisi:dv.map(function(a,i){return{id:"d"+(i+1),nama:a[0],ws:a[1]}}),
  Bahan:[["Kain Dry-Fit","d1","meter",120,50],["Benang","d2","cone",0,0],["Film DTF","d3","roll",0,2],["Tinta DTF","d3","botol",0,0],["Kertas Stiker","d4","pack",1,5],["Plastik Packing","d5","pack",20,8],["Kain Jersey","d7","meter",60,30]].map(function(a,i){return{id:"b"+i,nama:a[0],divisi:a[1],satuan:a[2],stok:a[3],min:a[4],parent:""}})
   .concat([["Hitam",3,10],["Putih",12,10]].map(function(a,i){return{id:"v"+i,nama:a[0],divisi:"d2",satuan:"cone",stok:a[1],min:a[2],parent:"b1"}})),
  Pengguna:[],Order:[],Riwayat:[],Alat:[]}}
function local(p){var L;try{L=JSON.parse(localStorage.getItem(LK))}catch(e){}L=L||demo();L.Alat=L.Alat||[];
  var a=p.auth||{},ro=role_(L,a),r=run(L,p,ro,a);
  if(p.op=="login"&&!r.ok&&a.name=="Kantor")r.err="PIN kantor salah";
  try{localStorage.setItem(LK,JSON.stringify(L))}catch(e){}
  r.data=strip(L,ro);return r}
var OPT=["upsert","del","adjust","editambil","ambil"];
function send(p){return API?fetch(API,{method:"POST",body:JSON.stringify(p)}).then(function(x){return x.json()}):Promise.resolve(local(p))}
async function call(op,p){p=p||{};p.op=op;p.auth=me?{name:me.name,pin:me.pin}:{};
  if(OPT.indexOf(op)>=0){ // tampil langsung, simpan di latar belakang
    var c=JSON.parse(JSON.stringify(S)),r0=run(c,p,me&&me.role,p.auth);
    if(!r0.ok){toast(r0.err);return r0}
    S=c;render();pend++;
    sq=sq.then(function(){return send(p)}).then(function(x){pend--;if(x.ok)toast("✓ Perubahan berhasil disimpan");else{toast(x.err||"Gagal menyimpan");refresh()}})
      .catch(function(){pend--;toast("Gagal terhubung ke Google Sheets");refresh()});
    return r0}
  var r;try{r=await send(p)}catch(e){r={ok:0,err:"Gagal terhubung ke Google Sheets"}}
  if(r.data)S=r.data;if(!r.ok)toast(r.err||"Gagal");else if(op=="register"||op=="setuser")toast("✓ Perubahan berhasil disimpan");
  $("sync").textContent=API?"Tersinkron":"Mode demo";render();return r}
async function refresh(){if(pend)return;try{var p={op:"load",auth:me?{name:me.name,pin:me.pin}:{}},r=await send(p);if(r.data&&!pend){S=r.data;$("sync").textContent=API?"Tersinkron":"Mode demo";render()}}catch(e){$("sync").textContent="Offline"}}

// ---- turunan ----
var gb=function(id){return S.Bahan[idx(S.Bahan,id)]};
var kids=function(id){return S.Bahan.filter(function(b){return b.parent==id})};
var leaves=function(){return S.Bahan.filter(function(b){return wsOf(b)==W&&(b.parent||!kids(b.id).length)})};
function fn(b){var p=b.parent&&gb(b.parent);return p?p.nama+" – "+b.nama:b.nama}
var dn=function(id){var d=S.Divisi.filter(function(x){return x.id==id})[0];return d?d.nama:"-"};
var bn=function(id){var b=gb(id);return b?fn(b):"(dihapus)"};
function sts(b){return b.stok<=0?"habis":b.stok<=b.min?"tipis":"aman"}
var open_=function(o){return o.status!="Masuk rak"&&o.status!="Dibatalkan"};
var actOrder=function(id){return S.Order.filter(function(o){return o.bahanId==id&&open_(o)})[0]};
var fmt=function(s){var d=new Date(s);return isNaN(d)?"":d.toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})};
var LB={habis:"Habis",tipis:"Menipis",aman:"Aman"};

function go(v){view=v;qs="";if(v=="stok"&&isKd(S.Divisi[idx(S.Divisi,fd)]))fd="Semua";render()}
function goItem(id){view="order";qs="";ot=actOrder(id)?"jalan":"perlu";foc=id;render()}
function tg(id){ex[id]=!ex[id];render()}
var wsOf=function(b){var d=S.Divisi[idx(S.Divisi,b.divisi)];return d?(d.ws||"1"):"1"};
var inW=function(id){var b=gb(id);return b?wsOf(b)==W:false};
var ordW=function(){return S.Order.filter(function(o){return inW(o.bahanId)})};
function setW(w){W=w;fd="Semua";cart={};try{localStorage.setItem("ws",w)}catch(e){}render()}
function render(){
    $("w1").className=W=="1"?"on":"";$("w2").className=W=="2"?"on":"";
  $("who").innerHTML=me?'<span style="margin:0 6px">👤 <b>'+esc(me.name)+'</b></span><button class="ic" title="Keluar" onclick="me=null;render()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></button>':'<button class="pri" onclick="dLogin()">Masuk</button>';
  var lv=leaves(),c={habis:0,tipis:0,aman:0},ns=0,nk=0;lv.forEach(function(b){var s=sts(b);c[s]++;if(s!="aman"){if(isK(b))nk++;else ns++}});
  var cn={stok:ns,kain:nk,order:ordW().filter(open_).length};
  $("nv").innerHTML=NV.map(function(v){return'<button class="nav'+(v[0]==view?" on":"")+'" onclick="go(\''+v[0]+'\')">'+v[1]+(cn[v[0]]?" ("+cn[v[0]]+")":"")+'</button>'}).join("");
  $("hm").style.display=view=="home"?"":"none";$("view").style.display=view=="home"?"none":"";
  $("tot").innerHTML="Workshop "+W+" · Total bahan: <b>"+S.Bahan.filter(function(b){return!b.parent&&wsOf(b)==W}).length+"</b> · "+lv.length+" item (termasuk variasi)";
  $("sum").innerHTML=[["Stok menipis",c.tipis,"var(--yel)"],["Stok habis",c.habis,"var(--red)"],["Stok aman",c.aman,"var(--grn)"],["Order berjalan",ordW().filter(open_).length,"var(--blu)"]]
    .map(function(a){return'<div class="sc" style="--c:'+a[2]+'"><small>'+a[0]+'</small><b>'+a[1]+'</b></div>'}).join("");
  var ch=function(s){return lv.filter(function(b){return sts(b)==s}).map(function(b){return'<i onclick="goItem(\''+b.id+'\')" title="Buka di Order restok">'+esc(fn(b))+" · "+esc(dn(b.divisi))+"</i>"}).join("")};
  $("alerts").innerHTML=(c.habis?'<div class="al r"><b>⚠ Stok habis ('+c.habis+')</b>'+ch("habis")+'</div>':"")+(c.tipis?'<div class="al y"><b>Stok menipis ('+c.tipis+')</b>'+ch("tipis")+'</div>':"");
  $("view").innerHTML={home:vHome,ambil:vAmbil,stok:vStok,kain:vKain,order:vOrder,alat:vAlat,lap:vLap,riwayat:vRiwayat}[view]();

  +'<div class="rw">'+(id?'<button onclick="hpA(\''+id+'\')">Hapus</button>':"")+'<button onclick="'+bk+'">Batal</button><button class="pri" onclick="svA(\''+(id||"")+'\',\''+(x.parent||"")+'\')">Simpan</button></div>')}
async function svA(id,par){var n=$("an").value.trim();if(!n)return toast("Isi nama");var pr=par?S.Alat[idx(S.Alat,par)]:null;
  var row={id:id||uid(),nama:n,jenis:"",merk:par?$("am").value:"",jumlah:1,kondisi:par?$("ak").value:"",lokasi:pr?pr.lokasi:$("al").value,servis:par?$("as").value:"",catatan:$("ac").value,tipe:par?$("at").value:"",seri:par?$("as2").value:"",parent:par};
  var r=await call("upsert",{sheet:"Alat",row:row});if(r.ok){if(pr)dAlatDet(pr.id);else if(id)dAlatDet(id);else X()}}
async function hpA(id){var it=S.Alat[idx(S.Alat,id)],pa=it&&it.parent,k=S.Alat.filter(function(x){return x.parent==id});if(confirm("Hapus data ini"+(k.length?" beserta "+k.length+" unitnya":"")+"?")){for(var i=0;i<k.length;i++)await call("del",{sheet:"Alat",id:k[i].id});await call("del",{sheet:"Alat",id:id});if(pa&&S.Alat[idx(S.Alat,pa)])dAlatDet(pa);else X()}}

refresh();render();setInterval(function(){if(!$("dlg").open&&!document.hidden)refresh()},60000);
</script>
