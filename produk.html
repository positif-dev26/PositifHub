<!doctype html>
<html lang="id" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Produk · Positif POS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#060606">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link rel="icon" type="image/png" href="icon-192.png">

<link rel="stylesheet" href="tema.css?v=20261125b">
<style>
/* ===== Menu Produk > Stok: satu kotak per varian + tahapan produksi (hanya berlaku di halaman ini) ===== */
.chsep{width:1px;height:26px;background:var(--line);align-self:center}
.chp.cprod{border-style:dashed;border-color:#4da3ff;color:#9ccaff}.chp.cprod.on{background:#4da3ff;color:#0a0a0a;border-style:solid}
.chp.ckrit{border-style:dashed;border-color:#ff6b6b;color:#ffb3b3}.chp.ckrit.on{background:#ff6b6b;color:#0a0a0a;border-style:solid}
/* --- Stok per varian v4: kartu per produk berbingkai lime, satu baris per varian, tahapan titik berwarna --- */
.sk4{--g4:12px}
.sk4h{position:sticky;top:calc(var(--hh,52px) + var(--kh,0px));z-index:5;background:var(--bg);padding:8px 0 6px;margin-bottom:8px;border-bottom:1px solid var(--line);box-shadow:0 10px 14px -12px rgba(0,0,0,.9)}
.sk4h .rh{margin:0 0 4px}.sk4h .rh h2{font-size:22px}
.lg4{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin:2px 0 6px}
.lg4 span{display:inline-flex;align-items:center;gap:5px}.lg4 i{width:9px;height:9px;border-radius:50%;display:inline-block}
.hd4,.vr4{display:grid;grid-template-columns:var(--gc);gap:var(--g4);align-items:center}
.hd4{padding:2px 18px 0;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.hd4 .r{text-align:right}
.sk4b{display:flex;flex-direction:column;gap:12px}
.pk4{border:1.5px solid var(--acc,#d4ff3f);border-radius:14px;padding:8px 6px 6px;background:var(--card)}
.ph4{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:2px 10px 8px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.ph4 h3{margin:0;font:700 20px 'Barlow Condensed',sans-serif;letter-spacing:.01em}
.ph4 small{color:var(--muted);font-size:13px}
.sm4{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px 6px;font-size:13px;color:var(--muted)}
.sm4 b{color:var(--text)}.sm4 i{font-style:normal;opacity:.5}.sm4 .bad{color:#ff6b6b}.sm4 .mid{color:#ffb84d}.sm4 .dp{color:#9ccaff}
.lnk3{background:none;border:0;padding:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}.lnk3:hover{color:var(--text)}
.vr4{padding:5px 10px;border-radius:9px;min-height:44px}
.vr4:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}
.vr4+.vr4{border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.vr4.kr{background:color-mix(in srgb,#ff6b6b 8%,transparent)}
.vw4{display:contents}.vw4 b{font-size:15px}.vw4 span{color:var(--muted)}.mu{color:var(--muted)}
.s4{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.s4 i{width:8px;height:8px;border-radius:50%;background:#5ee08a;flex:none}
.s4 b{font-size:17px;min-width:22px}
.s4 em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.s4.mid i{background:#ffb84d}.s4.mid b,.s4.mid em{color:#ffb84d}
.s4.bad i{background:#ff6b6b}.s4.bad b,.s4.bad em{color:#ff6b6b}
.pd4{min-width:0}
.pr4{display:inline-flex;align-items:center;flex-wrap:wrap;gap:3px 8px;font-size:13px}
.d4{display:inline-flex;gap:3px;margin-right:2px}.d4 i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.t4{white-space:nowrap;cursor:help}.t4 b{font-weight:700}
.nk4{color:#ff9b9b;font-size:13px;font-weight:600}
.ub4{display:flex;gap:4px;align-items:center;justify-content:flex-end}
.ub4 input{width:54px;height:34px;padding:0 8px;box-sizing:border-box;min-width:0;border-radius:8px;font-size:14px}
.ib4{width:34px;height:34px;display:inline-grid;place-items:center;padding:0;border-radius:8px;border:1px solid transparent;background:color-mix(in srgb,var(--text) 8%,transparent);color:var(--text);cursor:pointer;flex:none}
.ib4 .ico{width:16px;height:16px;stroke-width:2.4}
.ib4:hover{border-color:var(--text)}
.ib4.pri{color:var(--acc,#d4ff3f)}.ib4.pri:hover{border-color:var(--acc,#d4ff3f)}
.mo4{display:none}
/* panel ubah stok (HP) */
.sh4bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sh4{width:min(520px,100%);background:var(--card);border-radius:18px 18px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-sizing:border-box;max-height:85vh;overflow:auto}
.gr4{align-self:center;width:40px;height:4px;border-radius:4px;background:var(--line)}
.sh4h{display:flex;justify-content:space-between;align-items:center;gap:10px}.sh4h>div{display:flex;flex-direction:column;min-width:0}.sh4h b{font-size:16px}.sh4h small{color:var(--muted)}
.sh4p{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--text) 6%,transparent)}
.sh4p>small{color:var(--muted)}.sh4p div{display:flex;flex-direction:column}.sh4p div small{color:var(--muted);font-size:12px}
.sh4l{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:13px}.sh4l input{height:46px;font-size:18px}
.sh4b{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sh4b .btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px}.sh4b .btn:last-child{grid-column:span 2}
.sh4>.lnk3{align-self:center;padding:6px}
@media(max-width:860px){
 .sk2 .bar.chr{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
 .sk2 .bar.chr::-webkit-scrollbar{display:none}.sk2 .bar.chr>*{flex:none}
 .hd4{display:none}
 .sk4h .rh h2{font-size:19px}
 .ph4{padding:2px 6px 8px}.sm4{margin-left:0;width:100%;font-size:12px}
 .vr4{grid-template-columns:72px minmax(0,1fr) auto;grid-template-areas:"w s m" "w p m";gap:2px 10px;padding:7px 6px}
 .vw4{display:flex;flex-direction:column;grid-area:w;line-height:1.25}.vw4 span{font-size:12px}
 .s4{grid-area:s}.pd4{grid-area:p}.pd4:empty{display:none}
 .pr4{font-size:12px}
 .ub4{display:none}
 .mo4{grid-area:m;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:10px;border:0;background:color-mix(in srgb,var(--text) 8%,transparent);color:var(--text);cursor:pointer;padding:0}
}
.nbar{display:none}
/* ===== HP: Stok lebih lega (tampilan desktop tidak tersentuh) ===== */
@media(max-width:860px){
 /* header (judul, cari, filter) dan sub-header tidak menempel lagi: layar dipakai untuk isi */
 #pbody .sk2{position:static!important}
 .sk4h{position:static;background:transparent;border-bottom:0;box-shadow:none;padding:4px 0 0;margin-bottom:12px}
 .lg4{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch;gap:14px;margin:4px 0 2px}
 .lg4::-webkit-scrollbar{display:none}.lg4 span{flex:none}
 /* kartu produk: bingkai tipis, sudut bulat, ruang dalam lebih besar */
 .sk4b{gap:16px}
 .pk4{border:1px solid color-mix(in srgb,var(--acc,#d4ff3f) 40%,transparent);border-radius:20px;padding:16px 14px 8px}
 .ph4{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 12px;padding:0 4px 14px;margin-bottom:4px}
 .ph4 h3{grid-column:1;grid-row:1;font-size:22px;line-height:1.15}
 .ph4 .lnk3{grid-column:2;grid-row:1}
 .ph4>small{grid-column:1/-1;grid-row:2;font-size:13px}
 .ph4 .sm4{grid-column:1/-1;grid-row:3;margin:2px 0 0;width:auto;font-size:13px;gap:4px 8px}
 /* baris varian: lebih tinggi, ukuran & jumlah lebih jelas */
 .vr4{grid-template-columns:84px minmax(0,1fr) auto;gap:6px 12px;padding:12px 4px;min-height:64px;border-radius:12px}
 .vr4+.vr4{border-top:1px solid color-mix(in srgb,var(--line) 45%,transparent)}
 .vw4 b{font-size:16px}.vw4 span{font-size:13px}
 .s4 b{font-size:19px}
 .pr4{font-size:12.5px;gap:4px 10px}
 /* nama produk menempel di bawah nav saat judul kartu tergulung */
 .nbar.on{display:block;position:fixed;left:0;right:0;height:30px;line-height:30px;padding:0 20px;z-index:6;font:600 13px/30px Barlow,sans-serif;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--acc,#d4ff3f);background:color-mix(in srgb,var(--acc,#d4ff3f) 10%,var(--card));border-bottom:1px solid color-mix(in srgb,var(--acc,#d4ff3f) 40%,transparent);box-shadow:0 6px 10px -8px rgba(0,0,0,.7)}
}
</style>
</head>
<body>
<header class="noprint"><h1 style="margin:0;line-height:0"><img id="lg" class="logo" alt="Positif Clothing" title="POS" onclick="go('beranda')"></h1><nav id="nav"></nav><span id="clk" class="clk"></span><span id="sync" class="muted" style="font-size:13px;cursor:pointer" onclick="syncNow()" title="Klik untuk sinkron sekarang"></span><span id="acc"></span></header>
<main id="view"></main>
<div id="modal" class="modal"><div class="card"><div id="rc" class="rc"></div>
<div class="row noprint"><button class="btn sec" onclick="closeM()">Tutup</button><select id="rw" onchange="setRW(this.value)" title="Lebar kertas"><option value="58">58 mm</option><option value="80">80 mm</option><option value="100">100 mm</option></select><button class="btn" onclick="printRc()">Cetak struk</button></div></div></div>
<div id="pk" class="modal" onclick="if(event.target===this)closePk()"><div class="card wide" id="pkc"></div></div>
<div id="pm" class="modal" onclick="if(event.target===this)closePm()"><div class="card wide" id="pmc"></div></div>
<div id="ed" class="modal" onclick="if(event.target===this)edClose()"><div class="card wide mf" id="edc" style="width:min(1100px,100%)"></div></div>
<div class="hubmenu" id="accm" role="menu"></div>
<div id="hm" class="modal" onclick="if(event.target===this)closeHm()"><div class="card wide mf" id="hmc"></div></div>
<div id="zm" class="modal" onclick="if(event.target===this)zClose()"><div class="card wide" id="zmc"></div></div>
<div id="plabels"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script>window.PAGE_TABS=["produk", "stok"];window.PAGE_HOME="produk";</script>
<script src="inti.js?v=20261126a"></script>
<script>
/* ---------- PRODUK & VARIAN ---------- */
 const addForm=()=>`<div>
 <div class="form"><input id="n" placeholder="Nama (cth: Kaos Polos)"><input id="c" placeholder="Kategori" list="cl"><datalist id="cl">${cats().slice(1).map(c=>`<option value="${esc(c)}">`).join('')}</datalist><input id="pr" type="text" inputmode="numeric" data-n placeholder="Harga dasar"><input id="co" placeholder="Warna, pisahkan koma (opsional)"><input id="sz" placeholder="Ukuran, cth: S,M,L,XL (opsional)"><button class="btn" onclick="addP()">Buat produk dan varian</button></div>
 <p class="muted" style="margin:0 0 8px">Setiap kombinasi warna dan ukuran menjadi satu varian dengan foto, barcode, harga, dan stok sendiri. Barcode varian baru otomatis sama dengan ID varian.</p></div>`;
 const pEd=p=>`<div><div class="form"><input value="${esc(p.name)}" onchange="updP(${p.id},'name',this.value)" aria-label="Nama produk"><input value="${esc(p.cat)}" onchange="updP(${p.id},'cat',this.value)" aria-label="Kategori"><input type="text" inputmode="numeric" data-n value="${p.price}" onchange="updP(${p.id},'price',+this.value)" aria-label="Harga dasar"><button class="btn sec" onclick="addVar(${p.id})">+ Varian</button><button class="btn sec" onclick="printBC(${p.id})">Cetak semua label</button></div>
 <div class="scroll"><table><tr><th>Foto</th><th>Warna</th><th>Ukuran</th><th>Barcode</th><th>Harga (kosong = dasar)</th><th>Stok</th><th></th></tr>
 ${p.variants.map(v=>`<tr><td><label class="thumb" title="Klik untuk mengganti foto">${v.img?`<img src="${v.img}" alt="">`:'+ Foto'}<input type="file" accept="image/*" hidden onchange="setImg(${v.id},this)"></label>${v.img?`<button class="lnk" onclick="delImg(${v.id})">Hapus foto</button>`:''}</td><td><input value="${esc(v.color)}" onchange="updV(${v.id},'color',this.value)"></td><td><input value="${esc(v.size)}" onchange="updV(${v.id},'size',this.value)"></td><td><input value="${esc(v.barcode||'')}" placeholder="${v.id}" onchange="setBC(${v.id},this.value)"></td><td><input type="text" inputmode="numeric" data-n value="${v.price||''}" placeholder="${nf(p.price)}" onchange="updV(${v.id},'price',+this.value)"></td><td><input type="text" inputmode="numeric" data-n value="${v.stock}" onchange="updV(${v.id},'stock',+this.value)"></td><td style="white-space:nowrap"><button class="btn sec" style="padding:4px 8px;margin-right:4px" onclick="printBC(${p.id},${v.id})">Cetak label</button><button class="x" style="width:34px;padding:0" title="Hapus varian" onclick="delV(${v.id})" aria-label="Hapus varian"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15M10 7V4.5h4V7M6.5 7l.9 12.5h9.2L17.5 7"/></svg></button></td></tr>`).join('')}</table></div></div>`;
let ed=null,addOpen=false,pfq='',pfc='Semua';
/* ---------- MENU PRODUK (gabungan Produk + Stok Produk) ----------
   Sub menu kiri (HP: bawah): Stok · Katalog · Barcode · Riwayat · Atur */
let psub='stok';
const PSUB=[['stok','Stok','box','Stok produk'],['katalog','Katalog','shirt','Katalog produk'],['barcode','Barcode','barcode','Cetak barcode'],['riwayat','Riwayat','history','Riwayat stok'],['atur','Atur','sliders','Pengaturan stok']];
const psOk=k=>k==='katalog'?(can('produk_edit')||can('harga_edit')):k==='barcode'?(can('produk_edit')||can('stok_ubah')):k==='atur'?can('pengaturan'):(can('stok_ubah')||can('kasir')||can('produk_edit'));
function vProduk(){if(window.PSUB_REQ){psub=window.PSUB_REQ;window.PSUB_REQ=''}if(!psOk(psub))psub=(PSUB.find(x=>psOk(x[0]))||['stok'])[0];
 $('view').classList.toggle('fit',psub==='katalog'&&innerWidth>860);sdmClose();
 $('view').innerHTML='<div class="prod"><div class="ptabs rl">'+PSUB.filter(x=>psOk(x[0])).map(([k,l,i,t])=>'<button class="'+(k===psub?'on':'')+'" title="'+t+'" aria-label="'+t+'" onclick="psGo(\''+k+'\')">'+IC(i)+'<span>'+l+'</span></button>').join('')+'</div><div id="pbody"></div></div>';
 ({stok:stokNow,katalog:katalogView,barcode:barcodeView,riwayat:stokLog,atur:aturView})[psub]();stk()}
function psGo(k){psub=k;vProduk();scrollTo(0,0)}
function vStok(){vProduk()}
function katalogView(){
 $('pbody').innerHTML=`<div class="pfh"><h1 class="pt">Katalog produk</h1></div><div class="bar fn"><input id="pfq" placeholder="Cari produk atau varian..." value="${esc(pfq)}" oninput="pfq=this.value;pgrid()" autocomplete="off"><label class="si${pfc!=='Semua'?' act':''}" title="Filter kategori">${IC('filter')}<select aria-label="Filter kategori" onchange="pfc=this.value;this.parentNode.classList.toggle('act',pfc!=='Semua');pgrid()">${cats().map(c=>`<option ${c===pfc?'selected':''}>${esc(c)}</option>`).join('')}</select></label><button class="btn" title="Tambah produk" aria-label="Tambah produk" onclick="addOpen=true;psub='katalog';vProduk()">+<span class="hm"> Tambah produk</span></button></div><div id="pgrid" class="grid fs"></div>`;
 pgrid();edShow()}
function edFromStok(id){psub='katalog';vProduk();edP(id)}
function pgrid(){const ql=pfq.toLowerCase(),l=S.products.filter(p=>(pfc==='Semua'||p.cat===pfc)&&(!ql||p.name.toLowerCase().includes(ql)||p.variants.some(v=>vl(v).toLowerCase().includes(ql)||bcv(v).includes(pfq))));
 $('pgrid').innerHTML=l.length?l.map(p=>{const im=(p.variants.find(v=>v.img)||{}).img,iv=(p.variants.find(v=>v.img)||{}).id,st=p.variants.reduce((a,v)=>a+v.stock,0),n=p.variants.length,pr=p.variants.map(v=>vp(p,v)),lo=pr.length?Math.min(...pr):p.price;
  return `<button class="p" onclick="edP(${p.id})">${im?`<img src="${im}" alt="">`+zb(p.id,iv):''}<b>${esc(p.name)}</b><small>${n>1?n+' varian, ':''}${st>=9999?'jasa':'stok '+st}</small><span class="num">${pr.length&&Math.max(...pr)!==lo?'mulai ':''}${rp(lo)}</span></button>`}).join(''):'<p class="muted">Produk tidak ditemukan.</p>'}
function edP(id){DR={snap:JSON.stringify(S.products.find(p=>p.id===id)),log:(S.log||[]).slice()};ed=id;edShow()}
async function edClose(){if(DR){const i=S.products.findIndex(x=>x.id===ed);if(i>=0&&JSON.stringify(S.products[i])!==DR.snap){if(!(await askC('Buang perubahan yang belum disimpan?','Buang')))return;S.products[i]=JSON.parse(DR.snap);S.log=DR.log}}DR=null;ed=null;addOpen=false;vProduk()}
function edSave(){DR=null;save();ed=null;addOpen=false;vProduk()}
function edShow(){const m=$('ed');if(!m)return;if(addOpen){$('edc').innerHTML='<div class="row fn" style="margin-top:0"><h2 style="margin:0;font-size:24px">Tambah produk</h2><button class="btn sec" onclick="addOpen=false;vProduk()">Tutup</button></div><div class="fs">'+addForm()+'</div>';m.classList.add('on');return}const p=S.products.find(x=>x.id===ed);if(!p){ed=null;m.classList.remove('on');return}
 const h=pEd(p),i=h.indexOf('<div class="scroll">'),top=h.slice(5,i),rest=h.slice(i,h.lastIndexOf('</div>'));
 $('edc').innerHTML='<div class="fn" style="margin:0 0 8px"><h2 style="margin:0;font-size:24px">Edit produk</h2></div><div class="fn">'+top+'</div><div class="fs" style="margin-top:8px">'+rest+'</div><div class="fn ed-ft"><button class="btn sec" onclick="delP('+p.id+')">Hapus produk</button><span style="display:flex;gap:8px"><button class="btn sec" onclick="edClose()">Batal</button><button class="btn" id="edsv" onclick="edSave()">Simpan</button></span></div>';
 const sv=$('edsv');if(sv)sv.disabled=!DR||JSON.stringify(p)===DR.snap;
 m.classList.add('on')}
function addP(){const n=$('n').value.trim(),pr=+$('pr').value;if(!n||!pr){alert('Isi nama dan harga dasar produk.');return}
 const L=s=>s.split(',').map(x=>x.trim()).filter(Boolean),co=L($('co').value),sz=L($('sz').value);
 S.products.unshift({id:nid(),name:n,cat:$('c').value.trim()||'Umum',price:pr,variants:(co.length?co:['']).flatMap(c=>(sz.length?sz:['']).map(s=>{const id=nid();return{id,color:c,size:s,barcode:String(id),img:null,stock:0,price:0}}))});save();addOpen=false;render()}
function updP(id,k,v){S.products.find(p=>p.id===id)[k]=v;save()}
function addVar(pid){const nv=nid();S.products.find(p=>p.id===pid).variants.push({id:nv,color:'',size:'',barcode:String(nv),img:null,stock:0,price:0});save();render()}
async function delP(id){if(await askC('Hapus produk beserta semua variannya?','Hapus produk')){const pp=S.products.find(p=>p.id===id);pp.variants.forEach(v=>logS({p:pp,v},'Hapus',v.stock,0,'Produk dihapus'));DR=null;S.products=S.products.filter(p=>p.id!==id);save();render()}}
async function delV(id){const p=findV(id).p;if(p.variants.length<2){alert('Produk harus punya minimal satu varian. Hapus produknya jika tidak dipakai.');return}
 if(await askC('Hapus varian ini?')){const x=findV(id);logS(x,'Hapus',x.v.stock,0,'Varian dihapus');p.variants=p.variants.filter(v=>v.id!==id);save();render()}}
function updV(id,k,val){const x=findV(id);if(k==='stock'){const b=x.v.stock;x.v.stock=val;if(b!==val)logS(x,'Ubah',b,val,'Diubah di menu Produk')}else x.v[k]=val;save()}
function setBC(id,val){val=val.trim();if(val&&allV().some(x=>x.v.id!==id&&x.v.barcode===val)){alert('Barcode sudah dipakai varian lain.');render();return}findV(id).v.barcode=val;save()}

   Hanya tampil untuk akun yang boleh melihat produksi (data order produksi hanya dikirim ke akun itu). */
const PST=[['rencana','Rencana','#94a3b8','#cbd5e1'],['cetak','Cetak','#4da3ff','#9ccaff'],['bahan','Rak bahan','#a78bfa','#c4b5fd'],['cutting','Cutting','#ff9f43','#ffb877'],['jahit','Jahit','#f472b6','#f9a8d4'],['finishing','Finishing','#2dd4bf','#5fe3d1']];

/* idVarian -> {tot, cetak:{q,late,tip[]}, ...}. Batas hari per tahap ikut Pengaturan produksi. */
function prodMap(){const M={};if(!canProd())return M;
 const cf=(S.jobs||[]).find(j=>j.id==='pcfg')||{};let lim={};try{lim=typeof cf.lim==='string'?JSON.parse(cf.lim):(cf.lim||{})}catch(e){lim={}}lim=Object.assign({},PLIM,lim||{});
 const now=Date.now(),fd=d=>new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'});
 (S.jobs||[]).forEach(j=>{const st=j.stage==='cetak'&&+j.rc===1?'rencana':j.stage;if(!PLIM[st])return;
  const hs=j.hist||[],h=hs.slice().reverse().find(x=>x&&!x.kind)||hs[0]||{date:j.date},age=Math.max(0,Math.floor((now-new Date(h.date||j.date))/864e5)),l=+lim[st]||99;
  const lewat=!!j.due&&new Date(j.due+'T23:59')<now,late=age>=l||lewat;
  (j.items||[]).forEach(it=>{const q=+it.qty||0;if(q<=0)return;const m=M[it.vid]=M[it.vid]||{tot:0},s=m[st]=m[st]||{q:0,late:false,tip:[]};
   s.q+=q;m.tot+=q;if(late)s.late=true;
   s.tip.push((j.no||'Order')+': '+q+' pcs · '+age+' hari'+(l<99?' (batas '+l+')':'')+(j.vendor?' · '+j.vendor:'')+(j.due?' · butuh '+fd(j.due):'')+(lewat?' · LEWAT TANGGAL BUTUH':age>=l?' · TERTAHAN':''))})});
 return M}

 <div class="bar chr">${chip('all','Semua',tr.length)}${chip('low','Menipis',lo)}${chip('out','Habis',ou)}${chip('ok','Aman',ok)}${cp?'<span class="chsep"></span>'+chip('prod','Sedang diproduksi',np,'cprod')+chip('krit','Kritis tanpa restok',nk,'ckrit'):''}</div>
 <div class="bar chr">${cchip('Semua',-1,'Semua jenis',tr.reduce((a,x)=>a+x.v.stock,0))}${SCN.map((n,i)=>cchip(n,i,n,cm[n])).join('')}</div></div>

function doPrint(){
 if(!window.JsBarcode){alert('Pustaka barcode belum termuat. Periksa koneksi internet lalu muat ulang halaman.');return}
 const p=S.products.find(x=>x.id===PB.pid),[w,h]=PB.size.split('x').map(Number);let html='',n=0;const tot=p.variants.reduce((a,v)=>a+(PB.q[v.id]||0),0);if(tot>500){alert('Maksimal 500 label sekali cetak. Sekarang '+tot+' label, kurangi jumlahnya.');return}try{localStorage.setItem('positif_pb',JSON.stringify({size:PB.size,price:PB.price,single:PB.single}))}catch(e){}
 p.variants.forEach(v=>{const c=PB.q[v.id]||0;for(let i=0;i<c&&n<500;i++,n++)html+=`<div class="lb" style="width:${w}mm;height:${h}mm"><div class="ln">${esc(p.name)}</div><div class="lv">${esc(vl(v))}</div><svg class="bcs" style="max-height:${(h*.42).toFixed(1)}mm" data-c="${esc(bcv(v))}"></svg>${PB.price?`<div class="lp">${rp(vp(p,v))}</div>`:''}</div>`});
 if(!n){alert('Isi jumlah label yang akan dicetak.');return}
 const box=$('plabels');box.innerHTML=html;
 box.querySelectorAll('svg.bcs').forEach(s=>{try{JsBarcode(s,s.dataset.c,{format:'CODE128',width:2,height:h>=40?40:30,displayValue:true,fontSize:12,margin:0});
  if(!s.getAttribute('viewBox'))s.setAttribute('viewBox','0 0 '+parseFloat(s.getAttribute('width'))+' '+parseFloat(s.getAttribute('height')))}catch(e){s.outerHTML='<div class="lv">'+esc(s.dataset.c)+'</div>'}});
 const st=document.createElement('style');st.id='pgs';st.textContent=PB.single?`@page{size:${w}mm ${h}mm;margin:0}.lb{page-break-after:always}.lb:last-child{page-break-after:auto}`:'@page{margin:6mm}';document.head.appendChild(st);
 document.body.classList.add('print-labels');closePm();
 const done=()=>{document.body.classList.remove('print-labels');const s=$('pgs');if(s)s.remove();window.removeEventListener('afterprint',done);document.removeEventListener('pointerdown',done,true)};
 window.addEventListener('afterprint',done);document.addEventListener('pointerdown',done,true);setTimeout(()=>window.print(),150)}
boot();
</script></body></html>
