<style>
/* ===== Menu Produk > Stok: satu kotak per varian + tahapan produksi (hanya berlaku di halaman ini) ===== */
.chsep{width:1px;height:26px;background:var(--line);align-self:center}
.chp.cprod{border-style:dashed;border-color:#4da3ff;color:#9ccaff}.chp.cprod.on{background:#4da3ff;color:#0a0a0a;border-style:solid}
.chp.ckrit{border-style:dashed;border-color:#ff6b6b;color:#ffb3b3}.chp.ckrit.on{background:#ff6b6b;color:#0a0a0a;border-style:solid}
.sk3 .rh{margin-top:4px}
.sk3s{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.sk3w{display:flex;flex-direction:column;gap:8px;min-width:var(--mw,600px)}
.sk3 .hd3,.sk3 .ph3,.sk3 .vr3{display:grid;grid-template-columns:var(--gc);gap:14px;align-items:center;padding:10px 16px}
.sk3 .hd3{padding-top:0;padding-bottom:0;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sk3 .hd3 .r,.sk3 .q{text-align:right}
.sk3 .ph3{margin-top:8px;border-radius:12px;background:color-mix(in srgb,var(--text) 7%,var(--card))}
.sk3 .pn3{grid-column:span 4;min-width:0}.sk3 .pn3 b{display:block;font-size:16px}.sk3 .pn3 small{color:var(--muted);font-size:13px}
.sk3 .lnk3{background:none;border:0;padding:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}.sk3 .lnk3:hover{color:var(--text)}
.sk3 .tt{font-size:13px}
.sk3 .vr3{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.sk3 .vr3.kr{border:1px dashed #ff6b6b;background:color-mix(in srgb,#ff6b6b 9%,var(--card))}
.sk3 .vr3 .v{font-size:16px}.sk3 .mu{color:var(--muted)}
.sk3 .q{font-size:18px}.sk3 .q.mid2{color:#e8a734}.sk3 .q.bad{color:var(--bad)}
.sk3 .tp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}

.sk3 .tp .bad i.on{background:#ff6b6b}.sk3 .tp .bad span.on{color:#ff8a80}

.sk3 .ub{display:flex;gap:6px;align-items:center}

.sk3 .ib3{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:58px;height:48px;padding:0;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font:600 11px Barlow,sans-serif;cursor:pointer;flex:none}

<script>
/* ---------- PRODUK & VARIAN ---------- */
 const addForm=()=>`<div>
 <div class="form"><input id="n" placeholder="Nama (cth: Kaos Polos)"><input id="c" placeholder="Kategori" list="cl"><datalist id="cl">${cats().slice(1).map(c=>`<option value="${esc(c)}">`).join('')}</datalist><input id="pr" type="text" inputmode="numeric" data-n placeholder="Harga dasar"><input id="co" placeholder="Warna, pisahkan koma (opsional)"><input id="sz" placeholder="Ukuran, cth: S,M,L,XL (opsional)"><button class="btn" onclick="addP()">Buat produk dan varian</button></div>
 <p class="muted" style="margin:0 0 8px">Setiap kombinasi warna dan ukuran menjadi satu varian dengan foto, barcode, harga, dan stok sendiri. Barcode varian baru otomatis sama dengan ID varian.</p></div>`;
 const pEd=p=>`<div><div class="form"><input value="${esc(p.name)}" onchange="updP(${p.id},'name',this.value)" aria-label="Nama produk"><input value="${esc(p.cat)}" onchange="updP(${p.id},'cat',this.value)" aria-label="Kategori"><input type="text" inputmode="numeric" data-n value="${p.price}" onchange="updP(${p.id},'price',+this.value)" aria-label="Harga dasar"><button class="btn sec" onclick="addVar(${p.id})">+ Varian</button><button class="btn sec" onclick="printBC(${p.id})">Cetak semua label</button></div>
 <div class="scroll"><table><tr><th>Foto</th><th>Warna</th><th>Ukuran</th><th>Barcode</th><th>Harga (kosong = dasar)</th><th>Stok</th><th></th></tr>
 ${p.variants.map(v=>`<tr><td><label class="thumb" title="Klik untuk mengganti foto">${v.img?`<img src="${v.img}" alt="">`:'+ Foto'}<input type="file" accept="image/*" hidden onchange="setImg(${v.id},this)"></label>${v.img?`<button class="lnk" onclick="delImg(${v.id})">Hapus foto</button>`:''}</td><td><input value="${esc(v.color)}" onchange="updV(${v.id},'color',this.value)"></td><td><input value="${esc(v.size)}" onchange="updV(${v.id},'size',this.value)"></td><td><input value="${esc(v.barcode||'')}" placeholder="${v.id}" onchange="setBC(${v.id},this.value)"></td><td><input type="text" inputmode="numeric" data-n value="${v.price||''}" placeholder="${nf(p.price)}" onchange="updV(${v.id},'price',+this.value)"></td><td><input type="text" inputmode="numeric" data-n value="${v.stock}" onchange="updV(${v.id},'stock',+this.value)"></td><td style="white-space:nowrap"><button class="btn sec" style="padding:4px 8px;margin-right:4px" onclick="printBC(${p.id},${v.id})">Cetak label</button><button class="x" style="width:34px;padding:0" title="Hapus varian" onclick="delV(${v.id})" aria-label="Hapus varian"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14M10 11v6M14 11v6"/></svg></button></td></tr>`).join('')}</table></div></div>`;
let ed=null,addOpen=false,pfq='',pfc='Semua';
/* ---------- MENU PRODUK (gabungan Produk + Stok Produk) ----------
   Sub menu kiri (HP: bawah): Stok · Katalog · Barcode · Riwayat · Atur */
let psub='stok';
const PSUB=[['stok','Stok','box','Stok produk'],['katalog','Katalog','shirt','Katalog produk'],['barcode','Barcode','barcode','Cetak barcode'],['riwayat','Riwayat','history','Riwayat stok'],['atur','Atur','sliders','Pengaturan stok']];
const psOk=k=>k==='katalog'?(can('produk_edit')||can('harga_edit')):k==='barcode'?(can('produk_edit')||can('stok_ubah')):k==='atur'?can('pengaturan'):(can('stok_ubah')||can('kasir')||can('produk_edit'));
function vProduk(){if(window.PSUB_REQ){psub=window.PSUB_REQ;window.PSUB_REQ=''}if(!psOk(psub))psub=(PSUB.find(x=>psOk(x[0]))||['stok'])[0];
 $('view').classList.toggle('fit',psub==='katalog'&&innerWidth>860);sdmClose();
 $('view').innerHTML='<div class="prod"><div class="ptabs rl">'+PSUB.filter(x=>psOk(x[0])).map(([k,l,i,t])=>'<button class="'+(k===psub?'on':'')+'" title="'+t+'" aria-label="'+t+'" onclick="psGo(\''+k+'\')">'+IC(i)+'<span>'+l+'</span></button>').join('')+'</div><div id="pbody"></div></div>';
 ({stok:stokNow,katalog:katalogView,barcode:barcodeView,riwayat:stokLog,atur:aturView})[psub]();stk()}
function psGo(k){psub=k;vProduk();scrollTo(0,0)}
function vStok(){vProduk()}
function katalogView(){
 $('pbody').innerHTML=`<div class="pfh"><h1 class="pt">Katalog produk</h1></div><div class="bar fn"><input id="pfq" placeholder="Cari produk atau varian..." value="${esc(pfq)}" oninput="pfq=this.value;pgrid()" autocomplete="off"><label class="si${pfc!=='Semua'?' act':''}" title="Filter kategori">${IC('filter')}<select aria-label="Filter kategori" onchange="pfc=this.value;this.parentNode.classList.toggle('act',pfc!=='Semua');pgrid()">${cats().map(c=>`<option ${c===pfc?'selected':''}>${esc(c)}</option>`).join('')}</select></label><button class="btn" title="Tambah produk" aria-label="Tambah produk" onclick="addOpen=true;psub='katalog';vProduk()">+<span class="hm"> Tambah produk</span></button></div><div id="pgrid" class="grid fs"></div>`;
 pgrid();edShow()}
function edFromStok(id){psub='katalog';vProduk();edP(id)}
function pgrid(){const ql=pfq.toLowerCase(),l=S.products.filter(p=>(pfc==='Semua'||p.cat===pfc)&&(!ql||p.name.toLowerCase().includes(ql)||p.variants.some(v=>vl(v).toLowerCase().includes(ql)||bcv(v).includes(pfq))));
 $('pgrid').innerHTML=l.length?l.map(p=>{const im=(p.variants.find(v=>v.img)||{}).img,iv=(p.variants.find(v=>v.img)||{}).id,st=p.variants.reduce((a,v)=>a+v.stock,0),n=p.variants.length,pr=p.variants.map(v=>vp(p,v)),lo=pr.length?Math.min(...pr):p.price;
  return `<button class="p" onclick="edP(${p.id})">${im?`<img src="${im}" alt="">`+zb(p.id,iv):''}<b>${esc(p.name)}</b><small>${n>1?n+' varian, ':''}${st>=9999?'jasa':'stok '+st}</small><span class="num">${pr.length&&Math.max(...pr)!==lo?'mulai ':''}${rp(lo)}</span></button>`}).join(''):'<p class="muted">Produk tidak ditemukan.</p>'}
function edP(id){DR={snap:JSON.stringify(S.products.find(p=>p.id===id)),log:(S.log||[]).slice()};ed=id;edShow()}
async function edClose(){if(DR){const i=S.products.findIndex(x=>x.id===ed);if(i>=0&&JSON.stringify(S.products[i])!==DR.snap){if(!(await askC('Buang perubahan yang belum disimpan?','Buang')))return;S.products[i]=JSON.parse(DR.snap);S.log=DR.log}}DR=null;ed=null;addOpen=false;vProduk()}
function edSave(){DR=null;save();ed=null;addOpen=false;vProduk()}
function edShow(){const m=$('ed');if(!m)return;if(addOpen){$('edc').innerHTML='<div class="row fn" style="margin-top:0"><h2 style="margin:0;font-size:24px">Tambah produk</h2><button class="btn sec" onclick="addOpen=false;vProduk()">Tutup</button></div><div class="fs">'+addForm()+'</div>';m.classList.add('on');return}const p=S.products.find(x=>x.id===ed);if(!p){ed=null;m.classList.remove('on');return}
 const h=pEd(p),i=h.indexOf('<div class="scroll">'),top=h.slice(5,i),rest=h.slice(i,h.lastIndexOf('</div>'));
 $('edc').innerHTML='<div class="fn" style="margin:0 0 8px"><h2 style="margin:0;font-size:24px">Edit produk</h2></div><div class="fn">'+top+'</div><div class="fs" style="margin-top:8px">'+rest+'</div><div class="fn ed-ft"><button class="btn sec" onclick="delP('+p.id+')">Hapus produk</button><span style="display:flex;gap:8px"><button class="btn sec" onclick="edClose()">Batal</button><button class="btn" id="edsv" onclick="edSave()">Simpan</button></span></div>';
 const sv=$('edsv');if(sv)sv.disabled=!DR||JSON.stringify(p)===DR.snap;
 m.classList.add('on')}
function addP(){const n=$('n').value.trim(),pr=+$('pr').value;if(!n||!pr){alert('Isi nama dan harga dasar produk.');return}
 const L=s=>s.split(',').map(x=>x.trim()).filter(Boolean),co=L($('co').value),sz=L($('sz').value);
 S.products.unshift({id:nid(),name:n,cat:$('c').value.trim()||'Umum',price:pr,variants:(co.length?co:['']).flatMap(c=>(sz.length?sz:['']).map(s=>{const id=nid();return{id,color:c,size:s,barcode:String(id),img:null,stock:0,price:0}}))});save();addOpen=false;render()}
function updP(id,k,v){S.products.find(p=>p.id===id)[k]=v;save()}
function addVar(pid){const nv=nid();S.products.find(p=>p.id===pid).variants.push({id:nv,color:'',size:'',barcode:String(nv),img:null,stock:0,price:0});save();render()}
async function delP(id){if(await askC('Hapus produk beserta semua variannya?','Hapus produk')){const pp=S.products.find(p=>p.id===id);pp.variants.forEach(v=>logS({p:pp,v},'Hapus',v.stock,0,'Produk dihapus'));DR=null;S.products=S.products.filter(p=>p.id!==id);save();render()}}
async function delV(id){const p=findV(id).p;if(p.variants.length<2){alert('Produk harus punya minimal satu varian. Hapus produknya jika tidak dipakai.');return}
 if(await askC('Hapus varian ini?')){const x=findV(id);logS(x,'Hapus',x.v.stock,0,'Varian dihapus');p.variants=p.variants.filter(v=>v.id!==id);save();render()}}
function updV(id,k,val){const x=findV(id);if(k==='stock'){const b=x.v.stock;x.v.stock=val;if(b!==val)logS(x,'Ubah',b,val,'Diubah di menu Produk')}else x.v[k]=val;save()}
function setBC(id,val){val=val.trim();if(val&&allV().some(x=>x.v.id!==id&&x.v.barcode===val)){alert('Barcode sudah dipakai varian lain.');render();return}findV(id).v.barcode=val;save()}
function setImg(id,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let m=640,u='';for(let t=0;t<8;t++){const s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);for(const q of[.8,.7,.6,.5]){u=c.toDataURL('image/jpeg',q);if(u.length<=45000)break}if(u.length<=45000)break;m=Math.round(m*.85)}findV(id).v.img=u;save();render()};im.src=r.result};r.readAsDataURL(f)}
/* ---------- STOK PERSEDIAAN ---------- */
let sf='all',sq='',lt='all';
const srow=v=>{const s=stt(v);return s==='Habis'?'st-bad':s==='Menipis'?'st-mid':''};
function setLow(v){const n=parseInt(v);if(!(n>=1)){alert('Isi batas stok menipis dengan angka 1 atau lebih.');return}S.low=n;save();toast('Batas stok menipis: '+n+' unit');vProduk()}
let sc='Semua',ssel=0,SCN=[];
const pcat=p=>String(p.cat||'').trim()||'Lainnya';
const CI=n=>/stiker|sticker/i.test(n)?'sticker':/jersey|kaos|baju|kemeja|jaket|polo|hoodie|seragam|celana/i.test(n)?'shirt':'box';
const cvl=v=>{const s=stt(v);return s==='Habis'?'bad':s==='Menipis'?'mid2':''};
/* ---------- STOK PRODUK: satu kotak per varian + tahapan produksi ----------
   Urutan kolom: Variasi · Warna · Status · Stok · Tahapan produksi · Tambah / Kurangi / Ubah jadi
   Tahapan diambil dari order produksi yang masih berjalan (Cetak vendor s.d. Finishing).
   Hanya tampil untuk akun yang boleh melihat produksi (data order produksi hanya dikirim ke akun itu). */
const PST=[['cetak','Cetak','#4da3ff','#9ccaff'],['bahan','Rak bahan','#a78bfa','#c4b5fd'],['cutting','Cutting','#ff9f43','#ffb877'],['jahit','Jahit','#f472b6','#f9a8d4'],['finishing','Finishing','#2dd4bf','#5fe3d1']];
const PLIM={cetak:7,bahan:3,cutting:2,jahit:3,finishing:2};
const canProd=()=>can('prod_lihat')||can('prod_buat');
/* idVarian -> {tot, cetak:{q,late,tip[]}, ...}. Batas hari per tahap ikut Pengaturan produksi. */
function prodMap(){const M={};if(!canProd())return M;
 const cf=(S.jobs||[]).find(j=>j.id==='pcfg')||{};let lim={};try{lim=typeof cf.lim==='string'?JSON.parse(cf.lim):(cf.lim||{})}catch(e){lim={}}lim=Object.assign({},PLIM,lim||{});
 const now=Date.now(),fd=d=>new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'});
 (S.jobs||[]).forEach(j=>{const st=j.stage;if(!PLIM[st])return;
  const hs=j.hist||[],h=hs.slice().reverse().find(x=>x&&!x.kind)||hs[0]||{date:j.date},age=Math.max(0,Math.floor((now-new Date(h.date||j.date))/864e5)),l=+lim[st]||99;
  const lewat=!!j.due&&new Date(j.due+'T23:59')<now,late=age>=l||lewat;
  (j.items||[]).forEach(it=>{const q=+it.qty||0;if(q<=0)return;const m=M[it.vid]=M[it.vid]||{tot:0},s=m[st]=m[st]||{q:0,late:false,tip:[]};
   s.q+=q;m.tot+=q;if(late)s.late=true;
   s.tip.push((j.no||'Order')+': '+q+' pcs · '+age+' hari (batas '+l+')'+(j.vendor?' · '+j.vendor:'')+(j.due?' · butuh '+fd(j.due):'')+(lewat?' · LEWAT TANGGAL BUTUH':age>=l?' · TERTAHAN':''))})});
 return M}
/* lima garis tahapan; tip=false untuk baris total produk */
function tahapH(m,tip){return '<div class="tp">'+PST.map(([k,l,c,t])=>{const s=m&&m[k],q=s?s.q:0;
 if(!q)return '<div><i></i><span>'+l+'</span></div>';
 return '<div'+(tip&&s.tip?' title="'+esc(s.tip.join('\n'))+'"':'')+(s.late?' class="bad"':'')+' style="--c:'+c+';--t:'+t+'"><i class="on"></i><span class="on">'+(s.late?'&#9888; ':'')+l+' '+nf(q)+'</span></div>'}).join('')+'</div>'}
const sbtn=(id,k,ic,l)=>'<button class="ib3'+(k==='add'?' pri':'')+'" onclick="adj('+id+',\''+k+'\')" title="'+l+'" aria-label="'+l+' stok">'+IC(ic)+'<small>'+l+'</small></button>';
function stokNow(){
 const cp=canProd(),PM=prodMap(),tr=allV().filter(x=>!isJ(x.v)),pq=x=>(PM[x.v.id]||{}).tot||0;
 const lo=tr.filter(x=>x.v.stock>0&&x.v.stock<=S.low).length,ou=tr.filter(x=>x.v.stock<1).length,ok=tr.filter(x=>x.v.stock>S.low).length,
  np=tr.filter(x=>pq(x)>0).length,nk=tr.filter(x=>x.v.stock<=S.low&&!pq(x)).length;
 if(!cp&&(sf==='prod'||sf==='krit'))sf='all';
 const chip=(k,t,n,cls)=>`<button class="chp${cls?' '+cls:''} ${sf===k?'on':''}" onclick="sf='${k}';stokNow()">${t}<b>${n}</b></button>`;
 const cm={};tr.forEach(x=>{const n=pcat(x.p);cm[n]=(cm[n]||0)+x.v.stock});
 SCN=Object.keys(cm).sort((a,b)=>a==='Lainnya'?1:b==='Lainnya'?-1:a.localeCompare(b,'id'));
 if(sc!=='Semua'&&!SCN.includes(sc))sc='Semua';
 const cchip=(n,i,t,u)=>`<button class="chp ${sc===n?'on':''}" onclick="sc=${i<0?"'Semua'":'SCN['+i+']'};stokNow()">${esc(t)}<b>${nf(u)}</b></button>`;
 $('pbody').innerHTML=`<div class="sk2"><div class="pfh"><h1 class="pt">Stok produk</h1><input id="sq" class="srch" placeholder="Cari produk atau varian" value="${esc(sq)}" oninput="sq=this.value;stokFill()" autocomplete="off"></div>
 <div class="bar chr">${chip('all','Semua',tr.length)}${chip('low','Menipis',lo)}${chip('out','Habis',ou)}${chip('ok','Aman',ok)}${cp?'<span class="chsep"></span>'+chip('prod','Sedang diproduksi',np,'cprod')+chip('krit','Kritis tanpa restok',nk,'ckrit'):''}</div>
 <div class="bar chr">${cchip('Semua',-1,'Semua jenis',tr.reduce((a,x)=>a+x.v.stock,0))}${SCN.map((n,i)=>cchip(n,i,n,cm[n])).join('')}</div></div>
 <div class="sk3"><div class="rh"><h2>Stok per varian</h2><span class="muted" id="skn"></span></div><div class="sk3s"><div class="sk3w" id="sbs"></div></div></div>`;
 stokFill()}
function stokFill(){
 const cp=canProd(),ed=can('stok_ubah'),PM=prodMap(),ql=sq.trim().toLowerCase(),pq=v=>(PM[v.id]||{}).tot||0;
 const fo=v=>sf==='all'||(sf==='low'&&v.stock>0&&v.stock<=S.low)||(sf==='out'&&v.stock<1)||(sf==='ok'&&v.stock>S.low)||(sf==='prod'&&pq(v)>0)||(sf==='krit'&&v.stock<=S.low&&!pq(v));
 const L=[];S.products.forEach(p=>{if(sc!=='Semua'&&pcat(p)!==sc)return;const vs=p.variants.filter(v=>!isJ(v)&&(!ql||(p.name+' '+vl(v)+' '+bcv(v)).toLowerCase().includes(ql))&&fo(v));if(vs.length)L.push({p,vs})});
 L.sort((a,b)=>{const x=pcat(a.p),y=pcat(b.p);return x===y?a.p.name.localeCompare(b.p.name,'id'):x==='Lainnya'?1:y==='Lainnya'?-1:x.localeCompare(y,'id')});
 const gc='70px 90px 96px 60px'+(cp?' minmax(340px,1fr)':'')+(ed?' 250px':''),mw=(cp?340:0)+(ed?264:0)+400;
 const w=$('sbs');if(!w)return;w.style.setProperty('--gc',gc);w.style.setProperty('--mw',mw+'px');
 const hd='<div class="hd3"><span>Variasi</span><span>Warna</span><span>Status</span><span class="r">Stok</span>'+(cp?'<span>Tahapan produksi (pcs)</span>':'')+(ed?'<span>Ubah stok</span>':'')+'</div>';
 const row=(p,v)=>{const m=PM[v.id],kr=cp&&v.stock<=S.low&&!(m&&m.tot),va=v.size||(v.color?'–':'Standar');
  return '<div class="vr3'+(kr?' kr':'')+'"><b class="v">'+esc(va)+'</b><span class="'+(v.color?'':'mu')+'">'+esc(v.color||'–')+'</span><span>'+sbadge(v)+'</span><b class="q '+cvl(v)+'">'+nf(v.stock)+'</b>'
  +(cp?(kr?'<div class="nk">&#9888; Belum ada order produksi</div>':tahapH(m,true)):'')
  +(ed?'<div class="ub"><input type="text" inputmode="numeric" data-n id="a'+v.id+'" placeholder="Jml" aria-label="Jumlah '+esc(cn(p,v))+'" autocomplete="off">'+sbtn(v.id,'add','plus','Tambah')+sbtn(v.id,'sub','minus','Kurangi')+sbtn(v.id,'set','equal','Ubah jadi')+'</div>':'')+'</div>'};
 const grp=({p,vs})=>{const ag={tot:0};PST.forEach(([k])=>{vs.forEach(v=>{const s=(PM[v.id]||{})[k];if(s){const a=ag[k]=ag[k]||{q:0,late:false};a.q+=s.q;if(s.late)a.late=true;ag.tot+=s.q}})});
  const un=vs.reduce((a,v)=>a+v.stock,0);
  return '<div class="ph3"><div class="pn3"><b>'+esc(p.name)+'</b><small>'+esc(pcat(p))+' · '+vs.length+' varian · '+nf(un)+' unit'+(can('produk_edit')?' · <button class="lnk3" onclick="edFromStok('+p.id+')">Edit produk</button>':'')+'</small></div>'
  +(cp?tahapH(ag,false):'')+(ed?'<span class="mu tt">'+(cp&&ag.tot?'Total diproduksi '+nf(ag.tot)+' pcs':'')+'</span>':'')+'</div>'+vs.map(v=>row(p,v)).join('')};
 w.innerHTML=L.length?hd+L.map(grp).join(''):'<p class="muted">Tidak ada varian yang cocok dengan filter ini.</p>';
 $('skn').textContent=L.length+' produk · '+L.reduce((a,x)=>a+x.vs.length,0)+' varian';stk()}
function sdmClose(){const d=$('sdm');if(d)d.remove()}
function stokLog(){
 $('pbody').innerHTML=`<div class="pfh"><h1 class="pt">Riwayat stok</h1><div class="bar" style="align-items:center;margin:0"><select onchange="lt=this.value;logFill()">${['all','Tambah','Kurangi','Ubah','Penjualan','Hapus'].map(t=>`<option value="${t}" ${lt===t?'selected':''}>${t==='all'?'Semua jenis':t}</option>`).join('')}</select><input id="sq" placeholder="Cari produk atau catatan" value="${esc(sq)}" oninput="sq=this.value;logFill()" style="min-width:160px" autocomplete="off"></div></div><div class="card"><div id="sbody" class="scroll"></div></div>`;logFill()}
function logFill(){
 const ql=sq.toLowerCase(),l=S.log.filter(e=>(lt==='all'||e.type===lt)&&(e.name+' '+e.note).toLowerCase().includes(ql)).slice(0,300);
 $('sbody').innerHTML=l.length?`<table class="hv"><tr><th>Waktu</th><th>Produk / varian</th><th>Jenis</th><th>Sebelum</th><th>Sesudah</th><th>Selisih</th><th>Catatan</th></tr>${l.map(e=>{const d=e.after-e.before;return `<tr><td>${fmt(e.date)}</td><td>${esc(e.name)}</td><td><span class="badge">${e.type}</span></td><td>${e.before}</td><td>${e.after}</td><td class="${d<0?'bad':'ok'}"><b>${d>0?'+':''}${d}</b></td><td>${esc(e.note)}</td></tr>`}).join('')}</table>`:'<p class="muted">Belum ada riwayat perubahan stok. Penambahan, pengubahan, dan penjualan akan tercatat di sini.</p>'}
function sbody(){psub==='riwayat'?logFill():stokFill()}
function adj(id,m){const n=$('a'+id).value;if(n===''||isNaN(n)||+n<0){alert('Isi jumlah dengan angka 0 atau lebih.');return}
 const x=findV(id),b=x.v.stock,a=m==='add'?b+ +n:m==='sub'?Math.max(b-+n,0):+n;
 if(a===b){alert('Stok tidak berubah.');return}
 x.v.stock=a;logS(x,m==='add'?'Tambah':m==='sub'?'Kurangi':'Ubah',b,a,(($('t'+id)||{}).value||'').trim());save();sdmClose();toast(cn(x.p,x.v)+': stok '+nf(b)+' → '+nf(a));vProduk()}
/* ---------- sub menu Barcode & Atur ---------- */
let bq='';
function barcodeView(){
 $('pbody').innerHTML='<div class="pfh"><h1 class="pt">Cetak barcode</h1><div class="bar" style="align-items:center;margin:0"><input id="bq" class="srch" placeholder="Cari produk" value="'+esc(bq)+'" oninput="bq=this.value;bcFill()" autocomplete="off">'+(can('produk_edit')?'<button class="btn sec" onclick="fillBC()">Isi barcode kosong</button>':'')+'</div></div><div id="bcl" class="bcg"></div>';bcFill()}
function bcFill(){const ql=bq.trim().toLowerCase(),l=S.products.filter(p=>!ql||p.name.toLowerCase().includes(ql)||p.variants.some(v=>bcv(v).includes(bq.trim())));
 $('bcl').innerHTML=l.length?l.map(p=>{const vs=p.variants,em=vs.filter(v=>!v.barcode).length,st=vs.reduce((a,v)=>a+(isJ(v)?0:v.stock),0);
  return '<div class="card bcc"><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(pcat(p))+' · '+vs.length+' varian'+(vs.some(isJ)?'':' · stok '+nf(st))+(em?' · <span class="mid2">'+em+' belum ada barcode</span>':'')+'</div></div><button class="btn" onclick="printBC('+p.id+')">'+IC('printer')+' Cetak label</button></div>'}).join(''):'<p class="muted">Produk tidak ditemukan.</p>'}
function aturView(){
 $('pbody').innerHTML='<div class="pfh"><h1 class="pt">Pengaturan stok</h1></div><div class="card atr"><label for="lowi"><b>Batas stok menipis</b><span class="muted">Varian dengan stok sama atau di bawah angka ini ditandai <b class="mid2">Menipis</b>.</span></label><div class="f2"><input id="lowi" type="text" inputmode="numeric" data-n value="'+S.low+'" onkeydown="if(event.key===\'Enter\')setLow(this.value)"><span class="muted">unit</span><button class="btn" onclick="setLow($(\'lowi\').value)">Simpan</button></div></div>'}
/* ---------- FOTO & CETAK BARCODE ---------- */
let PB={pid:null,q:{},size:'50x30',price:true,single:false,only:null};try{Object.assign(PB,JSON.parse(localStorage.getItem('positif_pb')||'{}'))}catch(e){}
async function delImg(id){if(await askC('Hapus foto varian ini?')){findV(id).v.img=null;save();render()}}
function fillBC(pid){let n=0;S.products.forEach(p=>{if(pid&&p.id!==pid)return;p.variants.forEach(v=>{if(!v.barcode){v.barcode=String(v.id);n++}})});
 if(!n){alert('Semua barcode sudah terisi.');return}save();render();alert(n+' barcode diisi sesuai ID varian.')}
function printBC(pid,vid){const p=S.products.find(x=>x.id===pid);PB.pid=pid;PB.only=vid||null;PB.q={};p.variants.forEach(v=>PB.q[v.id]=vid?(v.id===vid?1:0):1);renderPm();$('pm').classList.add('on')}
function closePm(){$('pm').classList.remove('on')}
function renderPm(){
 const p=S.products.find(x=>x.id===PB.pid);if(!p)return;
 $('pmc').innerHTML=`<h2 style="margin:0 0 8px;font-size:24px">Cetak label: ${esc(p.name)}${PB.only?' · '+esc(vl(p.variants.find(v=>v.id===PB.only)||{})):''}</h2>
 <div class="form"><select onchange="PB.size=this.value">${[['40x25','Label 40 x 25 mm'],['50x30','Label 50 x 30 mm'],['60x40','Label 60 x 40 mm']].map(o=>`<option value="${o[0]}" ${PB.size===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
 <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" ${PB.price?'checked':''} onchange="PB.price=this.checked"> Tampilkan harga</label>
 <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" ${PB.single?'checked':''} onchange="PB.single=this.checked"> Satu label per halaman (printer stiker)</label></div>
 <div class="scroll"><table><tr><th>Varian</th><th>Barcode</th><th>Stok</th><th>Jumlah label</th></tr>${p.variants.filter(v=>!PB.only||v.id===PB.only).map(v=>`<tr><td>${esc(vl(v))}</td><td><small>${esc(bcv(v))}</small></td><td>${v.stock>=9999?'jasa':nf(v.stock)}</td><td><input type="text" inputmode="numeric" data-n min="0" value="${PB.q[v.id]||0}" style="width:90px" onchange="PB.q[${v.id}]=Math.max(0,+this.value||0)"></td></tr>`).join('')}</table></div>
 <div class="row" style="flex-wrap:wrap"><span>${PB.only?'':'<button class="btn sec" onclick="pbAll(1)">Semua 1</button> <button class="btn sec" onclick="pbAll(0)">Sesuai stok</button>'}</span><span><button class="btn sec" onclick="closePm()">Batal</button> <button class="btn" onclick="doPrint()">Cetak</button></span></div>`}
function pbAll(m){const p=S.products.find(x=>x.id===PB.pid);p.variants.forEach(v=>PB.q[v.id]=m?1:(v.stock>=9999?1:Math.min(v.stock,500)));renderPm()}
function doPrint(){
 if(!window.JsBarcode){alert('Pustaka barcode belum termuat. Periksa koneksi internet lalu muat ulang halaman.');return}
 const p=S.products.find(x=>x.id===PB.pid),[w,h]=PB.size.split('x').map(Number);let html='',n=0;const tot=p.variants.reduce((a,v)=>a+(PB.q[v.id]||0),0);if(tot>500){alert('Maksimal 500 label sekali cetak. Sekarang '+tot+' label, kurangi jumlahnya.');return}try{localStorage.setItem('positif_pb',JSON.stringify({size:PB.size,price:PB.price,single:PB.single}))}catch(e){}
 p.variants.forEach(v=>{const c=PB.q[v.id]||0;for(let i=0;i<c&&n<500;i++,n++)html+=`<div class="lb" style="width:${w}mm;height:${h}mm"><div class="ln">${esc(p.name)}</div><div class="lv">${esc(vl(v))}</div><svg class="bcs" style="max-height:${(h*.42).toFixed(1)}mm" data-c="${esc(bcv(v))}"></svg>${PB.price?`<div class="lp">${rp(vp(p,v))}</div>`:''}</div>`});
 if(!n){alert('Isi jumlah label yang akan dicetak.');return}
 const box=$('plabels');box.innerHTML=html;
 box.querySelectorAll('svg.bcs').forEach(s=>{try{JsBarcode(s,s.dataset.c,{format:'CODE128',width:2,height:h>=40?40:30,displayValue:true,fontSize:12,margin:0});
  if(!s.getAttribute('viewBox'))s.setAttribute('viewBox','0 0 '+parseFloat(s.getAttribute('width'))+' '+parseFloat(s.getAttribute('height')))}catch(e){s.outerHTML='<div class="lv">'+esc(s.dataset.c)+'</div>'}});
 const st=document.createElement('style');st.id='pgs';st.textContent=PB.single?`@page{size:${w}mm ${h}mm;margin:0}.lb{page-break-after:always}.lb:last-child{page-break-after:auto}`:'@page{margin:6mm}';document.head.appendChild(st);
 document.body.classList.add('print-labels');closePm();
 const done=()=>{document.body.classList.remove('print-labels');const s=$('pgs');if(s)s.remove();window.removeEventListener('afterprint',done);document.removeEventListener('pointerdown',done,true)};
 window.addEventListener('afterprint',done);document.addEventListener('pointerdown',done,true);setTimeout(()=>window.print(),150)}
boot();
</script></body></html>
